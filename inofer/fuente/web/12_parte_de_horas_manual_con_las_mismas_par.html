  <script>
    // ===== Parte de horas manual con las mismas paradas (códigos) que la Orden de Producción =====
    (function () {
      const $ = id => document.getElementById(id);
      const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const CODS = () => (typeof INOFER_28_CODES !== 'undefined' ? INOFER_28_CODES : []);
      const catDeCodigo = cod => { const n = parseInt(String(cod || ''), 10); return (window.INOFER_CODIGO_CATEGORIA || {})[n] || 'otros'; };
      const fmtMin = m => { const h = Math.floor(m / 60), r = Math.round(m % 60); return h ? (h + ' h' + (r ? ' ' + r + ' min' : '')) : (r + ' min'); };
      let modoCategorias = false; // registros viejos cargados por categoría

      function fila(p) {
        p = p || {};
        const pm = Number(p.min) || 0;
        const inp = 'rounded-lg border border-slate-700 bg-slate-950 px-2 py-1.5 text-center text-xs font-bold text-white';
        return `<div class="pp-row flex flex-wrap items-center gap-2 rounded-lg border border-rose-500/30 bg-rose-500/5 p-2">
          <select class="pp-cod min-w-[180px] flex-1 rounded-lg border border-slate-700 bg-slate-950 px-2 py-1.5 text-xs text-white">
            <option value="">Elegí el motivo…</option>${CODS().map(c => `<option value="${esc(c)}" ${p.codigo === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
          </select>
          <label class="flex items-center gap-1 text-[11px] text-slate-400"><input type="number" min="0" class="pp-h ${inp}" style="width:3.8rem" placeholder="0" value="${pm >= 60 ? Math.floor(pm / 60) : ''}"> h</label>
          <label class="flex items-center gap-1 text-[11px] text-slate-400"><input type="number" min="0" class="pp-m ${inp}" style="width:3.8rem" placeholder="0" value="${pm % 60 || ''}"> min</label>
          <button type="button" class="pp-del rounded-lg border border-slate-700 px-2 py-1 text-xs text-rose-300" title="Quitar">✕</button>
        </div>`;
      }
      function leer() {
        return [...document.querySelectorAll('#ppLista .pp-row')].map(r => ({
          codigo: r.querySelector('.pp-cod').value,
          min: (Number(r.querySelector('.pp-h').value) || 0) * 60 + (Number(r.querySelector('.pp-m').value) || 0)
        })).filter(p => p.codigo || p.min);
      }
      // Pasa las paradas por código a las horas por categoría del tablero (inputs ocultos modal_*)
      function volcar() {
        if (modoCategorias) return;
        const tot = {};
        (typeof CATEGORIES !== 'undefined' ? CATEGORIES : []).forEach(c => { tot[c.key] = 0; });
        leer().forEach(p => { const k = catDeCodigo(p.codigo); tot[k] = (tot[k] || 0) + p.min / 60; });
        Object.keys(tot).forEach(k => { const el = $('modal_' + k); if (el) el.value = Math.round(tot[k] * 100) / 100; });
        const sum = leer().reduce((a, p) => a + p.min, 0);
        const t = $('ppTotal'); if (t) t.textContent = leer().length ? `${leer().length} parada${leer().length > 1 ? 's' : ''} · ${fmtMin(sum)}` : 'Sin paradas';
        try { updateModalPreview(); } catch (e) { }
      }
      window.inoferParadasDelModal = () => (modoCategorias ? undefined : leer().filter(p => p.codigo && p.min));

      function modo(cat) {
        modoCategorias = cat;
        const grid = $('modal_parada_maquina') && $('modal_parada_maquina').closest('.grid');
        if (grid) grid.classList.toggle('hidden', !cat);
        $('ppBox').classList.toggle('hidden', cat);
        $('ppLegacy').classList.toggle('hidden', !cat);
      }
      function montar() {
        const grid = $('modal_parada_maquina') && $('modal_parada_maquina').closest('.grid');
        if (!grid || $('ppBox')) return;
        const box = document.createElement('div');
        box.id = 'ppBox'; box.className = 'space-y-2';
        box.innerHTML = `<div class="flex items-center justify-between gap-2"><span class="text-xs font-bold text-slate-300">Paradas (mismos códigos que la Orden de Producción)</span><span id="ppTotal" class="text-[11px] text-slate-400">Sin paradas</span></div>
          <div id="ppLista" class="space-y-2"></div>
          <button type="button" id="ppAdd" class="rounded-lg border border-dashed border-rose-500/40 px-3 py-1.5 text-xs font-bold text-rose-200">+ Agregar parada</button>`;
        const legacy = document.createElement('div');
        legacy.id = 'ppLegacy'; legacy.className = 'hidden rounded-lg border border-slate-700 bg-slate-950/60 p-2 text-[11px] text-slate-400';
        legacy.innerHTML = 'Este parte se cargó antes, con las horas por categoría. Podés corregirlo así o <button type="button" id="ppPasarCodigos" class="font-bold text-cyan-300 underline">cargarlo con los códigos de parada</button>.';
        grid.parentElement.insertBefore(box, grid);
        grid.parentElement.insertBefore(legacy, grid);
        grid.classList.add('hidden');
        $('ppAdd').addEventListener('click', () => { $('ppLista').insertAdjacentHTML('beforeend', fila()); volcar(); });
        $('ppPasarCodigos').addEventListener('click', () => { modo(false); $('ppLista').innerHTML = fila(); volcar(); });
        box.addEventListener('click', e => { const d = e.target.closest('.pp-del'); if (d) { d.closest('.pp-row').remove(); volcar(); } });
        box.addEventListener('input', volcar);
        box.addEventListener('change', volcar);
        // validar antes de guardar
        $('newEntryForm').addEventListener('submit', e => {
          if (modoCategorias) return;
          const ps = leer();
          if (ps.some(p => !p.codigo)) { e.preventDefault(); e.stopImmediatePropagation(); showToast('Elegí el motivo de cada parada'); return; }
          if (ps.some(p => !p.min)) { e.preventDefault(); e.stopImmediatePropagation(); showToast('Poné cuánto duró cada parada'); return; }
          volcar();
        }, true);
        // abrir nuevo
        $('openNewEntryModalBtn').addEventListener('click', () => { modo(false); $('ppLista').innerHTML = ''; volcar(); });
        // abrir para editar
        if (typeof window.openEditRecordModal === 'function') {
          const oe = window.openEditRecordModal;
          window.openEditRecordModal = function (id) {
            const r = oe.apply(this, arguments);
            try {
              const rec = (records || []).find(x => String(x.id) === String(id));
              const ps = rec && Array.isArray(rec.paradas) ? rec.paradas : [];
              const hayCat = rec && (typeof CATEGORIES !== 'undefined' ? CATEGORIES : []).some(c => Number(rec[c.key]) > 0);
              if (ps.length || !hayCat) { modo(false); $('ppLista').innerHTML = ps.map(p => fila(p)).join(''); volcar(); }
              else modo(true);
            } catch (e) { }
            return r;
          };
        }
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(montar, 0)); else setTimeout(montar, 0);
    })();
  </script>
