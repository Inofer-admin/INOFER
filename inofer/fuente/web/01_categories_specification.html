  <script>
    // Categories specification
    const CATEGORIES = [
      { key: 'parada_maquina', label: 'Paradas de máquina (rotura / inyectora)', shortLabel: 'Parada Máquina', color: '#f43f5e' },
      { key: 'setup_molde', label: 'Setup / Cambio de molde', shortLabel: 'Setup / Molde', color: '#f59e0b' },
      { key: 'puesta_punto', label: 'Puesta a punto / Arranque', shortLabel: 'Puesta a Punto', color: '#fb923c' },
      { key: 'mant_preventivo', label: 'Mantenimiento preventivo', shortLabel: 'Mant. Preventivo', color: '#38bdf8' },
      { key: 'mant_correctivo', label: 'Mantenimiento correctivo', shortLabel: 'Mant. Correctivo', color: '#ec4899' },
      { key: 'falta_material', label: 'Falta de material', shortLabel: 'Falta Material', color: '#a855f7' },
      { key: 'falta_operario', label: 'Falta de operario', shortLabel: 'Falta Operario', color: '#6366f1' },
      { key: 'otros', label: 'Otros', shortLabel: 'Otros', color: '#94a3b8' }
    ];

    // Initial sample dataset so the dashboard looks rich and functional immediately
    const INITIAL_RECORDS = [
      {
        id: 'rec-1',
        date: '2026-10-25',
        machine: 'Italpresse 200 Tn (N)',
        shift: 'Mañana',
        available: 8,
        parada_maquina: 0.5,
        setup_molde: 0.75,
        puesta_punto: 0.25,
        mant_preventivo: 0,
        mant_correctivo: 0,
        falta_material: 0,
        falta_operario: 0,
        otros: 0
      },
      {
        id: 'rec-2',
        date: '2026-10-25',
        machine: 'Italpresse 200 Tn (V)',
        shift: 'Mañana',
        available: 8,
        parada_maquina: 1.25,
        setup_molde: 0.5,
        puesta_punto: 0.25,
        mant_preventivo: 0,
        mant_correctivo: 0.5,
        falta_material: 0,
        falta_operario: 0,
        otros: 0.25
      },
      {
        id: 'rec-3',
        date: '2026-10-26',
        machine: 'Italpresse 180 Tn',
        shift: 'Tarde',
        available: 8,
        parada_maquina: 0.25,
        setup_molde: 1.0,
        puesta_punto: 0.5,
        mant_preventivo: 0.5,
        mant_correctivo: 0,
        falta_material: 0.25,
        falta_operario: 0,
        otros: 0
      },
      {
        id: 'rec-4',
        date: '2026-10-26',
        machine: 'H-50',
        shift: 'Noche',
        available: 8,
        parada_maquina: 0.5,
        setup_molde: 0,
        puesta_punto: 0.25,
        mant_preventivo: 0,
        mant_correctivo: 0,
        falta_material: 0.5,
        falta_operario: 0.25,
        otros: 0.25
      },
      {
        id: 'rec-5',
        date: '2026-10-27',
        machine: 'Italpresse 30 Tn (Z-30)',
        shift: 'Mañana',
        available: 8,
        parada_maquina: 0.75,
        setup_molde: 0.5,
        puesta_punto: 0.25,
        mant_preventivo: 0,
        mant_correctivo: 0.25,
        falta_material: 0,
        falta_operario: 0,
        otros: 0
      }
    ];

    let records = [];
    let barChartInstance = null;
    let doughnutChartInstance = null;
    let cloudApiUrl = '';
    let isSyncing = false;
    let editingRecordId = null;

    function hasAppsScriptRuntime() {
      return typeof window !== 'undefined' && window.google && window.google.script && window.google.script.run;
    }

    function updateSyncStatusUI(mode, detail) {
      const dot = document.getElementById('syncStatusDot');
      const txt = document.getElementById('syncStatusText');
      if (!dot || !txt) return;
      if (mode === 'live') {
        dot.className = 'h-2 w-2 rounded-full bg-emerald-400 animate-pulse';
        txt.textContent = detail || 'En Vivo (Sincronizado)';
      } else if (mode === 'syncing') {
        dot.className = 'h-2 w-2 rounded-full bg-cyan-400 animate-ping';
        txt.textContent = 'Sincronizando...';
      } else {
        dot.className = 'h-2 w-2 rounded-full bg-amber-400';
        txt.textContent = detail || 'Modo Local (Configurar Nube)';
      }
    }

    // Dirección de la nube de la planta: los equipos nuevos se conectan solos (los datos siguen protegidos por usuario y clave)
    const INOFER_NUBE_PREDETERMINADA = 'https://script.google.com/macros/s/AKfycbzymlhXpbf4lWUTsyi9vMJYLqXDO9MesUNEntv60-anDlQR-axCPCzrgIPd5-isQ9YW/exec';

    function loadState() {
      try {
        // Siempre la nube de la planta: así una PC que tenía guardada una dirección vieja
        // (de otra implementación sin usuarios) no queda pidiendo "crear administrador".
        const guardada = localStorage.getItem('tablero_inyectoras_cloud_url') || '';
        cloudApiUrl = INOFER_NUBE_PREDETERMINADA || guardada;
        if (INOFER_NUBE_PREDETERMINADA && guardada !== INOFER_NUBE_PREDETERMINADA) {
          try { localStorage.setItem('tablero_inyectoras_cloud_url', INOFER_NUBE_PREDETERMINADA); } catch (e) {}
        }
        const inputEl = document.getElementById('cloudEndpointInput');
        if (inputEl && cloudApiUrl) inputEl.value = cloudApiUrl;
        const saved = localStorage.getItem('tablero_inyectoras_records_v2');
        if (saved) {
          records = JSON.parse(saved);
        } else {
          records = JSON.parse(JSON.stringify(INITIAL_RECORDS));
        }
      } catch (e) {
        records = JSON.parse(JSON.stringify(INITIAL_RECORDS));
      }
    }

    function saveState() {
      try {
        localStorage.setItem('tablero_inyectoras_records_v2', JSON.stringify(records));
      } catch (e) {
        // Ignore storage errors in sandboxed frames
      }
    }

    // ------------------------------------------------------------
    // SINCRONIZACIÓN (FIX): los cambios locales pendientes (alta / edición / baja)
    // nunca se pisan con una copia vieja de la nube. Si la nube no confirma el
    // cambio, se reenvía el listado completo ("replace") para auto-corregirla.
    // ------------------------------------------------------------
    const dirtyRecords = {};      // id -> { type: 'add'|'edit'|'delete', entry, attempts }
    let pendingCloudOps = 0;
    let replaceInFlight = false;
    let lastLocalChangeAt = 0;

    // los partes pendientes de subir sobreviven a cerrar la app (para trabajar sin internet)
    const PEND_PARTES_KEY = 'tablero_inyectoras_pend_partes_v1';
    function guardarDirty() { try { localStorage.setItem(PEND_PARTES_KEY, JSON.stringify(dirtyRecords)); } catch (e) {} try { window.inoferOfflineUI && window.inoferOfflineUI(); } catch (e) {} }
    try { const pp = JSON.parse(localStorage.getItem(PEND_PARTES_KEY) || '{}') || {}; Object.keys(pp).forEach(k => { if (pp[k] && pp[k].type) { pp[k].attempts = 0; dirtyRecords[k] = pp[k]; } }); } catch (e) {}
    window.inoferPartesPendientes = () => Object.keys(dirtyRecords).length;
    function markRecordDirty(id, type, entry) {
      dirtyRecords[String(id)] = { type, entry: entry ? JSON.parse(JSON.stringify(entry)) : null, attempts: 0 };
      lastLocalChangeAt = Date.now();
      guardarDirty();
    }

    function sameRecordData(a, b) {
      if (!a || !b) return false;
      const keys = ['available'].concat(CATEGORIES.map(c => c.key));
      if (String(a.machine) !== String(b.machine) || String(a.shift) !== String(b.shift)) return false;
      if (String(a.date).slice(0, 10) !== String(b.date).slice(0, 10)) return false;
      return keys.every(k => Math.abs((Number(a[k]) || 0) - (Number(b[k]) || 0)) < 1e-6);
    }

    function applyRemoteRecords(remote) {
      if (!Array.isArray(remote)) return;
      const merged = remote.slice();
      let needsReplace = false;
      Object.keys(dirtyRecords).forEach(id => {
        const d = dirtyRecords[id];
        const idx = merged.findIndex(r => String(r.id) === id);
        if (d.type === 'delete') {
          if (idx !== -1) { merged.splice(idx, 1); needsReplace = true; } else { delete dirtyRecords[id]; return; }
        } else {
          if (idx === -1) { merged.unshift(d.entry); needsReplace = true; }
          else if (!sameRecordData(merged[idx], d.entry)) { merged[idx] = d.entry; needsReplace = true; }
          else { delete dirtyRecords[id]; return; }
        }
        d.attempts++;
        if (d.attempts > 3) {
          delete dirtyRecords[id];
          showToast('Aviso: la nube no confirmó un cambio. Revisá el Apps Script (Código.gs).');
        }
      });
      records = merged;
      guardarDirty();
      saveState();
      refreshAll();
      if (needsReplace && Object.keys(dirtyRecords).length > 0 && !replaceInFlight) {
        sendCloudReplace(records);
      }
    }

    function sendCloudReplace(list) {
      replaceInFlight = true;
      pendingCloudOps++;
      const done = () => { pendingCloudOps = Math.max(0, pendingCloudOps - 1); replaceInFlight = false; };
      if (hasAppsScriptRuntime()) {
        window.google.script.run
          .withSuccessHandler((remote) => { done(); applyRemoteRecords(remote); updateSyncStatusUI('live', 'En Vivo · Apps Script'); })
          .withFailureHandler(() => { done(); updateSyncStatusUI('local', 'Error al guardar en nube'); })
          .reemplazarRegistros(list);
      } else if (cloudApiUrl) {
        fetch(cloudApiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ token: inoferAuthToken(), action: 'replace', records: list, borrados: Object.keys(dirtyRecords).filter(id => dirtyRecords[id] && dirtyRecords[id].type === 'delete') })
        })
          .then(r => r.json())
          .then(inoferHandleCloudReply)
          .then(data => { done(); if (data && Array.isArray(data.records)) applyRemoteRecords(data.records); updateSyncStatusUI('live', 'En Vivo · Nube'); })
          .catch(() => { done(); updateSyncStatusUI('local', 'Error al sincronizar URL'); });
      } else {
        done();
      }
    }

    // Aplica en este dispositivo lo que otros dispositivos guardaron en la nube
    // (órdenes, Gantt, catálogo de piezas, cierres semanales, memoria de la IA y configuración).
    // Solo redibuja si algo cambió, para no interrumpir a quien está cargando datos.
    function applyCloudModules(mods) {
      const same = (a, b) => { try { return JSON.stringify(a) === JSON.stringify(b); } catch (e) { return false; } };
      const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
      let changed = { orders: false, gantt: false, catalog: false, weekly: false };
      if (Array.isArray(mods.orders) && mods.orders.length > 0 && !same(mods.orders, productionOrders)) {
        productionOrders = mods.orders; store('tablero_inyectoras_orders_v1', productionOrders); changed.orders = true;
      }
      if (mods.gantt && Object.keys(mods.gantt).length > 0 && !same(mods.gantt, ganttWeeksData)) {
        ganttWeeksData = mods.gantt; store('tablero_inyectoras_gantt_weeks_v1', ganttWeeksData); changed.gantt = true;
        if (!ganttWeeksData[activeGanttWeekCode]) activeGanttWeekCode = Object.keys(ganttWeeksData)[0];
      }
      if (Array.isArray(mods.catalog) && mods.catalog.length > 0 && !same(mods.catalog, partsCatalog)) {
        partsCatalog = mods.catalog; store('tablero_inyectoras_catalog_v3', partsCatalog); changed.catalog = true;
      }
      if (Array.isArray(mods.weekly) && !same(mods.weekly, weeklyArchives)) {
        weeklyArchives = mods.weekly; store('tablero_inyectoras_weekly_v1', weeklyArchives); changed.weekly = true;
        try { updateWeeklyBadge(); } catch (e) {}
      }
      if (mods.memory && !same({ ...inoferMemory, ...mods.memory }, inoferMemory)) {
        inoferMemory = { ...inoferMemory, ...mods.memory };
        store('tablero_inyectoras_inofer_memory_v1', inoferMemory);
        try { renderInoferMemoryUI(); } catch (e) {}
      }
      if (mods.config && mods.config.geminiKey && !geminiApiKey) {
        geminiApiKey = mods.config.geminiKey;
        try { localStorage.setItem('tablero_inyectoras_gemini_key', geminiApiKey); } catch (e) {}
        const ki = document.getElementById('geminiApiKeyInput'); if (ki) ki.value = geminiApiKey;
        const b = document.getElementById('aiEngineModeBadge'); if (b) b.textContent = 'Gemini API Activa';
      }
      const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
      if (typing) return; // se redibuja en la próxima sincronización
      try { if (changed.orders && typeof renderProductionOrdersView === 'function') renderProductionOrdersView(); } catch (e) {}
      try { if (changed.orders && typeof renderGlobalOrdersReportView === 'function') renderGlobalOrdersReportView(); } catch (e) {}
      try { if (changed.catalog && typeof renderPartsCatalogView === 'function') renderPartsCatalogView(); } catch (e) {}
      try { if (changed.gantt && typeof renderGanttView === 'function') renderGanttView(); } catch (e) {}
    }

    // Primera conexión de un dispositivo a la nube: si la nube está vacía ofrece subir
    // los datos de este dispositivo; si ya tiene datos, este dispositivo los descarga.
    let connectingCloud = false;
    async function firstConnectSync() {
      connectingCloud = true;
      updateSyncStatusUI('syncing');
      try {
        const sep = cloudApiUrl.includes('?') ? '&' : '?';
        const data = inoferHandleCloudReply(await (await fetch(cloudApiUrl + sep + 'action=json&t=' + Date.now() + inoferTokenParam())).json());
        if (!data || !Array.isArray(data.records)) throw new Error('respuesta inválida');
        const mods = data.modules || {};
        const isEmpty = v => !v || (Array.isArray(v) ? v.length === 0 : Object.keys(v).length === 0);
        let uploaded = false;
        if (data.records.length === 0 && records.length > 0) {
          if (confirm('La nube todavía está vacía.\n\n¿Subir los datos de este dispositivo para compartirlos con todos los demás?')) {
            pushCloudAction('replace', { records });
            uploaded = true;
          }
        }
        const local = { orders: productionOrders, gantt: ganttWeeksData, catalog: partsCatalog, weekly: weeklyArchives, memory: inoferMemory };
        Object.keys(local).forEach(k => { if (isEmpty(mods[k]) && !isEmpty(local[k])) pushCloudModuleState(k, local[k]); });
        if (!uploaded && data.records.length > 0) {
          applyRemoteRecords(data.records);
          applyCloudModules(mods);
        }
        updateSyncStatusUI('live', 'En Vivo · Nube');
        showToast(uploaded ? 'Datos subidos a la nube. Ya podés conectar los demás dispositivos.' : 'Conectado a la nube: este dispositivo ya está sincronizado.');
      } catch (e) {
        updateSyncStatusUI('local', 'No se pudo conectar');
        showToast('No se pudo conectar con esa URL. Revisá que termine en /exec y que el acceso sea "Cualquier usuario".');
      } finally {
        setTimeout(() => { connectingCloud = false; }, 2500);
      }
    }

    function fetchCloudRecords(silent) {
      if (isSyncing || connectingCloud) return;
      if (typeof inoferSession !== 'undefined' && !inoferSession) return; // primero hay que ingresar
      // No pisar datos locales mientras hay cambios en vuelo o recién hechos
      if (pendingCloudOps > 0 || (Date.now() - lastLocalChangeAt) < 6000) return;
      if (hasAppsScriptRuntime()) {
        isSyncing = true;
        if (!silent) updateSyncStatusUI('syncing');
        window.google.script.run
          .withSuccessHandler((remoteRecords) => {
            isSyncing = false;
            if (Array.isArray(remoteRecords)) applyRemoteRecords(remoteRecords);
            updateSyncStatusUI('live', 'En Vivo · Apps Script');
          })
          .withFailureHandler(() => {
            isSyncing = false;
            updateSyncStatusUI('local', 'Error de red');
          })
          .obtenerRegistros();
      } else if (cloudApiUrl) {
        isSyncing = true;
        if (!silent) updateSyncStatusUI('syncing');
        const sep = cloudApiUrl.includes('?') ? '&' : '?';
        // Primero se pregunta qué cambió (respuesta chiquita) y se baja solo eso
        const V = window.__inoferVersiones;
        const pedirTodo = !V || !silent || Date.now() - (window.__inoferTodoAt || 0) > 10 * 60000;
        const paso1 = pedirTodo ? Promise.resolve(null) : fetch(cloudApiUrl + sep + 'action=versiones&t=' + Date.now() + inoferTokenParam()).then(r => r.json()).then(inoferHandleCloudReply);
        paso1.then(v => {
          let url = cloudApiUrl + sep + 'action=json&t=' + Date.now() + inoferTokenParam();
          if (v && v.status === 'ok' && v.versiones) {
            const cambio = Object.keys(Object.assign({}, v.versiones, V)).filter(k => v.versiones[k] !== V[k]);
            const hayPartesPend = Object.keys(dirtyRecords).length > 0;
            if (!cambio.length && !hayPartesPend) { isSyncing = false; updateSyncStatusUI('live', 'En Vivo · Nube'); return null; }
            const mods = cambio.filter(k => k !== 'records');
            const partes = cambio.includes('records') || hayPartesPend;
            url += (mods.length ? '&solo=' + encodeURIComponent(mods.join(',')) : '&solo=-') + (partes ? '' : '&partes=0');
          } else if (v && v.status === 'error') { isSyncing = false; return null; }
          return fetch(url).then(r => r.json()).then(inoferHandleCloudReply);
        })
          .then(data => {
            if (!data) return;
            isSyncing = false;
            if (data && (Array.isArray(data.records) || data.parcial)) {
              if (data.versiones) window.__inoferVersiones = data.versiones;
              if (!data.parcial) window.__inoferTodoAt = Date.now();
              if (data.modules) applyCloudModules(data.parcial ? Object.assign({ __parcial: true }, data.modules) : data.modules);
              if (Array.isArray(data.records)) applyRemoteRecords(data.records);
              updateSyncStatusUI('live', 'En Vivo · Nube');
            }
          })
          .catch(() => {
            isSyncing = false;
            updateSyncStatusUI('local', 'Sin conexión a URL');
          });
      } else {
        updateSyncStatusUI('local', 'Modo Local');
      }
    }

    function pushCloudAction(action, payload) {
      if (action === 'add' && payload.entry) markRecordDirty(payload.entry.id, 'add', payload.entry);
      else if (action === 'edit' && payload.entry) markRecordDirty(payload.entry.id, 'edit', payload.entry);
      else if (action === 'delete') markRecordDirty(payload.id, 'delete', null);
      else lastLocalChangeAt = Date.now();

      if (hasAppsScriptRuntime()) {
        updateSyncStatusUI('syncing');
        pendingCloudOps++;
        const end = () => { pendingCloudOps = Math.max(0, pendingCloudOps - 1); };
        const runner = window.google.script.run
          .withSuccessHandler((remoteRecords) => {
            end();
            if (Array.isArray(remoteRecords)) applyRemoteRecords(remoteRecords);
            updateSyncStatusUI('live', 'En Vivo · Apps Script');
          })
          .withFailureHandler(() => {
            end();
            // Si el script de la nube es viejo (sin editarRegistro, etc.) reenviamos todo el listado
            if (action === 'edit' || action === 'add' || action === 'delete') {
              sendCloudReplace(records);
            } else {
              updateSyncStatusUI('local', 'Error al guardar en nube');
            }
          });

        if (action === 'add') runner.guardarRegistro(payload.entry);
        else if (action === 'edit') runner.editarRegistro(payload.entry);
        else if (action === 'delete') runner.eliminarRegistro(payload.id);
        else if (action === 'replace') runner.reemplazarRegistros(payload.records);
        else end();
      } else if (cloudApiUrl) {
        updateSyncStatusUI('syncing');
        pendingCloudOps++;
        const end = () => { pendingCloudOps = Math.max(0, pendingCloudOps - 1); };
        fetch(cloudApiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ token: inoferAuthToken(), action, ...payload })
        })
          .then(r => r.json())
          .then(inoferHandleCloudReply)
          .then(data => {
            end();
            if (data && Array.isArray(data.records)) applyRemoteRecords(data.records);
            updateSyncStatusUI('live', 'En Vivo · Nube');
          })
          .catch(() => {
            end();
            updateSyncStatusUI('local', 'Error al sincronizar URL');
          });
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toastNotification');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 2800);
    }

    function getFilteredRecords() {
      const machine = document.getElementById('filterMachine').value;
      const shift = document.getElementById('filterShift').value;
      const from = document.getElementById('filterDateFrom').value;
      const to = document.getElementById('filterDateTo').value;

      return records.filter(r => {
        if (machine !== 'ALL' && r.machine !== machine) return false;
        if (shift !== 'ALL' && r.shift !== shift) return false;
        if (from && r.date < from) return false;
        if (to && r.date > to) return false;
        return true;
      });
    }

    function computeAggregates(list) {
      let totalAvailable = 0;
      let totalStoppages = 0;
      const byCategory = {};
      CATEGORIES.forEach(c => { byCategory[c.key] = 0; });

      list.forEach(r => {
        const avail = Number(r.available) || 0;
        totalAvailable += avail;
        CATEGORIES.forEach(c => {
          const val = Number(r[c.key]) || 0;
          byCategory[c.key] += val;
          totalStoppages += val;
        });
      });

      const productiveHours = Math.max(0, totalAvailable - totalStoppages);
      const utilizationPct = totalAvailable > 0 ? (productiveHours / totalAvailable) * 100 : 0;

      return {
        totalAvailable,
        totalStoppages,
        productiveHours,
        utilizationPct,
        byCategory
      };
    }

    // Update Main Speedometer SVG & KPIs
    function renderMainSpeedometer(agg) {
      const pct = Math.max(0, Math.min(100, agg.utilizationPct));
      const target = Number(document.getElementById('targetUtilizationInput').value) || 80;

      // Arc length is pi * R = 3.14159 * 80 = 251.32
      const maxArc = 251.32;
      const offset = maxArc - (pct / 100) * maxArc;
      document.getElementById('mainGaugeActiveArc').style.strokeDashoffset = offset.toFixed(2);

      // Needle rotation: -90deg (0%) to +90deg (100%)
      const angle = -90 + (pct / 100) * 180;
      document.getElementById('mainGaugeNeedle').style.transform = `rotate(${angle.toFixed(1)}deg)`;

      document.getElementById('mainUtilPctText').textContent = `${pct.toFixed(1)}%`;
      document.getElementById('kpiAvailableHrs').textContent = `${agg.totalAvailable.toFixed(2)} h`;
      document.getElementById('kpiProductiveHrs').textContent = `${agg.productiveHours.toFixed(2)} h`;
      document.getElementById('kpiDowntimeHrs').textContent = `${agg.totalStoppages.toFixed(2)} h`;

      const badge = document.getElementById('statusBadgeMain');
      if (agg.totalAvailable === 0) {
        badge.textContent = 'Sin Datos';
        badge.className = 'rounded-lg px-3 py-1 text-xs font-bold bg-slate-800 text-slate-400 border border-slate-700';
      } else if (pct >= target) {
        badge.textContent = `Óptimo (Meta ≥ ${target}%)`;
        badge.className = 'rounded-lg px-3 py-1 text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
      } else if (pct >= target - 15) {
        badge.textContent = `Atención (Meta ${target}%)`;
        badge.className = 'rounded-lg px-3 py-1 text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30';
      } else {
        badge.textContent = `Bajo Meta (< ${target}%)`;
        badge.className = 'rounded-lg px-3 py-1 text-xs font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30';
      }
    }

    // Render 8 Mini Speedometers for each Stoppage Category
    function renderCategorySpeedometers(agg) {
      const container = document.getElementById('categoryGaugesGrid');
      const maxArc = 125.66; // R=40 -> pi*40 = 125.66

      let topCat = null;
      let topVal = 0;

      const html = CATEGORIES.map(cat => {
        const hrs = agg.byCategory[cat.key] || 0;

    function learnFromUserInteraction(queryText, detectedTopic, summaryKpi) {
      const q = (queryText || '').toLowerCase();
      inoferMemory.interactionsCount = (inoferMemory.interactionsCount || 0) + 1;
      if (detectedTopic && inoferMemory.topicCounts[detectedTopic] !== undefined) {
        inoferMemory.topicCounts[detectedTopic] += 1;
      }

      // Check machine focus
      if (q.includes('200v') || (q.includes('200') && q.includes('(v)'))) inoferMemory.machineFocusCounts['200V'] += 1;
      if (q.includes('200n') || (q.includes('200') && q.includes('(n)'))) inoferMemory.machineFocusCounts['200N'] += 1;
      if (q.includes('180')) inoferMemory.machineFocusCounts['180'] += 1;
      if (q.includes('h50') || q.includes('h-50')) inoferMemory.machineFocusCounts['H50'] += 1;
      if (q.includes('z30') || q.includes('z-30') || q.includes('30 tn')) inoferMemory.machineFocusCounts['Z30'] += 1;

      // Check if user is explicitly teaching a rule in chat
      const teachMatch = queryText.match(/(?:record[aá] que|aprend[eé] que|ten[eé] en cuenta que|regla:|nota:|criterio:)\s*(.+)/i);
      if (teachMatch && teachMatch[1]) {
        const cleanRule = teachMatch[1].trim();
        if (cleanRule.length > 3 && !inoferMemory.learnedNotes.includes(cleanRule)) {
          inoferMemory.learnedNotes.unshift(cleanRule);
          if (inoferMemory.learnedNotes.length > 12) inoferMemory.learnedNotes.pop();
        }
      }

      // Log report snapshot
      if (summaryKpi) {
        inoferMemory.reportsLog.unshift({
          date: new Date().toISOString().slice(0, 10),
          topic: detectedTopic || 'general',
          query: queryText.slice(0, 80),
          ...summaryKpi
        });
        if (inoferMemory.reportsLog.length > 15) inoferMemory.reportsLog.pop();
      }

      saveInoferMemory();
    }

    function buildLearnedMemoryFooter(ctx, detectedTopic) {

      if (prevLogs.length > 0 && prevLogs[0].utilizationPct !== undefined) {
        const diff = ctx.agg.utilizationPct - prevLogs[0].utilizationPct;
        if (Math.abs(diff) >= 0.1) {
          compareText = diff > 0
            ? `Comparado con tu consulta anterior (${prevLogs[0].utilizationPct.toFixed(1)}%), la utilización actual subió **+${diff.toFixed(1)} puntos**.`
            : `Comparado con tu consulta anterior (${prevLogs[0].utilizationPct.toFixed(1)}%), la utilización actual varió **${diff.toFixed(1)} puntos**.`;
        }
      }
      const activeRule = notes[0] ? `*"${notes[0]}"*` : 'optimización continua OEE/SMED';
      return `\n\n### 🧠 Aprendizaje Activo de INOFER (Consulta #${inoferMemory.interactionsCount})\n* **Criterio aprendido aplicado**: ${activeRule}\n${compareText ? `* **Seguimiento evolutivo**: ${compareText}\n` : ''}* *Tip: Podés enseñarme nuevas reglas de tu planta escribiendo "Recordá que..." en el chat o desde el panel de Memoria.*`;
    }

        productive: Number(ctx.agg.productiveHours.toFixed(2)),
        stoppages: Number(ctx.agg.totalStoppages.toFixed(2)),
        utilizationPct: Number(ctx.agg.utilizationPct.toFixed(1)),
        topCause: top1 && top1.hrs > 0 ? `${top1.shortLabel} (${top1.hrs.toFixed(2)}h)` : 'Sin paradas',
        worstMachine: worstM ? `${worstM.machine} (${worstM.utilizationPct.toFixed(1)}%)` : '-'
      };

      weeklyArchives.unshift(snap);
      saveWeeklyArchives();
      const inputEl = document.getElementById('weeklyLabelInput');
      if (inputEl) inputEl.value = '';

      renderInoferDynamicChart('weekly_evolution');
      appendAiChatMessage(
        'assistant',
        `✅ **¡Registro de Cierre Semanal guardado por INOFER!**\n\n* **Etiqueta**: **${snap.label}**\n* **Partes consolidados**: ${snap.recordsCount} registros\n* **Horas Disponibles**: **${snap.available.toFixed(2)} hs**\n* **Horas Productivas (Utilización)**: **${snap.productive.toFixed(2)} hs** (**${snap.utilizationPct.toFixed(1)}%**)\n* **Total Paradas**: **${snap.stoppages.toFixed(2)} hs** (Principal causa: *${snap.topCause}*)\n* **Máquina más crítica**: *${snap.worstMachine}*\n\nActualicé el gráfico superior con la evolución de cierres semanales.`
      );
      showToast(`Cierre semanal "${snap.label}" guardado`);
    }

    function formatWeeklyArchivesReport() {
      if (weeklyArchives.length === 0) {
        return `📅 **Todavía no hay cierres semanales guardados.**\n\nPodés guardar el resumen de la semana actual escribiendo el nombre de la semana a la izquierda (por ejemplo *"Semana 43"*) y tocando **"Guardar Cierre Semanal"**, o diciéndome en el chat: *"INOFER, guardá el cierre semanal"*.`;
      }
      renderInoferDynamicChart('weekly_evolution');
      const lines = weeklyArchives.map((w, i) =>
        `${i + 1}. **${w.label}** (${w.savedAt}): Utilización **${w.utilizationPct.toFixed(1)}%** (${w.productive.toFixed(1)}h prod. / ${w.available.toFixed(1)}h disp. | Paradas: ${w.stoppages.toFixed(1)}h — Mayor causa: *${w.topCause}*).`
      ).join('\n');

      let trendNote = '';
      if (weeklyArchives.length >= 2) {
        const diff = weeklyArchives[0].utilizationPct - weeklyArchives[1].utilizationPct;
        trendNote = diff >= 0
          ? `\n\n📈 **Evolución Semanal**: La última semana (**${weeklyArchives[0].label}**) mejoró **+${diff.toFixed(1)} puntos porcentuales** respecto a la anterior (**${weeklyArchives[1].label}**).`
          : `\n\n📉 **Evolución Semanal**: La última semana (**${weeklyArchives[0].label}**) bajó **${diff.toFixed(1)} puntos porcentuales** respecto a la anterior (**${weeklyArchives[1].label}**).`;
      }

      return `### 📅 Historial de Registros Semanales Guardados por INOFER (${weeklyArchives.length})

${lines}${trendNote}`;
    }

    function tryParseChatWeeklyRecordLoad(userQuery) {
      const q = (userQuery || '').toLowerCase();

      // Check if user is explicitly teaching a rule
      const onlyTeachMatch = userQuery.match(/^(?:inofer[,\s]*)?(?:record[aá] que|aprend[eé] que|ten[eé] en cuenta que|regla:|nota:)\s*(.+)/i);
      if (onlyTeachMatch && onlyTeachMatch[1] && !q.includes('informe') && !q.includes('disponible')) {
        const rule = onlyTeachMatch[1].trim();
        learnFromUserInteraction(userQuery, 'mejoras', null);
        appendAiChatMessage('assistant', `🧠 **¡Aprendido y guardado en mi memoria permanente!**\n\nAcabo de registrar el criterio: *"${rule}"*. Lo voy a tener en cuenta en todos los próximos informes, diagnósticos de órdenes y recomendaciones de Gantt que me pidas.`);
        showToast('INOFER aprendió una nueva regla');
        return true;
      }

      const isSaveCloseCmd = (q.includes('guarda') || q.includes('guardar')) && (q.includes('cierre semanal') || q.includes('resumen semanal'));
      if (isSaveCloseCmd) {
        saveCurrentWeeklySnapshot();
        return true;
      }

      const isViewWeeksCmd = (q.includes('ver') || q.includes('mostrar') || q.includes('historial') || q.includes('comparar')) && q.includes('seman');
      if (isViewWeeksCmd && !q.includes('disponible')) {
        appendAiChatMessage('assistant', formatWeeklyArchivesReport());
        return true;
      }

      const isLoadIntent = q.includes('guardar') || q.includes('guardá') || q.includes('cargar') || q.includes('cargá') || q.includes('registrar') || q.includes('registrá');
      if (!isLoadIntent) return false;

      let matchedMachine = null;
      if (q.includes('200') && q.includes('(n)') || q.includes('200 n') || q.includes('200tn (n)')) matchedMachine = 'Italpresse 200 Tn (N)';
      else if (q.includes('200') && q.includes('(v)') || q.includes('200 v') || q.includes('200tn (v)')) matchedMachine = 'Italpresse 200 Tn (V)';
      else if (q.includes('180')) matchedMachine = 'Italpresse 180 Tn';
      else if (q.includes('h-50') || q.includes('h50') || q.includes('h 50')) matchedMachine = 'H-50';
      else if (q.includes('30') || q.includes('z-30') || q.includes('z30')) matchedMachine = 'Italpresse 30 Tn (Z-30)';
      else if (q.includes('200')) matchedMachine = 'Italpresse 200 Tn (N)';

      const availMatch = q.match(/(\d+(?:[.,]\d+)?)\s*(?:hs?|horas?)?\s*disponibles?/) || q.match(/disponibles?\s*:?\s*(\d+(?:[.,]\d+)?)/);
      if (!matchedMachine && !availMatch) return false;

      const availHrs = availMatch ? parseFloat(availMatch[1].replace(',', '.')) : (q.includes('seman') ? 120 : 8);
      const extractCat = (regexList) => {
        for (const rgx of regexList) {
          const m = q.match(rgx);
          if (m) return parseFloat(m[1].replace(',', '.')) || 0;
        }
        return 0;
      };

      const entry = {
        id: 'rec-' + Date.now(),
        date: new Date().toISOString().slice(0, 10),
        machine: matchedMachine || 'Italpresse 200 Tn (N)',
        shift: q.includes('seman') ? 'Semana Completa' : (q.includes('tarde') ? 'Tarde' : (q.includes('noche') ? 'Noche' : 'Mañana')),
        available: availHrs,
        parada_maquina: extractCat([/(\d+(?:[.,]\d+)?)\s*(?:hs?|horas?)?\s*(?:de\s+)?(?:paradas? de m[aá]quina|roturas?|inyectora)/, /(?:paradas? de m[aá]quina|roturas?)\s*:?\s*(\d+(?:[.,]\d+)?)/]),
        setup_molde: extractCat([/(\d+(?:[.,]\d+)?)\s*(?:hs?|horas?)?\s*(?:de\s+)?(?:setup|cambio de molde|molde)/, /(?:setup|cambio de molde|molde)\s*:?\s*(\d+(?:[.,]\d+)?)/]),
        puesta_punto: extractCat([/(\d+(?:[.,]\d+)?)\s*(?:hs?|horas?)?\s*(?:de\s+)?(?:puesta a punto|arranque)/, /(?:puesta a punto|arranque)\s*:?\s*(\d+(?:[.,]\d+)?)/]),
        mant_preventivo: extractCat([/(\d+(?:[.,]\d+)?)\s*(?:hs?|horas?)?\s*(?:de\s+)?(?:mantenimiento\s+)?preventivo/, /preventivo\s*:?\s*(\d+(?:[.,]\d+)?)/]),
        mant_correctivo: extractCat([/(\d+(?:[.,]\d+)?)\s*(?:hs?|horas?)?\s*(?:de\s+)?(?:mantenimiento\s+)?correctivo/, /correctivo\s*:?\s*(\d+(?:[.,]\d+)?)/]),
        falta_material: extractCat([/(\d+(?:[.,]\d+)?)\s*(?:hs?|horas?)?\s*(?:de\s+)?(?:falta de\s+)?material/, /material\s*:?\s*(\d+(?:[.,]\d+)?)/]),
        falta_operario: extractCat([/(\d+(?:[.,]\d+)?)\s*(?:hs?|horas?)?\s*(?:de\s+)?(?:falta de\s+)?operario/, /operario\s*:?\s*(\d+(?:[.,]\d+)?)/]),
        otros: extractCat([/(\d+(?:[.,]\d+)?)\s*(?:hs?|horas?)?\s*(?:de\s+)?otros/, /otros\s*:?\s*(\d+(?:[.,]\d+)?)/])
      };

      let stopSum = 0;
      CATEGORIES.forEach(c => { stopSum += entry[c.key] || 0; });
      if (stopSum > entry.available) {
        appendAiChatMessage('assistant', `⚠️ **Atención**: La suma de paradas que me indicaste (**${stopSum.toFixed(2)} hs**) supera las horas disponibles (**${entry.available.toFixed(2)} hs**). Corregí los valores y volvé a enviármelo.`);
        return true;
      }

      const prodHrs = entry.available - stopSum;
      const pct = (prodHrs / entry.available) * 100;

      records.unshift(entry);
      saveState();
      refreshAll();
      pushCloudAction('add', { entry });
      learnFromUserInteraction(userQuery, 'utilizacion', { utilizationPct: pct });

      appendAiChatMessage(
        'assistant',
        `✅ **¡Registro guardado en el tablero por INOFER!**\n\n* **Máquina**: **${entry.machine}**\n* **Período / Turno**: ${entry.shift} (${entry.date})\n* **Horas Disponibles**: **${entry.available.toFixed(2)} hs**\n* **Horas de Utilización Efectiva**: **${prodHrs.toFixed(2)} hs** (**${pct.toFixed(1)}%**)\n* **Total Horas de Parada**: **${stopSum.toFixed(2)} hs**\n\nTodos los velocímetros y gráficos ya fueron actualizados automáticamente.`
      );
      showToast('Registro cargado por INOFER');
      return true;
    }

    function buildDetailedPlantContext() {
      const filtered = getFilteredRecords();
      const agg = computeAggregates(filtered);
      const target = Number(document.getElementById('targetUtilizationInput').value) || 80;

      const sortedCats = CATEGORIES.map(c => {
        const hrs = agg.byCategory[c.key] || 0;
        const pctAvail = agg.totalAvailable > 0 ? (hrs / agg.totalAvailable) * 100 : 0;
        const pctStop = agg.totalStoppages > 0 ? (hrs / agg.totalStoppages) * 100 : 0;
        return { ...c, hrs, pctAvail, pctStop };
      }).sort((a, b) => b.hrs - a.hrs);

      const machineStats = MACHINES_LIST.map(mach => {
        const mRecs = filtered.filter(r => r.machine === mach);
        const mAgg = computeAggregates(mRecs);
        let topC = null;
        let topH = 0;
        CATEGORIES.forEach(c => {
          if ((mAgg.byCategory[c.key] || 0) > topH) {
            topH = mAgg.byCategory[c.key];
            topC = c.shortLabel;
          }
        });
        return {
          machine: mach,
          recordsCount: mRecs.length,
          available: mAgg.totalAvailable,
          productive: mAgg.productiveHours,
          stoppages: mAgg.totalStoppages,
          utilizationPct: mAgg.utilizationPct,
          topCause: topC || 'Sin paradas',
          topCauseHrs: topH
        };
      }).filter(m => m.available > 0).sort((a, b) => a.utilizationPct - b.utilizationPct);

      const shifts = ['Mañana', 'Tarde', 'Noche', 'Día Completo', 'Semana Completa'];
      const shiftStats = shifts.map(sh => {
        const sRecs = filtered.filter(r => r.shift === sh);
        const sAgg = computeAggregates(sRecs);
        let topC = null;
        let topH = 0;
        CATEGORIES.forEach(c => {
          if ((sAgg.byCategory[c.key] || 0) > topH) {
            topH = sAgg.byCategory[c.key];
            topC = c.shortLabel;
          }
        });
        return {
          shift: sh,
          recordsCount: sRecs.length,
          available: sAgg.totalAvailable,
          productive: sAgg.productiveHours,
          stoppages: sAgg.totalStoppages,
          utilizationPct: sAgg.utilizationPct,
          topCause: topC || 'Sin paradas',
          topCauseHrs: topH
        };
      }).filter(s => s.available > 0);

      return {
        filtered,
        agg,
        target,
        sortedCats,
        machineStats,
        shiftStats
      };
    }

    function generateLocalExpertAiResponse(userQuery) {

      const ctx = buildDetailedPlantContext();

      const top2 = ctx.sortedCats[1] || { label: 'Parada Máquina', shortLabel: 'Parada Máquina', hrs: 0, pctAvail: 0, pctStop: 0 };

          `2. **Solapa Órdenes de Producción y Calidad**:\n` +
          `   * **${rep.totalOrders} orden/es activa/s** con **${rep.globalProgressPct.toFixed(1)}%** de avance global, **${rep.globalEffPct.toFixed(1)}%** de eficiencia de cadencia y **${rep.globalQualityPct.toFixed(1)}%** de calidad (${rep.totalScrapPcs} pzas scrap/arranque).\n` +
          `3. **Solapa Base de Datos de Piezas y Moldes**:\n` +
          `   * **${(partsCatalog || []).length} piezas/moldes** estandarizados con autocompletado activo de bocas, cadencia (u/h) y pesos.\n` +
          `4. **Solapa Plan Gantt (${week ? week.code : 'Semanal'})**:\n` +
          `   * Programación activa vinculada con órdenes de fabricación y cálculo de kilos de **ALSI** y **ZAMAC**.\n\n` +
          `### 💡 3 Tips Estratégicos Integrales\n` +
          `* **Sincronizar Gantt con SMED**: Alistá los moldes y precalentá material de la próxima orden del Gantt 30 minutos antes de finalizar el lote actual.\n` +
          `* **Realimentar la Base de Datos**: Si en la solapa de Órdenes una pieza supera o queda debajo del STD u/h de forma constante, actualizá su cadencia real en la Base de Datos.\n` +
          `* **Foco en ${worstMach ? worstMach.machine : 'Inyectoras principales'}**: Reducir un 25% su parada principal (*${worstMach ? worstMach.topCause : top1.shortLabel}*) libera horas directas para adelantar el Plan Gantt.` +
          buildLearnedMemoryFooter(ctx, 'utilizacion');
      }

      // 2. Check Base de Datos & Standards Audit
      if (q.includes('base de datos') || q.includes('estándar') || q.includes('estandar') || q.includes('catálogo') || q.includes('catalogo') || q.includes('std')) {
        learnFromUserInteraction(userQuery, 'base_datos', { utilizationPct: ctx.agg.utilizationPct });
        renderInoferDynamicChart('orders_efficiency');
        const catLines = (partsCatalog || []).slice(0, 8).map(p =>
          `* **Pieza ${p.part}** (Molde Base ${p.mold}): **${p.unitsPerHour} u/h** (${p.cavities} boca/s) | Máquina: *${p.machine}* | ${p.material} (${Number(p.weightWithSprueKg).toFixed(3)} kg c/colada).`
        ).join('\n');

        return `### 🗄️ Auditoría de Base de Datos de Piezas y Estándares (STD u/h)\n\nActualmente tenés **${(partsCatalog || []).length} piezas/moldes** cargados en tu catálogo maestro:\n${catLines || '* Sin piezas en base.'}\n\n### 💡 Tips para Optimizar tu Base de Datos\n* **Validación de Cadencia Real vs. Teórica**: Cruzá la columna *Cadencia Real* del Informe General de Órdenes contra el valor *Unidades por hora* de esta base para ajustar los tiempos presupuestados en el Gantt.\n* **Control de Peso con Colada**: Mantener actualizado el peso con colada y pulmón permite que tanto las Órdenes como el Gantt calculen sin desvío los kilos de **ALSI** y **ZAMAC** a fundir.` +
          buildLearnedMemoryFooter(ctx, 'base_datos');
      }

      // 3. Check Materials in Gantt (ALSI / ZAMAC / Colada / Recupero)
      if (q.includes('material') || q.includes('alsi') || q.includes('zamac') || q.includes('colada') || q.includes('recupero') || q.includes('horno') || q.includes('crisol')) {
        learnFromUserInteraction(userQuery, 'materiales', { utilizationPct: ctx.agg.utilizationPct });
        renderInoferDynamicChart('gantt_materials');
        const week = typeof getActiveGanttWeek === 'function' ? getActiveGanttWeek() : null;
        let alsiCol = 0, alsiRec = 0, zamacCol = 0, zamacRec = 0;
        if (week) {
          GANTT_MACHINES_CONFIG.forEach(mach => {
            const mData = week.machines?.[mach.id] || { items: [] };
            (mData.items || []).forEach(it => {
              const totQ = (it.dailyQty || []).reduce((a, b) => a + (Number(b) || 0), 0);
              if ((it.mat || '').toLowerCase() === 'alsi') {
                alsiCol += totQ * (Number(it.weightKg) || 0);
                alsiRec += totQ * (Number(it.recuperoKg) || 0);
              } else {
                zamacCol += totQ * (Number(it.weightKg) || 0);
                zamacRec += totQ * (Number(it.recuperoKg) || 0);
              }
            });
          });
        }

        return `### ⚖️ Informe de Materiales, Colada y Recupero (${week ? week.code : 'Planta INOFER'})\n\n* **Aluminio (ALSI)**: **${alsiCol.toFixed(1)} kg** totales con colada | **${alsiRec.toFixed(1)} kg** de recupero estimado (${alsiCol > 0 ? ((alsiRec / alsiCol) * 100).toFixed(1) : 0}% retorno).\n* **ZAMAC**: **${zamacCol.toFixed(1)} kg** totales con colada | **${zamacRec.toFixed(1)} kg** de recupero estimado.\n\n### 💡 Tips Técnicos de Fundición, Crisol y Ahorro de Material\n* **Proporción Lingote Virgen / Recupero**: En **ZAMAC** y **ALSI**, mantener una mezcla controlada (ej. 70% lingote virgen / 30% colada limpia y desgasificada) evita porosidades (Código 13) y ampollas por temperatura (Código 6).\n* **Programación de Desgasificado (DESG) y Lingoteo (LING)**: Agrupá los lotes de la misma aleación en la grilla del Gantt para evitar paradas de **CMA (Cambio de Material)** y pérdidas térmicas en el crisol (Códigos 20, 21 y 24).` +
          buildLearnedMemoryFooter(ctx, 'materiales');
      }

      // 4. Check Gantt Schedule & Sequence Optimization
      if (q.includes('gantt') || q.includes('programaci') || q.includes('planificaci') || q.includes('cronograma') || q.includes('secuencia') || q.includes('cmo') || q.includes('cma')) {
        learnFromUserInteraction(userQuery, 'gantt', { utilizationPct: ctx.agg.utilizationPct });
        renderInoferDynamicChart('gantt_load');
        const week = typeof getActiveGanttWeek === 'function' ? getActiveGanttWeek() : null;
        if (!week) return 'No hay semanas cargadas en el Plan Gantt.';
        let lines = [];
        GANTT_MACHINES_CONFIG.forEach(mach => {
          const mData = week.machines[mach.id] || { aux: {}, items: [] };
          const items = mData.items || [];
          let iH = 0, aH = 0;
          Object.values(mData.aux || {}).forEach(arr => { (arr || []).forEach(v => { aH += Number(v) || 0; }); });
          items.forEach(it => {
            const std = Number(it.stdRate) || 60;
            (it.dailyQty || []).forEach(qty => { iH += std > 0 ? (Number(qty) || 0) / std : 0; });
          });
          if (items.length > 0 || aH > 0) {
            const pzas = items.map(it => `${it.part} (${it.totalQty} u.)`).join(', ') || 'Solo tareas aux.';
            lines.push(`* **${mach.name}**: **${(iH + aH).toFixed(1)}h totales** (${iH.toFixed(1)}h inyección + ${aH.toFixed(1)}h aux) — Piezas: ${pzas}.`);
          } else {
            lines.push(`* **${mach.name}**: Capacidad 100% libre en ${week.code}.`);
          }
        });

        return `### 📅 Auditoría del Plan Gantt y Tips de Secuenciación — ${week.code}\n\n${lines.join('\n')}\n\n### ⚡ Ideas de Mejora para la Programación Gantt\n* **Reducción de CMO (Cambio de Molde) y ALIS (Alistamiento)**: Secuenciá de corrido las piezas que comparten portamolde o familia dimensional antes de bajar el molde.\n* **Balanceo entre 200V y 200N**: Como ambas máquinas comparten compatibilidad en la mayoría de los moldes de Aluminio (ALSI), derivá los lotes de mayor tirada a la máquina con menos cambios programados en la semana.\n* **Vinculación inmediata con OP**: Usá el botón **Crear OP** en cada fila del Gantt para emitir la Orden de Fabricación antes del turno del lunes.` +
          buildLearnedMemoryFooter(ctx, 'gantt');
      }

      // 5. Check Production Orders, Scrap & Tooling (Dorso / 28 Codes)
      const wantsOrdersReport = q.includes('orden') || q.includes('órdenes') || q.includes('fabricación') || q.includes('fabricacion') || q.includes('scrap') || q.includes('herramental') || q.includes('dorso') || q.includes('código') || q.includes('codigo');
      if (wantsOrdersReport) {
        learnFromUserInteraction(userQuery, 'ordenes', { utilizationPct: ctx.agg.utilizationPct });
        renderInoferDynamicChart('orders_efficiency');
        const rep = typeof computeGlobalOrdersReport === 'function' ? computeGlobalOrdersReport() : null;
        if (!rep) return 'No hay órdenes de producción cargadas.';

        let mLines = rep.machineEfficiency.map(m =>
          `* **${m.machine}**: **${m.efficiencyPct.toFixed(1)}% eficiencia** (${m.ordersCount} OP | ${m.okPcs.toLocaleString('es-AR')} pzas OK | Scrap: ${m.scrapPcs} u. | Calidad: **${m.qualityPct.toFixed(1)}%**).`
        ).join('\n');

        return `### 📋 Informe de Órdenes de Producción, Calidad y Herramental\n\n* **Total Órdenes**: **${rep.totalOrders} órdenes** (${rep.inProgressOrders} en proceso, ${rep.completedOrders} completadas)\n* **Avance Global de Lotes**: **${rep.totalOkPcs.toLocaleString('es-AR')} / ${rep.totalTargetPcs.toLocaleString('es-AR')} unidades** (**${rep.globalProgressPct.toFixed(1)}%**)\n* **Eficiencia General de Cadencia**: **${rep.globalEffPct.toFixed(1)}%** (${rep.totalWorkedHours.toFixed(1)}h reales vs. ${rep.totalStdHours.toFixed(1)}h estándar)\n* **Calidad Global y Scrap**: **${rep.globalQualityPct.toFixed(1)}% OK** (${rep.totalScrapPcs} piezas entre arranque en baja y scrap de prod.)\n\n### 🏭 Desempeño de Órdenes por Máquina\n${mLines}\n\n### 🎯 Tips Técnicos para Bajar Scrap, Arranque en Baja y Cuidar el Herramental\n* **Reducir Arranque en Baja**: Precalentar el molde de forma uniforme antes de la primera inyección disminuye hasta un 50% las piezas rechazadas por falta de llenado (Código 8), pliegues (Código 9) o manchas (Código 7).\n* **Control de Refrigeración (Dorso de la OP)**: Verificar el estado de **abrazaderas, puentes y mangueras** al subir el molde evita pérdidas de agua (Código 14) y ampollas por sobretemperatura (Código 6).\n* **Mantenimiento de Correderas y Expulsión**: Lubricar y limpiar correderas por filtración (Código 17) al cierre de cada turno previene roturas de figura/noyos (Códigos 4 y 10) y exceso de rebabas (Código 12).` +
          buildLearnedMemoryFooter(ctx, 'ordenes');
      }

      // 6. Check Machine Ranking
      const wantsMachineDiag = q.includes('máquina') || q.includes('maquina') || q.includes('inyectora') || q.includes('italpresse') || q.includes('h-50') || q.includes('z-30') || q.includes('ranking');
      if (wantsMachineDiag && !q.includes('informe ejecutivo completo')) {
        learnFromUserInteraction(userQuery, 'utilizacion', { utilizationPct: ctx.agg.utilizationPct });
        renderInoferDynamicChart('util_machines');
        const lines = ctx.machineStats.map((m, idx) =>
          `${idx + 1}. **${m.machine}**: Utilización de **${m.utilizationPct.toFixed(1)}%** (${m.productive.toFixed(2)}h productivas de ${m.available.toFixed(2)}h disponibles). Paradas: ${m.stoppages.toFixed(2)}h — Principal causa: *${m.topCause}* (${m.topCauseHrs.toFixed(2)}h).`
        ).join('\n');

        return `### 🏭 Diagnóstico por Máquina Inyectora (De más crítica a mayor utilización)\n\nAnalizando **${ctx.filtered.length} partes (${ctx.agg.totalAvailable.toFixed(2)} hs disponibles)**:\n\n${lines}\n\n### 🎯 Tips Técnicos por Máquina\n* **Prioridad #1 (${worstMach ? worstMach.machine : '-'})**: Registra la menor utilización (**${worstMach ? worstMach.utilizationPct.toFixed(1) : 0}%**), afectada por **${worstMach ? worstMach.topCause : '-'}** (${worstMach ? worstMach.topCauseHrs.toFixed(2) : 0} hs). Auditar periféricos, circuito hidráulico y usar bridas estandarizadas.\n* **Benchmark interno (${bestMach ? bestMach.machine : '-'})**: Lidera con **${bestMach ? bestMach.utilizationPct.toFixed(1) : 0}%** de utilización. Replicar su método de preparación de molde en las demás máquinas.` +
          buildLearnedMemoryFooter(ctx, 'utilizacion');
      }

      // 7. Check Shifts Comparison
      if (q.includes('turno') || q.includes('mañana') || q.includes('tarde') || q.includes('noche')) {
        learnFromUserInteraction(userQuery, 'utilizacion', { utilizationPct: ctx.agg.utilizationPct });
        renderInoferDynamicChart('stoppages_pareto');
        const sLines = ctx.shiftStats.map(s =>
          `* **Turno ${s.shift}**: **${s.utilizationPct.toFixed(1)}%** de utilización (${s.productive.toFixed(2)}h prod. / ${s.available.toFixed(2)}h disp. en ${s.recordsCount} partes). Mayor pérdida: *${s.topCause}* (${s.topCauseHrs.toFixed(2)}h).`
        ).join('\n');

        return `### 🕒 Comparativa Operativa por Turnos y Tips de Relevos\n\n${sLines}\n\n### 💡 Tips Prácticos para Cambios de Turno\n* **Entrega de máquina en marcha (Relevo al pie)**: Realizar el traspaso entre operadores sin detener el ciclo de inyección ahorra entre 15 y 25 minutos por turno.\n* **Kit previo para Turno Tarde / Noche**: Dejar el molde del siguiente cambio ya verificado (cáncamo, fechador y puentes de agua) y el material cargado al pie de máquina.` +
          buildLearnedMemoryFooter(ctx, 'utilizacion');
      }

      // 8. Check Simulation (+30%)
      if (q.includes('simul') || q.includes('30%') || q.includes('25%') || q.includes('proyecc') || q.includes('ganar')) {
        learnFromUserInteraction(userQuery, 'mejoras', { utilizationPct: ctx.agg.utilizationPct });
        renderInoferDynamicChart('stoppages_pareto');
        const savingsTop2 = (top1.hrs + top2.hrs) * 0.30;
        const newProdHrs = Math.min(ctx.agg.totalAvailable, ctx.agg.productiveHours + savingsTop2);
        const newUtilPct = ctx.agg.totalAvailable > 0 ? (newProdHrs / ctx.agg.totalAvailable) * 100 : 0;
        const gainPoints = newUtilPct - ctx.agg.utilizationPct;

        return `### 🚀 Simulación de Mejora: Reducción del 30% en las 2 Principales Paradas\n\nActualmente las 2 mayores pérdidas acumulan **${(top1.hrs + top2.hrs).toFixed(2)} hs** (${(top1.pctStop + top2.pctStop).toFixed(1)}% de todo el tiempo improductivo):\n1. **${top1.label}**: ${top1.hrs.toFixed(2)} hs\n2. **${top2.label}**: ${top2.hrs.toFixed(2)} hs\n\n### 📈 Impacto Directo en el Velocímetro\n* **Horas extra de producción recuperadas**: **+${savingsTop2.toFixed(2)} hs** netas de inyección.\n* **Nueva Utilización proyectada**: Pasaría de **${ctx.agg.utilizationPct.toFixed(1)}%** a **${newUtilPct.toFixed(1)}%** (**+${gainPoints.toFixed(1)} puntos porcentuales**).\n* **Meta del ${ctx.target}%**: ${newUtilPct >= ctx.target ? '✅ ¡Con esta mejora superás la meta objetivo de planta!' : `Quedarías a solo ${(ctx.target - newUtilPct).toFixed(1)} puntos de alcanzar la meta del ${ctx.target}%.`}` +
          buildLearnedMemoryFooter(ctx, 'mejoras');
      }

      // 9. Check Ideas & Tips (SMED / TPM)
      if (q.includes('idea') || q.includes('mejor') || q.includes('smed') || q.includes('recomend') || q.includes('reducir') || q.includes('setup') || q.includes('mantenimiento') || q.includes('tip')) {
        learnFromUserInteraction(userQuery, 'mejoras', { utilizationPct: ctx.agg.utilizationPct });
        renderInoferDynamicChart('stoppages_pareto');
        const mantCorrHrs = (ctx.agg.byCategory['mant_correctivo'] || 0) + (ctx.agg.byCategory['parada_maquina'] || 0);
        const mantPrevHrs = ctx.agg.byCategory['mant_preventivo'] || 0;
        const setupPuestaHrs = (ctx.agg.byCategory['setup_molde'] || 0) + (ctx.agg.byCategory['puesta_punto'] || 0);

        return `### 💡 Plan de Ideas de Mejora y Tips de Planta (${ctx.filtered.length} registros)\n\nEl **${(top1.pctStop + top2.pctStop).toFixed(1)}%** de las paradas se concentra en **${top1.shortLabel}** (${top1.hrs.toFixed(2)}h) y **${top2.shortLabel}** (${top2.hrs.toFixed(2)}h):\n\n1. **SMED en Setup y Puesta a Punto (${setupPuestaHrs.toFixed(2)} hs acumuladas)**:\n   * **Tareas Externas**: Precalentar el molde entrante, revisar fechador, cáncamo y preparar puentes de refrigeración *mientras la inyectora termina la orden anterior*.\n   * **Ficha de Parámetros por Molde**: Documentar presiones, velocidades y temperaturas óptimas para reducir el tiempo de arranque y el arranque en baja.\n2. **Mantenimiento Preventivo vs. Correctivo (${mantCorrHrs.toFixed(2)} hs por roturas vs. ${mantPrevHrs.toFixed(2)} hs preventivo)**:\n   * Implementar chequeo rápido semanal de pistón (Código 23), crisol (Código 24), quemador del horno (Código 25) y limpieza de correderas (Código 17) en **${worstMach ? worstMach.machine : 'las máquinas críticas'}**.\n3. **Abastecimiento Continuo**:\n   * Coordinar el llenado y fundición del crisol (Código 20) fuera de las horas pico de inyección.` +
          buildLearnedMemoryFooter(ctx, 'mejoras');
      }

      // 10. Default: Executive Report + Chart
      learnFromUserInteraction(userQuery, 'utilizacion', { utilizationPct: ctx.agg.utilizationPct });
      renderInoferDynamicChart('util_machines');
      const statusText = gapToTarget <= 0

    function formatMarkdownToHtml(md) {

        .replace(/^#### (.*$)/gm, '<div class="font-bold text-cyan-300 mt-2">$1</div>')
        .replace(/^(\s*)[*-] (?=\S)/gm, '$1• ')

        .replace(/^### (.*$)/gm, '<h4 class="text-xs font-extrabold uppercase tracking-wider text-violet-300 mt-3 mb-1">$1</h4>')

        .replace(/\*(.*?)\*/g, '<em class="text-cyan-300 not-italic">$1</em>')

    }

    const AI_MACHINE_ALIASES = [

    const AI_CAUSE_TIPS = {

    const AI_MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

    function aiYmd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    function aiAddDays(d, n) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
    function aiFmt(ymd) { const p = String(ymd).slice(0, 10).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : ymd; }
    function aiDaysBetween(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000) + 1; }

    function aiParsePeriod(q) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      let m;
      if (/\bhoy\b/.test(q)) return { from: aiYmd(today), to: aiYmd(today), label: 'Hoy' };
      if (/\bayer\b/.test(q)) { const y = aiAddDays(today, -1); return { from: aiYmd(y), to: aiYmd(y), label: 'Ayer' }; }
      if ((m = q.match(/[uú]ltim[oa]s?\s+(\d{1,3})\s+d[ií]as/))) { const n = Number(m[1]); return { from: aiYmd(aiAddDays(today, -(n - 1))), to: aiYmd(today), label: `Últimos ${n} días` }; }
      if ((m = q.match(/[uú]ltim[oa]s?\s+(\d{1,2})\s+semanas/))) { const n = Number(m[1]); return { from: aiYmd(aiAddDays(today, -(n * 7 - 1))), to: aiYmd(today), label: `Últimas ${n} semanas` }; }
      const dow = (today.getDay() + 6) % 7; // lunes = 0
      if (/semana pasada|semana anterior/.test(q)) { const s = aiAddDays(today, -dow - 7); return { from: aiYmd(s), to: aiYmd(aiAddDays(s, 6)), label: 'Semana pasada' }; }
      if (/esta semana|semana actual/.test(q)) { const s = aiAddDays(today, -dow); return { from: aiYmd(s), to: aiYmd(today), label: 'Esta semana' }; }
      if (/mes pasado|mes anterior/.test(q)) { const s = new Date(today.getFullYear(), today.getMonth() - 1, 1); const e = new Date(today.getFullYear(), today.getMonth(), 0); return { from: aiYmd(s), to: aiYmd(e), label: 'Mes pasado' }; }
      if (/este mes|mes actual/.test(q)) { const s = new Date(today.getFullYear(), today.getMonth(), 1); return { from: aiYmd(s), to: aiYmd(today), label: 'Este mes' }; }
      if ((m = q.match(/(?:del?|desde)\s+(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s+(?:al|hasta|a)\s+(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/))) {
        const y1 = m[3] ? (m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3])) : today.getFullYear();
        const y2 = m[6] ? (m[6].length === 2 ? 2000 + Number(m[6]) : Number(m[6])) : y1;
        const a = aiYmd(new Date(y1, Number(m[2]) - 1, Number(m[1]))), b = aiYmd(new Date(y2, Number(m[5]) - 1, Number(m[4])));
        return { from: a, to: b, label: `Del ${aiFmt(a)} al ${aiFmt(b)}` };
      }
      if ((m = q.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))) {
        const y = m[3] ? (m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3])) : today.getFullYear();
        const d = aiYmd(new Date(y, Number(m[2]) - 1, Number(m[1])));
        return { from: d, to: d, label: aiFmt(d) };
      }
      for (let i = 0; i < 12; i++) {
        if (new RegExp('\\b' + AI_MONTHS[i] + '\\b').test(q)) {
          const ym = q.match(new RegExp(AI_MONTHS[i] + '\\s+(?:de\\s+|del\\s+)?(20\\d\\d)'));
          let y = ym ? Number(ym[1]) : today.getFullYear();
          if (!ym && i > today.getMonth()) y -= 1;
          const s = new Date(y, i, 1), e = new Date(y, i + 1, 0);
          return { from: aiYmd(s), to: aiYmd(e), label: AI_MONTHS[i].charAt(0).toUpperCase() + AI_MONTHS[i].slice(1) + ' ' + y };
        }
      }
      return null;
    }

    function aiParseQuery(text) {
      const q = (text || '').toLowerCase();
      const machines = AI_MACHINE_ALIASES.filter(a => a.re.test(q)).map(a => a.name);
      const cats = AI_CATEGORY_ALIASES.filter(a => a.re.test(q)).map(a => a.key);
      let shift = null;
      if (/turno\s+(de\s+la\s+)?ma[nñ]ana/.test(q)) shift = 'Mañana';
      else if (/turno\s+(de\s+la\s+)?tarde|\bla tarde\b/.test(q)) shift = 'Tarde';
      else if (/turno\s+(de\s+la\s+)?noche|\bla noche\b/.test(q)) shift = 'Noche';
      return {
        q, machines, cats, shift,
        period: aiParsePeriod(q),
        wantsTrend: /tendencia|evoluci|c[oó]mo (viene|va|ven)|progres|semana a semana|por semana|por d[ií]a/.test(q),
        wantsTips: /tip|idea|mejor|recomend|reducir|bajar|solucion|qu[eé] hago|c[oó]mo (hago|puedo)/.test(q)
      };
    }

    function aiAggregate(list) {
      const agg = computeAggregates(list);
      const cats = CATEGORIES.map(c => ({ ...c, hrs: agg.byCategory[c.key] || 0 })).sort((a, b) => b.hrs - a.hrs);
      return { ...agg, cats, count: list.length };
    }

    function aiIsoWeekKey(ymd) {
      const d = new Date(String(ymd).slice(0, 10) + 'T12:00:00');
      if (isNaN(d)) return null;
      const day = (d.getDay() + 6) % 7;
      const thursday = aiAddDays(d, 3 - day);
      const firstThursday = new Date(thursday.getFullYear(), 0, 4);
      const week = 1 + Math.round(((thursday - firstThursday) / 86400000 - 3 + ((firstThursday.getDay() + 6) % 7)) / 7);
      return { key: thursday.getFullYear() + '-S' + String(week).padStart(2, '0'), monday: aiYmd(aiAddDays(d, -day)) };
    }

    function aiWeeklyTrend(list, maxWeeks) {
      const map = {};
      list.forEach(r => {
        const w = aiIsoWeekKey(r.date);
        if (!w) return;
        (map[w.key] = map[w.key] || { key: w.key, monday: w.monday, recs: [] }).recs.push(r);
      });
      return Object.values(map).sort((a, b) => a.key < b.key ? -1 : 1).slice(-(maxWeeks || 8)).map(w => {
        const a = aiAggregate(w.recs);
        return { week: w.key, desde: w.monday, partes: a.count, disponibles: +a.totalAvailable.toFixed(2), utilizacionPct: +a.utilizationPct.toFixed(1), principalCausa: a.cats[0] && a.cats[0].hrs > 0 ? a.cats[0].shortLabel : '—' };
      });
    }

    function aiFilterRecords(p, period) {
      return records.filter(r => {
        const d = String(r.date || '').slice(0, 10);
        if (p.machines.length && !p.machines.includes(r.machine)) return false;
        if (p.shift && r.shift !== p.shift) return false;
        if (period && (d < period.from || d > period.to)) return false;
        return true;
      });
    }

    /** Responde preguntas concretas sobre una máquina, causa, turno o período. Devuelve null si no aplica. */
    function answerPreciseQuery(userQuery) {
      const p = aiParseQuery(userQuery);
      const bigReport = /360|todas las solapas|integral|gantt|programaci|planificaci|cronograma|orden|fabricaci|scrap|herramental|dorso|base de datos|cat[aá]logo|material(es)? en|alsi|zamac|colada|recupero|horno|crisol|simul|proyecc|recordá que|recorda que|record[aá] que/.test(p.q);
      const hasFilter = p.machines.length || p.cats.length || p.period || p.shift;
      if (bigReport || (!hasFilter && !p.wantsTrend)) return null;

      const target = Number(document.getElementById('targetUtilizationInput').value) || 80;
      const subset = aiFilterRecords(p, p.period);
      const parts = [];
      if (p.machines.length) parts.push(p.machines.join(' + '));
      if (p.shift) parts.push('Turno ' + p.shift);
      parts.push(p.period ? p.period.label + (p.period.from !== p.period.to ? ` (${aiFmt(p.period.from)} – ${aiFmt(p.period.to)})` : '') : 'Todo el historial');
      const titulo = parts.join(' · ');

      learnFromUserInteraction(userQuery, p.wantsTips ? 'mejoras' : 'utilizacion', { utilizationPct: subset.length ? aiAggregate(subset).utilizationPct : 0 });

      if (!subset.length) {
        const dates = records.map(r => String(r.date).slice(0, 10)).filter(Boolean).sort();
        return `### 🔎 ${titulo}\n\nNo encontré partes de horas cargados para esa consulta.\n` +
          (dates.length ? `* Los datos disponibles van del **${aiFmt(dates[0])}** al **${aiFmt(dates[dates.length - 1])}** (${records.length} partes).\n` : '* Todavía no hay partes cargados.\n') +
          `* Probá con otro período (ej. *"setup de la 180 este mes"*, *"utilización de la H-50 en octubre"*, *"últimos 15 días"*).`;
      }

      const a = aiAggregate(subset);
      let md = `### 🔎 ${titulo}\n\n`;
      md += `* **Partes analizados**: ${a.count} | **Horas disponibles**: ${a.totalAvailable.toFixed(2)} h\n`;
      md += `* **Utilización**: **${a.utilizationPct.toFixed(1)}%** (${a.productiveHours.toFixed(2)} h productivas) — ${a.utilizationPct >= target ? `✅ supera la meta del ${target}%` : `⚠️ ${(target - a.utilizationPct).toFixed(1)} puntos debajo de la meta del ${target}%`}\n`;
      md += `* **Total de paradas**: ${a.totalStoppages.toFixed(2)} h\n`;

      if (p.cats.length) {
        md += `\n### ⏱️ Causa consultada\n`;
        p.cats.forEach(k => {
          const c = CATEGORIES.find(x => x.key === k);
          const h = a.byCategory[k] || 0;
          md += `* **${c.label}**: **${h.toFixed(2)} h** (${a.totalAvailable > 0 ? (h / a.totalAvailable * 100).toFixed(1) : 0}% del disponible | ${a.totalStoppages > 0 ? (h / a.totalStoppages * 100).toFixed(1) : 0}% de las paradas)\n`;
        });
      }

      const top = a.cats.filter(c => c.hrs > 0).slice(0, 3);
      if (top.length) {
        md += `\n### 📊 Principales causas de parada\n`;
        top.forEach((c, i) => { md += `${i + 1}. **${c.shortLabel}**: ${c.hrs.toFixed(2)} h (${a.totalStoppages > 0 ? (c.hrs / a.totalStoppages * 100).toFixed(1) : 0}% de las paradas)\n`; });
      }

      if (!p.machines.length) {
        const ranking = MACHINES_LIST.map(m => {
          const ma = aiAggregate(subset.filter(r => r.machine === m));
          return { m, ma };
        }).filter(x => x.ma.totalAvailable > 0).sort((x, y) => x.ma.utilizationPct - y.ma.utilizationPct);
        if (ranking.length > 1) {
          md += `\n### 🏭 Por máquina (de menor a mayor utilización)\n`;
          ranking.forEach(x => { md += `* **${x.m}**: ${x.ma.utilizationPct.toFixed(1)}% — principal parada: *${x.ma.cats[0] && x.ma.cats[0].hrs > 0 ? x.ma.cats[0].shortLabel : 'sin paradas'}*\n`; });
        }
      }

      // Comparación contra el período anterior equivalente
      if (p.period) {
        const len = aiDaysBetween(p.period.from, p.period.to);
        const prevTo = aiYmd(aiAddDays(new Date(p.period.from + 'T12:00:00'), -1));
        const prevFrom = aiYmd(aiAddDays(new Date(p.period.from + 'T12:00:00'), -len));
        const prev = aiFilterRecords(p, { from: prevFrom, to: prevTo });
        if (prev.length) {
          const pa = aiAggregate(prev);
          const diff = a.utilizationPct - pa.utilizationPct;
          md += `\n### ↕️ Contra el período anterior (${aiFmt(prevFrom)} – ${aiFmt(prevTo)})\n`;
          md += `* Utilización: ${pa.utilizationPct.toFixed(1)}% → **${a.utilizationPct.toFixed(1)}%** (${diff >= 0 ? '▲ +' : '▼ '}${diff.toFixed(1)} puntos)\n`;
          p.cats.forEach(k => {
            const c = CATEGORIES.find(x => x.key === k);
            const d = (a.byCategory[k] || 0) - (pa.byCategory[k] || 0);
            md += `* ${c.shortLabel}: ${(pa.byCategory[k] || 0).toFixed(2)} h → **${(a.byCategory[k] || 0).toFixed(2)} h** (${d <= 0 ? '▼ ' : '▲ +'}${d.toFixed(2)} h)\n`;
          });
        }
      }

      if (p.wantsTrend || !p.period || aiDaysBetween(p.period.from, p.period.to) >= 14) {
        const trend = aiWeeklyTrend(subset, 8);
        if (trend.length > 1) {
          md += `\n### 📈 Evolución semanal\n`;
          trend.forEach((w, i) => {
            const prevW = trend[i - 1];
            const arrow = prevW ? (w.utilizacionPct > prevW.utilizacionPct ? ' ▲' : (w.utilizacionPct < prevW.utilizacionPct ? ' ▼' : ' =')) : '';
            md += `* Semana del ${aiFmt(w.desde)}: **${w.utilizacionPct}%**${arrow} (${w.disponibles} h disp., ${w.partes} partes — más parada: ${w.principalCausa})\n`;
          });
        }
      }

      const tipKeys = (p.cats.length ? p.cats : top.map(c => c.key)).slice(0, 2);
      if (tipKeys.length) {
        md += `\n### 💡 Qué hacer\n`;
        tipKeys.forEach(k => (AI_CAUSE_TIPS[k] || []).slice(0, p.wantsTips ? 2 : 1).forEach(t => { md += `* **${CATEGORIES.find(c => c.key === k).shortLabel}**: ${t}\n`; }));

    async function callGemini(promptText, overrideKey) {
      const key = overrideKey || geminiApiKey;
      const ctxJson = JSON.stringify(buildAiFullContext());
      const history = aiConversation.slice(-8).map(m => ({ role: m.role, parts: [{ text: m.text }] }));
      const body = {
        systemInstruction: { parts: [{ text: GEMINI_SYSTEM_PROMPT }] },
        contents: history.concat([{ role: 'user', parts: [{ text: 'DATOS ACTUALES DE LA PLANTA (JSON):\n' + ctxJson + '\n\nCONSULTA: ' + promptText }] }]),
        generationConfig: { temperature: 0.35, maxOutputTokens: 2048 }
      };
      if (!key && typeof inoferLLM === 'function') return await inoferLLM(body);
      let lastErr = 'sin respuesta';
      for (const model of GEMINI_MODELS) {
        let resp, data;
        try {
          resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key }, body: JSON.stringify(body)
          });
          data = await resp.json().catch(() => ({}));
        } catch (e) {
          throw new Error('sin conexión a internet');
        }
        if (resp.ok) {
          const text = (data?.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').trim();
          if (text) return text;
          lastErr = 'la respuesta vino vacía';
          continue;
        }
        const msg = String(data?.error?.message || '');
        if (resp.status === 400 && /api key/i.test(msg)) throw new Error('la clave de Gemini no es válida');
        if (resp.status === 403) throw new Error('la clave de Gemini no tiene permiso (revisala en Google AI Studio)');
        if (resp.status === 429) { lastErr = 'se agotó el cupo gratuito de Gemini por ahora'; continue; }
        lastErr = msg || ('error ' + resp.status);
      }
      throw new Error(lastErr);
    }

    function calcHoursDiff(startStr, endStr) {
      if (!startStr || !endStr) return 0;
      const [sh, sm] = startStr.split(':').map(Number);
      const [eh, em] = endStr.split(':').map(Number);
      let diff = (eh + em / 60) - (sh + sm / 60);
      if (diff < 0) diff += 24;
      return Math.max(0, diff);
    }

    function computeOrderMetrics(ord) {
      if (!ord) return null;
      let totalOk = 0;
      let totalLowStart = 0;
      let totalScrap = 0;
      let totalWorkedHours = 0;

      (ord.logs || []).forEach(lg => {
        totalOk += Number(lg.okPcs) || 0;
        totalLowStart += Number(lg.lowStartPcs) || 0;
        totalScrap += Number(lg.scrapPcs) || 0;
        totalWorkedHours += calcHoursDiff(lg.startTime, lg.endTime);
      });

      const totalInjected = totalOk + totalLowStart + totalScrap;
      const stdRate = Number(ord.unitsPerHour) || 180;
      const actualRate = totalWorkedHours > 0 ? (totalOk / totalWorkedHours) : 0;
      const cadenceEffPct = stdRate > 0 ? (actualRate / stdRate) * 100 : 0;
      const qualityPct = totalInjected > 0 ? (totalOk / totalInjected) * 100 : 100;
      const progressPct = (Number(ord.qtyTarget) || 0) > 0 ? (totalOk / Number(ord.qtyTarget)) * 100 : 0;
      const oeePiecePct = (Math.min(100, cadenceEffPct) / 100) * (qualityPct / 100) * 100;

      return {
        totalOk,
        totalLowStart,
        totalScrap,
        totalInjected,
        totalWorkedHours,
        stdRate,
        actualRate,
        cadenceEffPct,
        qualityPct,
        progressPct,
        oeePiecePct
      };
    }

      const total = partsCatalog.length;
      const count = selectedCatalogIds.size;

      if (countSpan) countSpan.textContent = count;
      if (delBtn) {
        if (count > 0) delBtn.classList.remove('hidden');
        else delBtn.classList.add('hidden');
      }
      if (selectAllCb) {
        selectAllCb.checked = (total > 0 && count === total);
        selectAllCb.indeterminate = (count > 0 && count < total);
      }
    }

    function loadPartsCatalog() {
      try {
        const saved = localStorage.getItem('tablero_inyectoras_catalog_v3');
        partsCatalog = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(INITIAL_PARTS_CATALOG));
      } catch (e) {
        partsCatalog = JSON.parse(JSON.stringify(INITIAL_PARTS_CATALOG));
      }
    }

    function savePartsCatalog() {
      try {
        localStorage.setItem('tablero_inyectoras_catalog_v3', JSON.stringify(partsCatalog));
      } catch (e) {}
      pushCloudModuleState('catalog', partsCatalog);
    }

    function updateCatalogItemSharedMold(itemId, newPartnerCode) {
      const item = partsCatalog.find(x => x.id === itemId);
      if (!item) return;

      const oldPartnerCode = (item.sharedMoldWith || '').trim();
      const cleanNew = (newPartnerCode || '').trim();

      // 1. If there was a previous partner and it changed or was cleared, unlink the old partner
      if (oldPartnerCode && oldPartnerCode.toLowerCase() !== cleanNew.toLowerCase()) {
        const oldSister = partsCatalog.find(x => x.part.toLowerCase() === oldPartnerCode.toLowerCase());
        if (oldSister && (oldSister.sharedMoldWith || '').toLowerCase() === item.part.toLowerCase()) {
          oldSister.sharedMoldWith = '';
          oldSister.mold = oldSister.part.split('/')[0].split('-')[0] || oldSister.part;
        }
      }

      // 2. Set new partner on current item
      item.sharedMoldWith = cleanNew;
      if (!cleanNew) {
        item.mold = item.part.split('/')[0].split('-')[0] || item.part;
        savePartsCatalog();
        renderPartsCatalogView();
        showToast(`Se desvinculó el molde compartido de ${item.part}`);
        return;
      }

      // 3. Link new partner bidirectionally if it exists in catalog
      const newSister = partsCatalog.find(x => x.part.toLowerCase() === cleanNew.toLowerCase());
      const combinedMold = [item.part.split('/')[0], cleanNew.split('/')[0]].sort().join('+');
      item.mold = combinedMold;

      if (newSister) {
        // Unlink newSister's previous partner if it had a different one
        if (newSister.sharedMoldWith && newSister.sharedMoldWith.toLowerCase() !== item.part.toLowerCase()) {
          const prevOther = partsCatalog.find(x => x.part.toLowerCase() === newSister.sharedMoldWith.toLowerCase());
          if (prevOther) {
            prevOther.sharedMoldWith = '';
            prevOther.mold = prevOther.part.split('/')[0].split('-')[0] || prevOther.part;
          }
        }
        newSister.sharedMoldWith = item.part;
        newSister.mold = combinedMold;
      }

      savePartsCatalog();
      renderPartsCatalogView();
      showToast(`Molde compartido actualizado: ${item.part} ↔ ${cleanNew}`);
    }

                Usar en OP
              </button>
              <button type="button" data-edit-cat="${item.id}" class="edit-cat-btn rounded bg-cyan-500/15 border border-cyan-500/30 px-2 py-0.5 text-[11px] font-semibold text-cyan-300 hover:bg-cyan-500/25">
                Editar
              </button>
              <button type="button" data-del-cat="${item.id}" class="del-cat-btn rounded bg-rose-500/10 border border-rose-500/20 px-2 py-0.5 text-[11px] font-semibold text-rose-400 hover:bg-rose-500/20">

      tbody.querySelectorAll('.inline-mold-input').forEach(inp => {
        inp.addEventListener('change', () => {

          const item = partsCatalog.find(x => x.id === cid);
          if (!item) return;
          item.mold = (inp.value || '').trim() || item.part.split('/')[0];
          savePartsCatalog();
          renderPartsCatalogView();
          showToast(`Molde de ${item.part} actualizado a ${item.mold}`);
        });
