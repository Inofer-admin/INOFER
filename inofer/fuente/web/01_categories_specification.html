      function processUploadedAnalisisFile(file) {
        if (!file) return;
        const statusBadge = document.getElementById('uploadedExcelStatusBadge');
        if (statusBadge) statusBadge.textContent = `⏳ Leyendo ${file.name}...`;

        const lowerName = file.name.toLowerCase();
        const isTextCsv = lowerName.endsWith('.csv') || lowerName.endsWith('.txt') || lowerName.endsWith('.tsv');
        const reader = new FileReader();

        if (isTextCsv || typeof XLSX === 'undefined') {
          reader.onload = (evt) => {
            const content = String(evt.target.result || '');
            if (pasteAreaEl) pasteAreaEl.value = content;
            const analyzed = renderStockAnalysisPreview();
            if (statusBadge) statusBadge.textContent = `✅ Cargado: ${file.name} (${analyzed.length} piezas)`;
            showToast(`Planilla "${file.name}" cargada con ${analyzed.length} piezas analizadas`);
          };
          reader.readAsText(file, 'UTF-8');
        } else {
          reader.onload = (evt) => {
            try {
              const data = new Uint8Array(evt.target.result);
              const workbook = XLSX.read(data, { type: 'array' });
              let bestLines = [];

              // Search across all sheets in the Excel file to find the one with the part rows
              workbook.SheetNames.forEach(sheetName => {
                const ws = workbook.Sheets[sheetName];
                const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
                const candidateLines = [];
                rows.forEach(r => {
                  if (!Array.isArray(r) || r.length < 2) return;
                  const c0 = String(r[0] ?? '').trim();
                  if (!c0) return;
                  if (/^(c[oó]digo|pieza|part|nro)/i.test(c0) && /(cons|pedido|alc|stock|cant)/i.test(r.join(' '))) {
                    return; // skip header row
                  }
                  const rowCells = r.slice(0, 16).map(cell => {
                    if (cell === null || cell === undefined || cell === '') return '0';
                    return String(cell).trim();
                  });
                  candidateLines.push(rowCells.join('\t'));
                });
                if (candidateLines.length > bestLines.length) {
                  bestLines = candidateLines;
                }
              });

              if (bestLines.length > 0) {
                const header = ['Codigo', 'Cons. Mens.', 'Pedido M1', 'Pedido M2', 'Pedido M3', 'Pedido M4', 'Pedido M5', 'Pedido M6', 'Pedido M7', 'Pedido M8', 'Pedido M9', 'Pedido M10', 'Pedido M11', 'Pedido M12', 'Alc. Disp.', 'Alc. C/OC en curso o Devolucion'].join('\t');
                if (pasteAreaEl) pasteAreaEl.value = [header, ...bestLines].join('\n');
                const analyzed = renderStockAnalysisPreview();
                if (statusBadge) statusBadge.textContent = `✅ Cargado: ${file.name} (${analyzed.length} piezas)`;
                showToast(`¡Excel "${file.name}" analizado con éxito (${analyzed.length} piezas)!`);
              } else {
                if (statusBadge) statusBadge.textContent = `⚠️ Sin filas válidas en ${file.name}`;
                showToast('No se detectaron filas de piezas en el archivo Excel');
              }
            } catch (err) {
              if (statusBadge) statusBadge.textContent = `⚠️ Error leyendo ${file.name}`;
              showToast('Error al procesar el archivo Excel');
            }
          };
          reader.readAsArrayBuffer(file);
        }

        const partVal = (document.getElementById('cat_part').value || '').trim();

        if (!partVal || !moldVal) return;

        const checkedMachs = Array.from(document.querySelectorAll('.cat-mach-cb')).filter(cb => cb.checked).map(cb => cb.value);
        if (checkedMachs.length === 0) {
          showToast('Seleccioná al menos 1 máquina compatible para la pieza');
          return;
        }
        const existingItem = partsCatalog.find(x => (editingCatalogId && x.id === editingCatalogId) || x.part.toLowerCase() === partVal.toLowerCase());
        const sharedVal = (document.getElementById('cat_shared_mold')?.value || '').trim();
        const newItem = {
          id: editingCatalogId ? editingCatalogId : (existingItem ? existingItem.id : ('cat-' + Date.now())),
          part: partVal,
          desc: existingItem?.desc || ('Pieza ' + partVal),
          mold: moldVal,
          sharedMoldWith: sharedVal,
          portamolde: (document.getElementById('cat_portamolde')?.value || '').trim().toUpperCase(),

          loteMin: Math.max(0, Math.round(Number(document.getElementById('cat_lote_min')?.value) || 0)),
          precioAt: (Number(document.getElementById('cat_precio')?.value) || 0) !== (Number(existingItem?.precio) || 0) ? new Date().toISOString() : (existingItem?.precioAt || ''),
          cavities: Number(document.getElementById('cat_cavities').value) || 1,
          unitsPerHour: Number(document.getElementById('cat_units_hr').value) || 180,
          machines: checkedMachs,
          machine: SHORT_TO_FULL_MACHINE[checkedMachs[0]] || 'Italpresse 200 Tn (V)',
          material: document.getElementById('cat_material').value || 'ZAMAC',
          weightWithSprueKg: Number(document.getElementById('cat_weight_sprue').value) || 0,
          weightOkGrs: Number(document.getElementById('cat_weight_ok').value) || 0,
          recuperoKg: existingItem?.recuperoKg || 0.02,
          dieCut: document.getElementById('cat_die_cut').value || '',
          machiningDev: document.getElementById('cat_machining_dev').value || ''
        };

        const existingIdx = partsCatalog.findIndex(x =>
          (editingCatalogId && x.id === editingCatalogId) ||
          x.part.toLowerCase() === partVal.toLowerCase()
        );

        if (existingIdx !== -1) {
          partsCatalog[existingIdx] = newItem;
        } else {
          partsCatalog.unshift(newItem);
        }

        // If previous item had a partner and now it was changed or cleared, unlink the old partner
        const prevPartner = existingItem?.sharedMoldWith ? String(existingItem.sharedMoldWith).trim() : '';
        if (prevPartner && prevPartner.toLowerCase() !== sharedVal.toLowerCase()) {
          const oldSis = partsCatalog.find(x => x.part.toLowerCase() === prevPartner.toLowerCase());
          if (oldSis && (oldSis.sharedMoldWith || '').toLowerCase() === partVal.toLowerCase()) {
            oldSis.sharedMoldWith = '';
            oldSis.mold = oldSis.part.split('/')[0].split('-')[0] || oldSis.part;
          }
        }
        // Bidirectional link if sharedMoldWith is specified!
        if (sharedVal) {
          const sister = partsCatalog.find(x => x.part.toLowerCase() === sharedVal.toLowerCase());
          if (sister) {
            sister.sharedMoldWith = partVal;
            sister.machines = [...checkedMachs];
            sister.machine = newItem.machine;
            sister.unitsPerHour = newItem.unitsPerHour;

        savePartsCatalog();
        renderPartsCatalogView();
        resetCatalogForm();
        showToast(sharedVal
          ? `Pieza ${partVal} guardada y vinculada en molde compartido con ${sharedVal}`

      importCatInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const text = String(evt.target.result || '');
          const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
          if (lines.length < 2) {
            showToast('El CSV no tiene filas válidas');
            return;
          }
          const sep = lines[0].includes(';') && !lines[0].includes(',') ? ';' : ',';
          let count = 0;
          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(sep).map(c => c.trim().replace(/^"|"$/g, ''));
            if (cols.length < 4) continue;
            const pNum = (v, defVal) => {
              const n = parseFloat(String(v || '').replace(',', '.'));
              return isNaN(n) ? defVal : n;
            };
            const item = {
              id: 'cat-imp-' + Date.now() + '-' + i,
              part: cols[0] || ('PIEZA-' + i),
              mold: cols[1] || cols[0],
              cavities: pNum(cols[2], 1),
              unitsPerHour: pNum(cols[3], 180),
              machine: cols[4] || 'Italpresse 180 Tn',
              material: cols[5] || 'ZAMAC',
              weightWithSprueKg: pNum(cols[6], 0.065),
              weightOkGrs: pNum(cols[7], 0),
              dieCut: cols[8] || '',
              machiningDev: cols[9] || ''
            };
            const existIdx = partsCatalog.findIndex(x => x.part.toLowerCase() === item.part.toLowerCase());
            if (existIdx !== -1) partsCatalog[existIdx] = item;
            else partsCatalog.push(item);
            count++;
          }
          savePartsCatalog();
          renderPartsCatalogView();
          showToast(`Se importaron ${count} piezas/moldes a la Base de Datos`);
        };
        reader.readAsText(file, 'UTF-8');

        showToast('Regla aprendida por INOFER');
      });

      document.getElementById('clearInoferMemoryBtn').addEventListener('click', () => {
        inoferMemory = JSON.parse(JSON.stringify(DEFAULT_INOFER_MEMORY));
        saveInoferMemory();
        showToast('Memoria de INOFER reiniciada');
      });

      document.getElementById('saveWeeklyCloseBtn').addEventListener('click', () => {
        saveCurrentWeeklySnapshot();
      });

      document.getElementById('viewWeeklyArchiveBtn').addEventListener('click', () => {
        appendAiChatMessage('user', 'Mostrar historial y comparativa de semanas guardadas por INOFER');
        appendAiChatMessage('assistant', formatWeeklyArchivesReport());
      });

      document.getElementById('aiChatForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('aiChatInput');
        const text = input.value;
        input.value = '';
        handleAiUserPrompt(text);
      });

      document.getElementById('aiClearChatBtn').addEventListener('click', () => {
        aiConversation = [];
        document.getElementById('aiChatMessages').innerHTML = '';
        appendAiChatMessage('assistant', 'Chat reiniciado. ¿Qué informe o análisis de mejora querés generar sobre el historial actual?');
      });

      document.getElementById('aiCopyLastReportBtn').addEventListener('click', () => {
        if (!lastAiReportText) {
          showToast('Todavía no hay ningún informe para copiar');
          return;
        }
        const ta = document.createElement('textarea');
        ta.value = lastAiReportText.replace(/\*\*/g, '').replace(/### /g, '');
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast('Informe copiado al portapapeles');
        } catch (err) {
          showToast('No se pudo copiar automáticamente');
        }
        document.body.removeChild(ta);
      });

      document.getElementById('saveGeminiKeyBtn').addEventListener('click', async () => {
        const newKey = (document.getElementById('geminiApiKeyInput').value || '').trim();
        const badge = document.getElementById('aiEngineModeBadge');
        if (newKey) {
          badge.textContent = 'Probando clave…';
          try {
            await callGemini('Respondé solamente: OK', newKey);
          } catch (err) {
            badge.textContent = geminiApiKey ? 'Gemini API Activa' : 'Motor OEE Integrado';
            showToast('No se pudo conectar con Gemini: ' + err.message);
            return;
          }
        }
        geminiApiKey = newKey;
        try { localStorage.setItem('tablero_inyectoras_gemini_key', geminiApiKey); } catch (e) {}
        if (document.getElementById('geminiShareKeyChk')?.checked) pushCloudModuleState('config', { geminiKey: geminiApiKey });
        badge.textContent = geminiApiKey ? 'Gemini API Activa ✓' : 'Motor OEE Integrado';
        showToast(geminiApiKey ? 'Gemini conectado correctamente' : 'Usando Motor OEE Integrado');
      });

      // Filter listeners
      ['filterMachine', 'filterShift', 'filterFuente', 'filterDateFrom', 'filterDateTo', 'targetUtilizationInput', 'chartMetricToggle'].forEach(id => {
        document.getElementById(id).addEventListener('input', refreshAll);
        document.getElementById(id).addEventListener('change', refreshAll);
      });

      document.getElementById('resetFiltersBtn').addEventListener('click', () => {
        document.getElementById('filterMachine').value = 'ALL';
        document.getElementById('filterShift').value = 'ALL';
        if (document.getElementById('filterFuente')) document.getElementById('filterFuente').value = 'ALL';
        document.getElementById('filterDateFrom').value = '';
        document.getElementById('filterDateTo').value = '';
        document.getElementById('targetUtilizationInput').value = '80';
        refreshAll();
      });

      // Simulator listeners
      document.getElementById('simAvailableHours').addEventListener('input', updateSimulatorLive);
      document.querySelectorAll('.sim-input').forEach(el => {
        el.addEventListener('input', updateSimulatorLive);
      });

      document.getElementById('simResetZeroBtn').addEventListener('click', () => {
        document.querySelectorAll('.sim-input').forEach(el => { el.value = '0'; });
        updateSimulatorLive();
      });

      document.getElementById('simSaveToRecordsBtn').addEventListener('click', () => {
        const avail = Number(document.getElementById('simAvailableHours').value) || 0;
        let stopTotal = 0;
        const entry = {
          id: 'rec-' + Date.now(),
          date: document.getElementById('simDate').value || today,
          machine: document.getElementById('simMachine').value,
          shift: document.getElementById('simShift').value,
          available: avail
        };
        CATEGORIES.forEach(c => {
          const val = Math.max(0, Number(document.getElementById('sim_' + c.key).value) || 0);
          entry[c.key] = val;
          stopTotal += val;
        });
        if (stopTotal > avail + 1e-9) {
          showToast('Error: Las horas de parada superan las disponibles');
          return;
        }
        records.unshift(entry);
        saveState();
        refreshAll();
        pushCloudAction('add', { entry });
        switchTab('dashboard');
        showToast('Simulación guardada y sincronizada');
      });

      // Modal open/close & live preview (supports both New Entry and Edit Record)
      const modal = document.getElementById('entryModal');

      window.openEditRecordModal = (id) => {
        const rec = records.find(r => String(r.id) === String(id));
        if (!rec) return;
        editingRecordId = rec.id;
        document.getElementById('entryModalTitle').textContent = 'Editar Parte de Horas Cargado';
        document.getElementById('entryModalSubtitle').textContent = `Modificando el registro de ${rec.machine} (${rec.date} - Turno ${rec.shift})`;
        document.getElementById('modalSubmitBtn').textContent = 'Guardar Cambios';

        document.getElementById('modalDate').value = (rec.date ? String(rec.date).slice(0, 10) : '') || today;
        const machSel = document.getElementById('modalMachine');
        const machVal = rec.machine || 'Italpresse 200 Tn (N)';
        if (!Array.from(machSel.options).some(o => o.value === machVal)) {
          const opt = document.createElement('option');
          opt.value = machVal; opt.textContent = machVal; machSel.appendChild(opt);
        }
        machSel.value = machVal;
        document.getElementById('modalShift').value = rec.shift || 'Mañana';
        document.getElementById('modalAvailableHours').value = (rec.available !== undefined && rec.available !== '') ? Number(rec.available) : 8;

        CATEGORIES.forEach(c => {
          const el = document.getElementById('modal_' + c.key);
          if (el) el.value = Number(rec[c.key]) || 0;
        });

        document.getElementById('modalErrorMsg').classList.add('hidden');
        updateModalPreview();
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      };

      document.getElementById('openNewEntryModalBtn').addEventListener('click', () => {
        editingRecordId = null;
        document.getElementById('entryModalTitle').textContent = 'Cargar Parte de Horas de Inyectora';
        document.getElementById('entryModalSubtitle').textContent = 'Ingresá las horas disponibles y las horas de parada. El % de utilización se calcula automáticamente.';
        document.getElementById('modalSubmitBtn').textContent = 'Guardar Registro';

        document.getElementById('modalDate').value = today;
        document.getElementById('modalAvailableHours').value = 8;
        CATEGORIES.forEach(c => {
          const el = document.getElementById('modal_' + c.key);
          if (el) el.value = 0;
        });
        document.getElementById('modalErrorMsg').classList.add('hidden');
        updateModalPreview();
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      });

      const closeModal = () => {
        editingRecordId = null;
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      };
      document.getElementById('closeEntryModalBtn').addEventListener('click', closeModal);
      document.getElementById('cancelModalBtn').addEventListener('click', closeModal);

      document.getElementById('modalAvailableHours').addEventListener('input', updateModalPreview);
      document.querySelectorAll('.modal-stop-input').forEach(el => {
        el.addEventListener('input', updateModalPreview);
      });

      document.getElementById('newEntryForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const avail = Number(document.getElementById('modalAvailableHours').value) || 0;
        let stopTotal = 0;
        const entry = {
          id: editingRecordId ? editingRecordId : ('rec-' + Date.now()),
          date: document.getElementById('modalDate').value || today,
          machine: document.getElementById('modalMachine').value,
          shift: document.getElementById('modalShift').value,
          available: avail
        };
        const paradasCod = typeof inoferParadasDelModal === 'function' ? inoferParadasDelModal() : undefined;
        if (paradasCod) entry.paradas = paradasCod;
        CATEGORIES.forEach(c => {
          const val = Math.max(0, Number(document.getElementById('modal_' + c.key).value) || 0);
          entry[c.key] = val;
          stopTotal += val;
        });

        if (stopTotal > avail + 1e-9) {
          document.getElementById('modalErrorMsg').classList.remove('hidden');
          return;
        }

        if (editingRecordId) {
          const idx = records.findIndex(r => String(r.id) === String(editingRecordId));
          if (idx !== -1) {
            records[idx] = Object.assign({}, records[idx], entry);
          } else {
            records.unshift(entry);
          }
          saveState();
          refreshAll();
          pushCloudAction('edit', { entry });
          closeModal();
          showToast('Registro actualizado y sincronizado');
        } else {
          records.unshift(entry);
          saveState();
          refreshAll();
          pushCloudAction('add', { entry });
          closeModal();
          showToast('Parte de horas cargado y sincronizado');
        }
      });

      // Clear / Restore buttons
      document.getElementById('clearAllRecordsBtn').addEventListener('click', () => {
        records = [];
        saveState();
        refreshAll();
        pushCloudAction('replace', { records: [] });
        showToast('Se vaciaron todos los registros');
      });

      document.getElementById('restoreDemoDataBtn').addEventListener('click', () => {
        records = JSON.parse(JSON.stringify(INITIAL_RECORDS));
        saveState();
        refreshAll();
        pushCloudAction('replace', { records });
        showToast('Datos de ejemplo restaurados');
      });

      // Import CSV
      const importCsvInput = document.getElementById('importCsvInput');
      document.getElementById('importCsvBtn').addEventListener('click', () => {
        importCsvInput.value = '';
        importCsvInput.click();
      });

      importCsvInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const text = String(evt.target.result || '');
          const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
          if (lines.length < 2) {
            showToast('El archivo CSV no contiene filas de datos válidas');
            return;
          }
          const sep = lines[0].includes(';') && !lines[0].includes(',') ? ';' : ',';
          const headers = lines[0].split(sep).map(h => h.trim().toLowerCase());

          const idxDate = headers.findIndex(h => h.includes('fecha') || h.includes('date'));
          const idxMach = headers.findIndex(h => h.includes('maquina') || h.includes('máquina') || h.includes('inyectora'));
          const idxShift = headers.findIndex(h => h.includes('turno') || h.includes('shift'));
          const idxAvail = headers.findIndex(h => h.includes('disponible') || h.includes('disp'));

          const idxParadaMaq = headers.findIndex(h => h.includes('parada_maquina') || h.includes('parada maq') || h.includes('rotura'));
          const idxSetup = headers.findIndex(h => h.includes('setup') || h.includes('molde'));
          const idxPuesta = headers.findIndex(h => h.includes('puesta') || h.includes('arranque'));
          const idxPrev = headers.findIndex(h => h.includes('preventivo') || h.includes('prev'));
          const idxCorr = headers.findIndex(h => h.includes('correctivo') || h.includes('corr'));
          const idxMat = headers.findIndex(h => h.includes('material'));
          const idxOper = headers.findIndex(h => h.includes('operario'));
          const idxOtros = headers.findIndex(h => h.includes('otros') || h.includes('otro'));

          let importedCount = 0;
          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(sep).map(c => c.trim().replace(/^"|"$/g, ''));
            if (cols.length < 4) continue;
            const parseNum = (idx, fallbackIdx) => {
              const targetIdx = idx >= 0 ? idx : fallbackIdx;
              if (targetIdx < 0 || targetIdx >= cols.length) return 0;
              const v = parseFloat(cols[targetIdx].replace(',', '.'));
              return isNaN(v) ? 0 : Math.max(0, v);
            };

            const entry = {
              id: 'imp-' + Date.now() + '-' + i,
              date: (idxDate >= 0 ? cols[idxDate] : cols[0]) || today,
              machine: (idxMach >= 0 ? cols[idxMach] : cols[1]) || 'Italpresse 200 Tn (N)',
              shift: (idxShift >= 0 ? cols[idxShift] : cols[2]) || 'Mañana',
              available: parseNum(idxAvail, 3) || 8,
              parada_maquina: parseNum(idxParadaMaq, 6),
              setup_molde: parseNum(idxSetup, 7),
              puesta_punto: parseNum(idxPuesta, 8),
              mant_preventivo: parseNum(idxPrev, 9),
              mant_correctivo: parseNum(idxCorr, 10),
              falta_material: parseNum(idxMat, 11),
              falta_operario: parseNum(idxOper, 12),
              otros: parseNum(idxOtros, 13)
            };
            records.unshift(entry);
            importedCount++;
          }

          if (importedCount > 0) {
            saveState();
            refreshAll();
            pushCloudAction('replace', { records });
            showToast(`Se importaron ${importedCount} registros del CSV correctamente`);
          } else {
            showToast('No se pudieron leer filas válidas del archivo CSV');
          }
        };
        reader.readAsText(file, 'UTF-8');
      });

      // Cloud / Instructions Modal
      const cloudModal = document.getElementById('cloudSetupModal');
      const openCloudModal = () => {
        cloudModal.classList.remove('hidden');
        cloudModal.classList.add('flex');
      };
      const closeCloudModal = () => {
        cloudModal.classList.add('hidden');
        cloudModal.classList.remove('flex');
      };
      document.getElementById('openCloudModalBtn').addEventListener('click', openCloudModal);
      document.getElementById('closeCloudModalBtn').addEventListener('click', closeCloudModal);
      document.getElementById('okCloudModalBtn').addEventListener('click', closeCloudModal);

      document.getElementById('syncNowBtn').addEventListener('click', () => {
        if (!hasAppsScriptRuntime() && !cloudApiUrl) {
          openCloudModal();
        } else {
          fetchCloudRecords(false);
          showToast('Sincronizando con Google Sheets...');
        }
      });

      document.getElementById('saveCloudEndpointBtn').addEventListener('click', () => {
        const val = (document.getElementById('cloudEndpointInput').value || '').trim();
        cloudApiUrl = val;
        try {
          localStorage.setItem('tablero_inyectoras_cloud_url', cloudApiUrl);
        } catch (e) {}
        if (cloudApiUrl) {
          closeCloudModal();
          inoferOnCloudUrlChanged();
        } else {
          updateSyncStatusUI('local', 'Modo Local');
          showToast('Se desconectó la URL externa');
        }
      });

      // Start initial cloud check and 8-second live polling
      fetchCloudRecords(true);
      let ultimaConsultaOculta = 0;
      setInterval(() => {
        if (document.hidden) { if (Date.now() - ultimaConsultaOculta < 60000) return; ultimaConsultaOculta = Date.now(); }
        fetchCloudRecords(true);
      }, 8000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) { try { fetchCloudRecords(true); } catch (e) { } } });

      document.getElementById('copyGsCodeBtn').addEventListener('click', () => {
        const codeText = document.getElementById('appsScriptSnippet').textContent;
        const ta = document.createElement('textarea');
        ta.value = codeText;
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast('Código.gs copiado al portapapeles');
        } catch (err) {
          showToast('Copiá el texto manualmente');
        }
        document.body.removeChild(ta);
      });

      // Export CSV
      document.getElementById('exportCsvBtn').addEventListener('click', () => {
        const filtered = getFilteredRecords();
        const headers = [
          'Fecha', 'Maquina', 'Turno', 'Horas_Disponibles', 'Horas_Utilizacion', 'Porcentaje_Utilizacion',
          'Parada_Maquina', 'Setup_Cambio_Molde', 'Puesta_a_Punto', 'Mant_Preventivo',
          'Mant_Correctivo', 'Falta_Material', 'Falta_Operario', 'Otros'
        ];
        const rows = filtered.map(r => {
          const avail = Number(r.available) || 0;
          let stop = 0;
          CATEGORIES.forEach(c => { stop += Number(r[c.key]) || 0; });
          const prod = Math.max(0, avail - stop);
          const pct = avail > 0 ? ((prod / avail) * 100).toFixed(2) : '0.00';
          return [
            r.date, r.machine, r.shift, avail, prod.toFixed(2), pct,
            r.parada_maquina || 0, r.setup_molde || 0, r.puesta_punto || 0,
            r.mant_preventivo || 0, r.mant_correctivo || 0, r.falta_material || 0,
            r.falta_operario || 0, r.otros || 0
          ].join(',');
        });
        const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', 'tablero_utilizacion_inyectoras.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('Archivo CSV descargado');
      });
    });
  </script>
