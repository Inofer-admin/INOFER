  <script>
    // ===== Planta: sin internet, QR, avisos, controles, mantenimiento, stock, informe semanal y registro de cambios =====
    (function () {
      const $ = id => document.getElementById(id);
      const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const norm = window.inoferNormTxt || (s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim());
      const pad = n => String(n).padStart(2, '0');
      const isoD = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      const hoyIso = () => isoD(new Date());
      const masDias = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoD(d); };
      const difDias = (a, b) => Math.round((new Date(a + 'T12:00:00') - new Date(b + 'T12:00:00')) / 864e5);
      const fFecha = iso => { if (!iso) return '—'; const p = String(iso).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] : iso; };
      const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
      const fDia = iso => { const d = new Date(iso + 'T12:00:00'); return DIAS[d.getDay()] + ' ' + fFecha(iso); };
      const n0 = v => Math.round(Number(v) || 0).toLocaleString('es-AR');
      const n1 = v => (Math.round((Number(v) || 0) * 10) / 10).toLocaleString('es-AR');
      const aMin = h => { const [a, b] = String(h || '0:0').split(':').map(Number); return (a || 0) * 60 + (b || 0); };
      const horasEntre = (a, b) => ((((aMin(b) - aMin(a)) + 1440) % 1440) || 1440) / 60;
      const toast = m => { try { showToast(m); } catch (e) { } };
      const sesion = () => (typeof inoferSession !== 'undefined' ? inoferSession : null);
      const esAdmin = () => !!(sesion() && sesion().rol === 'admin');
      const can = (a, n) => typeof inoferCan !== 'function' || inoferCan(a, n);
      const puedeK = k => typeof inoferPuede !== 'function' || inoferPuede(k);
      const quien = () => (typeof inoferUsuarioEtiqueta === 'function' ? inoferUsuarioEtiqueta() : '') || 'equipo';
      const enNube = () => typeof cloudApiUrl !== 'undefined' && !!cloudApiUrl && !!sesion() && sesion().modo === 'nube';
      const api = async body => { const d = await inoferCloudPost(Object.assign({ token: inoferAuthToken() }, body)); if (!d || d.status === 'error') throw new Error((d && d.error) || 'Sin respuesta de la nube'); return d; };
      const MAQS = () => (typeof GANTT_MACHINES_CONFIG !== 'undefined' ? GANTT_MACHINES_CONFIG.map(m => m.id) : ['200V', '200N', '180', 'H50', 'Z30']);
      const FULL = { '200V': 'Italpresse 200 Tn (V)', '200N': 'Italpresse 200 Tn (N)', '180': 'Italpresse 180 Tn', 'H50': 'H-50', 'Z30': 'Italpresse 30 Tn (Z-30)' };
      function maqId(txt) {
        const t = norm(txt).replace(/\s+/g, ' ');
        for (const m of MAQS()) if (t === norm(m) || t === norm(FULL[m])) return m;
        if (/\(v\)/.test(t)) return '200V'; if (/\(n\)/.test(t)) return '200N'; if (/180/.test(t)) return '180'; if (/h-?50/.test(t)) return 'H50'; if (/z-?30|30 tn/.test(t)) return 'Z30';
        return String(txt || '');
      }
      const ordenes = () => (typeof productionOrders !== 'undefined' ? productionOrders : []);
      const partes = () => (typeof records !== 'undefined' ? records : []).filter(r => !(window.inoferEsDemo && inoferEsDemo(r)));
      const esDemoOrden = o => window.inoferEsDemo && inoferEsDemo({ fromOrder: true, ordId: o.id });
      const catDe = part => window.inoferCatBuscar ? (inoferCatBuscar(part) || undefined) : (typeof partsCatalog !== 'undefined' ? partsCatalog : []).find(c => norm(c.part) === norm(part));
      const COD_CAT = () => window.INOFER_CODIGO_CATEGORIA || {};
      const catDeCodigo = cod => COD_CAT()[parseInt(String(cod || ''), 10)] || 'otros';
      // código de parada que es una rotura (mantenimiento correctivo): al cargarlo se pregunta si se bajó el molde o se paró la máquina
      window.inoferEsRotura = cod => !!cod && catDeCodigo(cod) === 'mant_correctivo';
      const BTN = 'rounded-lg border px-2.5 py-1.5 text-xs font-bold transition';
      const INP = 'rounded-lg border border-slate-700 bg-slate-950 px-2.5 py-1.5 text-xs text-white focus:border-cyan-400 focus:outline-none';

      // ---------------------------------------------------------------------------------
      // Módulos de nube propios (mantenimiento, stock, avisos, informes)
      // ---------------------------------------------------------------------------------
      const MOD = {
        mantenimiento: { key: 'tablero_inyectoras_mantenimiento_v1', def: () => ({ planes: [], trabajos: [] }) },
        stock: { key: 'tablero_inyectoras_stock_v1', def: () => ({ materiales: {}, terminado: {} }) },
        avisos: { key: 'tablero_inyectoras_avisos_v1', def: () => ({ ignorados: {} }) },
        informes: { key: 'tablero_inyectoras_informes_v1', def: () => ({ emails: [], activo: true }) }
      };
      Object.keys(MOD).forEach(k => { let v = null; try { v = JSON.parse(localStorage.getItem(MOD[k].key) || 'null'); } catch (e) { } MOD[k].val = v && typeof v === 'object' ? Object.assign(MOD[k].def(), v) : MOD[k].def(); MOD[k].cambio = 0; });
      const D = k => MOD[k].val;
      window.inoferModLocal = k => (MOD[k] ? MOD[k].val : null);
      function guardarMod(k, subir) {
        try { localStorage.setItem(MOD[k].key, JSON.stringify(MOD[k].val)); } catch (e) { }
        if (subir !== false) { MOD[k].cambio = Date.now(); try { pushCloudModuleState(k, MOD[k].val); } catch (e) { } }
      }
      const RENDER = {};
      function recibirMods(mods) {
        if (!mods) return;
        Object.keys(MOD).forEach(k => {
          if (!mods[k] || typeof mods[k] !== 'object') return;
          if (Date.now() - MOD[k].cambio < 20000) return; // recién cambiado acá: no se pisa con una copia vieja
          if (JSON.stringify(mods[k]) === JSON.stringify(MOD[k].val)) return;
          MOD[k].val = Object.assign(MOD[k].def(), mods[k]); guardarMod(k, false);
          const a = document.activeElement;
          if (!(a && a.closest && a.closest('.inofer-planta-form'))) { try { (RENDER[k] || []).forEach(f => f()); } catch (e) { } }
        });
        programarAvisos();
      }

      // ---------------------------------------------------------------------------------
      // 1) Trabajar sin internet: cambios pendientes de subir
      // ---------------------------------------------------------------------------------
      const PEND_KEY = 'tablero_inyectoras_pend_mod_v1';
      let pend = {};
      try { pend = JSON.parse(localStorage.getItem(PEND_KEY) || '{}') || {}; } catch (e) { pend = {}; }
      Object.keys(pend).forEach(k => { pend[k].estado = 'error'; });
      const guardarPend = () => { try { const o = {}; Object.keys(pend).forEach(k => { if (pend[k].estado === 'error') o[k] = { data: pend[k].data, at: pend[k].at }; }); localStorage.setItem(PEND_KEY, JSON.stringify(o)); } catch (e) { } };
      let avisoOffline = 0;
      window.inoferModPendiente = function (k, data, estado) {
        if (estado === 'enviando') { pend[k] = { data, at: Date.now(), estado: 'enviando' }; }
        else if (pend[k] && pend[k].data === data) {
          if (estado === 'ok') delete pend[k];
          else { pend[k].estado = 'error'; if (navigator.onLine === false && Date.now() - avisoOffline > 60000) { avisoOffline = Date.now(); toast('📴 Sin internet: quedó guardado en este equipo y se sube solo cuando vuelva la conexión'); } }
          guardarPend();
        }
        ui();
      };
      function reintentar() {
        if (!enNube() || navigator.onLine === false) return;
        Object.keys(pend).forEach(k => { if (pend[k].estado === 'error') { try { pushCloudModuleState(k, pend[k].data); } catch (e) { } } });
        try { if (window.inoferPartesPendientes && inoferPartesPendientes()) fetchCloudRecords(true); } catch (e) { }
      }
      setInterval(reintentar, 20000);
      window.addEventListener('online', () => { setTimeout(reintentar, 800); ui(); toast('🌐 Volvió internet: subiendo lo que quedó pendiente…'); });
      window.addEventListener('offline', () => { ui(); toast('📴 Sin internet: podés seguir cargando, se guarda en el equipo'); });
      function ui() {
        const tag = $('inoferVersionTag');
        let p = $('inoferOfflinePill');
        if (!p && tag) { p = document.createElement('button'); p.type = 'button'; p.id = 'inoferOfflinePill'; p.className = 'hidden ml-1 rounded-full border px-2 py-0.5 text-[10px] font-bold'; tag.parentElement.insertBefore(p, tag.nextSibling); p.addEventListener('click', () => { reintentar(); toast(navigator.onLine === false ? 'Sin internet. Todo lo que cargues queda guardado en este equipo y se sube solo cuando vuelva la conexión.' : 'Subiendo los cambios pendientes…'); }); }
        if (!p) return;
        const n = Object.keys(pend).filter(k => pend[k].estado === 'error').length + ((window.inoferPartesPendientes && inoferPartesPendientes()) || 0);
        const off = navigator.onLine === false;
        p.classList.toggle('hidden', !off && !n);
        p.className = p.className.replace(/border-\S+|text-(rose|amber)-\S+|bg-\S+/g, '').trim() + (off ? ' border-rose-500/50 bg-rose-500/10 text-rose-200' : ' border-amber-500/50 bg-amber-500/10 text-amber-200');
        p.textContent = off ? `📴 Sin internet${n ? ' · ' + n + ' sin subir' : ''}` : `⏳ ${n} cambio${n > 1 ? 's' : ''} por subir`;
      }
      window.inoferOfflineUI = ui;
      window.inoferAvisosLista = () => avisosCache;
      window.inoferTurnosSinCargarDe = m => { try { return avisosCarga() ? turnosSinCargar().filter(x => x.m === m) : []; } catch (e) { return []; } };
      window.inoferModsPendientes = () => Object.keys(pend);
      setInterval(ui, 5000);
      function instalarFiltroNube() {
        if (typeof window.applyCloudModules !== 'function' || window.applyCloudModules.__planta) return;
        const am = window.applyCloudModules;
        const f = function (mods) {
          if (mods && typeof mods === 'object') {
            const ks = Object.keys(pend);
            if (ks.length) { mods = Object.assign({}, mods); ks.forEach(k => { delete mods[k]; }); }
            try { recibirMods(mods); } catch (e) { }
          }
          return am.apply(this, [mods].concat([].slice.call(arguments, 1)));
        };
        f.__planta = true;
        window.applyCloudModules = f;
      }
      instalarFiltroNube();
      window.addEventListener('load', () => { instalarFiltroNube(); ui(); });

      // ---------------------------------------------------------------------------------
      // 2) Controles al cargar (Carga rápida y parte manual)
      // ---------------------------------------------------------------------------------
      window.inoferControlTurno = function (o, d) {
        const av = [];
        const hoy = hoyIso();
        if (d.fecha > masDias(hoy, 1) || (d.fecha > hoy && aMin(d.ini) < 20 * 60)) { av.bloqueo = '⚠️ La fecha del turno (' + fFecha(d.fecha) + ') es posterior a hoy. Corregí la fecha.'; return av; }
        const atras = difDias(hoy, d.fecha);
        if (atras > 7) av.push(`La fecha es de hace ${atras} días (${fFecha(d.fecha)}).`);
        const horas = horasEntre(d.ini, d.fin);
        const andando = Math.max(0, horas - (Number(d.paradasMin) || 0) / 60);
        const c = catDe(o.part);
        const uh = Number(o.unitsPerHour) || Number(c && c.unitsPerHour) || 0;
        const total = (d.ok || 0) + (d.scrap || 0) + (d.baja || 0);
        if (uh) {
          const max = Math.ceil(uh * horas * 1.2);
          if (total > max) av.push(`Cargaste ${n0(total)} piezas en total, pero en ${n1(horas)} h esta pieza da como máximo unas ${n0(max)} (${n0(uh)} u/h). ¿No sobra un número?`);
          else if (andando >= 2 && d.ok > 0 && d.ok < uh * andando * 0.25) av.push(`Son pocas piezas buenas (${n0(d.ok)}) para ${n1(andando)} h de máquina andando (se esperaban unas ${n0(uh * andando)}). Si hubo paradas, cargalas.`);
        }
        if ((d.scrap || 0) > Math.max(20, total * 0.15)) av.push(`El scrap es alto: ${n0(d.scrap)} piezas (${n1(d.scrap / Math.max(1, total) * 100)}% del total).`);
        if (!d.ok && !d.paradasMin) av.push('No cargaste piezas buenas ni paradas. Si la máquina estuvo parada, cargá el motivo.');
        // varias piezas en un turno: solo es "repetido" si los horarios se pisan (la Carga rápida ya lo revisa sola: pisadaRevisada)
        const tramo = (i, f) => { const a = aMin(i || '00:00'); let b = aMin(f || '00:00'); if (b <= a) b += 1440; return [a, b]; };
        const seTocan = l => { if (!l.startTime || !d.ini) return true; const x = tramo(l.startTime, l.endTime), y = tramo(d.ini, d.fin); return Math.min(x[1], y[1]) - Math.max(x[0], y[0]) > 0; };
        const otro = d.pisadaRevisada ? null : (o.logs || []).find(l => l.id !== d.editLogId && l.date === d.fecha && (norm(l.turno) === norm(d.turno) || (l.startTime === d.ini && l.endTime === d.fin)) && seTocan(l));
        if (otro) av.push(`Ya hay un turno ${d.turno} del ${fFecha(d.fecha)} cargado en esta orden (${n0(otro.okPcs)} buenas · ${otro.operator || ''}). ¿Es otro distinto?`);
        const m = (window.inoferCargaRapida && inoferCargaRapida.maqDeOrden) ? inoferCargaRapida.maqDeOrden(o) : maqId(o.machine);
        const otraOp = d.pisadaRevisada ? null : ordenes().find(x => x.id !== o.id && maqId(x.machine) === m && (x.logs || []).some(l => l.id !== d.editLogId && l.date === d.fecha && norm(l.turno) === norm(d.turno) && seTocan(l)));
        if (otraOp && !otro) av.push(`En la ${m} ya cargaron el turno ${d.turno} del ${fFecha(d.fecha)} en otra orden (OP ${otraOp.ordNumber} · ${otraOp.part}).`);
        return av;
      };
      document.addEventListener('submit', ev => {
        if (!ev.target || ev.target.id !== 'newEntryForm') return;
        const fecha = ($('modalDate') || {}).value || hoyIso(), maq = ($('modalMachine') || {}).value, turno = ($('modalShift') || {}).value;
        const disp = Number(($('modalAvailableHours') || {}).value) || 0;
        const editId = typeof editingRecordId !== 'undefined' ? editingRecordId : null;
        if (fecha > hoyIso()) { ev.preventDefault(); ev.stopImmediatePropagation(); toast('⚠️ La fecha (' + fFecha(fecha) + ') es posterior a hoy. Corregí la fecha.'); return; }
        const av = [];
        if (difDias(hoyIso(), fecha) > 7) av.push(`La fecha es de hace ${difDias(hoyIso(), fecha)} días (${fFecha(fecha)}).`);
        const limite = /semana/i.test(turno) ? 168 : (/d[ií]a/i.test(turno) ? 24 : 12.5);
        if (disp > limite) av.push(`Cargaste ${n1(disp)} horas disponibles para "${turno}". ¿Está bien?`);
        if (!disp) av.push('Las horas disponibles están en 0.');
        const dup = partes().find(r => String(r.id) !== String(editId) && String(r.date).slice(0, 10) === fecha && maqId(r.machine) === maqId(maq) && norm(r.shift) === norm(turno));
        if (dup) av.push(`Ya hay un parte de la ${maqId(maq)} del ${fFecha(fecha)} turno ${turno}.`);
        if (av.length && !confirm('Revisá antes de guardar:\n\n• ' + av.join('\n• ') + '\n\n¿Está bien así? (Aceptar = guardar igual)')) { ev.preventDefault(); ev.stopImmediatePropagation(); }
      }, true);

      // ---------------------------------------------------------------------------------
      // 3) Códigos QR por máquina y por orden
      // ---------------------------------------------------------------------------------
      const BASE_URL = () => (/github\.io$/.test(location.hostname) ? location.origin + location.pathname.replace(/index\.html$/, '') : 'https://inofer-admin.github.io/INOFER/inofer/');
      // generador de QR incluido en la app (funciona sin internet)
      function cargarQr() { return window.inoferQR ? Promise.resolve(window.inoferQR) : Promise.reject(new Error('No se pudo cargar el generador de QR')); }
      function svgQr(txt) {
        const q = window.inoferQR(txt, 'M'), n = q.getModuleCount(), m = 2;
        let d = '';
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" width="100%" height="100%" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
      }
      // Al abrir la app con ?maq=… o ?op=… (escaneando un QR) va directo a la Carga rápida
      (function () {
        try {
          const p = new URLSearchParams(location.search);
          const maq = p.get('maq'), op = p.get('op');
          if (maq || op) {
            sessionStorage.setItem('inoferQrPend', JSON.stringify({ maq, op, at: Date.now() }));
            p.delete('maq'); p.delete('op');
            history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : '') + location.hash);
          }
        } catch (e) { }
      })();
      let qrTimer = null;
      function resolverQr() {
        let q = null; try { q = JSON.parse(sessionStorage.getItem('inoferQrPend') || 'null'); } catch (e) { }
        if (!q || !sesion() || !window.inoferCargaRapida) return;
        if (!can('ordenes', 'edit')) { sessionStorage.removeItem('inoferQrPend'); toast('Tu usuario no puede cargar producción'); return; }
        let o = null;
        if (q.op) { const n = String(q.op).replace(/\D/g, '').replace(/^0+/, ''); o = ordenes().find(x => String(x.ordNumber).replace(/\D/g, '').replace(/^0+/, '') === n || x.id === q.op); }
        const espera = Date.now() - q.at < 15000;
        if (q.op && !o && espera) { clearTimeout(qrTimer); qrTimer = setTimeout(resolverQr, 1200); return; } // todavía no llegaron las órdenes de la nube
        sessionStorage.removeItem('inoferQrPend');
        const maq = o ? inoferCargaRapida.maqDeOrden(o) : (MAQS().find(m => norm(m) === norm(q.maq)) || maqId(q.maq));
        inoferCargaRapida.abrir({ maq, ordId: o ? o.id : '' });
        toast(o ? `📷 OP ${o.ordNumber} · ${o.part}: cargá el turno` : (q.op ? `No encontré la OP ${q.op}; elegí la orden en la ${maq}` : `📷 Máquina ${maq}`));
      }
      function abrirQr() {
        cerrarModal();
        const m = modal('🏷️ Códigos QR para la planta', `
          <p class="text-xs text-slate-400">Imprimilos y pegá cada uno en su máquina (o en la orden impresa). El operario lo escanea con la cámara del celular y entra directo a la carga del turno. Tiene que haber iniciado sesión una vez en ese celular.</p>
          <div class="flex flex-wrap gap-2"><button type="button" class="qr-tab ${BTN} border-cyan-400 bg-cyan-500/15 text-white" data-t="maq">Máquinas</button><button type="button" class="qr-tab ${BTN} border-slate-700 text-slate-300" data-t="op">Órdenes abiertas</button>
            <button type="button" id="qrImprimir" class="${BTN} ml-auto border-emerald-500/50 bg-emerald-500/15 text-emerald-200">🖨️ Imprimir</button></div>
          <div id="qrLista" class="grid gap-3 sm:grid-cols-2"><div class="text-xs text-slate-400">Cargando…</div></div>`);
        let tipo = 'maq';
        const items = () => tipo === 'maq' ? MAQS().map(x => ({ t: x, s: FULL[x] || '', url: BASE_URL() + '?maq=' + encodeURIComponent(x), pie: 'Escaneá para cargar la producción' }))
          : ordenes().filter(o => !esDemoOrden(o) && window.inoferCargaRapida && inoferCargaRapida.abierta(o)).map(o => ({ t: 'OP ' + o.ordNumber, s: o.part + ' · ' + (inoferCargaRapida.maqDeOrden(o) || o.machine) + ' · ' + n0(o.qtyTarget) + ' u', url: BASE_URL() + '?op=' + encodeURIComponent(o.ordNumber), pie: 'Escaneá para cargar el turno de esta orden' }));
        const dibujar = () => {
          cargarQr().then(() => {
            const L = items();
            m.querySelector('#qrLista').innerHTML = L.length ? L.map(x => `<div class="flex items-center gap-3 rounded-xl border border-slate-700 bg-white p-3 text-slate-900"><div style="width:110px;height:110px" class="shrink-0">${svgQr(x.url, 4)}</div><div class="min-w-0"><div class="text-2xl font-black">${esc(x.t)}</div><div class="text-xs text-slate-600">${esc(x.s)}</div><div class="mt-1 text-[10px] text-slate-500">${esc(x.pie)}</div></div></div>`).join('') : '<div class="text-xs text-slate-400">No hay órdenes abiertas.</div>';
          }).catch(e => { m.querySelector('#qrLista').innerHTML = `<div class="text-xs text-rose-300">${esc(e.message)}</div>`; });
        };
        m.addEventListener('click', e => {
          const t = e.target.closest('.qr-tab');
          if (t) { tipo = t.dataset.t; m.querySelectorAll('.qr-tab').forEach(b => { const on = b === t; b.className = `qr-tab ${BTN} ${on ? 'border-cyan-400 bg-cyan-500/15 text-white' : 'border-slate-700 text-slate-300'}`; }); dibujar(); }
          if (e.target.closest('#qrImprimir')) {
            cargarQr().then(() => {
              const cards = items().map(x => `<div class="c"><div class="q">${svgQr(x.url, 8)}</div><div class="t">${esc(x.t)}</div><div class="s">${esc(x.s)}</div><div class="p">${esc(x.pie)}</div><div class="i">INOFER</div></div>`).join('');
              imprimir(`<style>body{font-family:Arial,sans-serif;margin:0}.g{display:grid;grid-template-columns:1fr 1fr;gap:10mm;padding:8mm}.c{border:2px solid #0f172a;border-radius:6mm;padding:6mm;text-align:center;page-break-inside:avoid}.q{width:60mm;height:60mm;margin:0 auto}.q svg{width:100%;height:100%}.t{font-size:28pt;font-weight:900;margin-top:3mm}.s{font-size:11pt;color:#334155}.p{font-size:9pt;color:#64748b;margin-top:2mm}.i{font-size:8pt;letter-spacing:.2em;color:#0891b2;font-weight:800;margin-top:2mm}</style><div class="g">${cards}</div>`);
            }).catch(er => toast(er.message));
          }
        });
        dibujar();
      }
      function imprimir(html) {
        let f = $('inoferPrintFrame');
        if (f) f.remove();
        f = document.createElement('iframe'); f.id = 'inoferPrintFrame'; f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
        document.body.appendChild(f);

      const barra = (pct, txt) => { const c = pct >= 85 ? 'bg-rose-500' : (pct >= 70 ? 'bg-amber-400' : 'bg-emerald-500'); return `<div class="space-y-1"><div class="flex justify-between text-[11px] text-slate-300"><span>${txt}</span><b class="${pct >= 70 ? 'text-amber-300' : 'text-white'}">${n1(pct)}%</b></div><div class="h-2.5 overflow-hidden rounded-full bg-slate-800"><div class="h-full ${c}" style="width:${Math.min(100, Math.max(1, pct))}%"></div></div></div>`; };
      const NOMBRE_DATO = { orders: 'Órdenes y turnos', gantt: 'Plan Gantt', catalog: 'Base de datos de piezas', weekly: 'Cierres semanales', memory: 'Memoria de la IA', config: 'Configuración', pistones: 'Pistones', kpis: 'Indicadores', turnos: 'Turnos', setup: 'Set-up y máquinas', presentacion: 'Presentación', mantenimiento: 'Mantenimiento', stock: 'Stock', avisos: 'Avisos', informes: 'Informe semanal', records: 'Partes de horas', catalog_v3: 'Base de datos de piezas', gantt_weeks: 'Plan Gantt', pend_mod: 'Cambios sin subir', users: 'Usuarios' };
      async function abrirAlmacen() {
        if (!esAdmin()) return;
        let meses = 6, archivadas = null, buscar = '';
        const w = modal('💾 Almacenamiento', '<div id="almCuerpo" class="space-y-4 text-xs text-slate-300">Calculando…</div>', 'max-w-4xl');
        const cuerpo = () => w.querySelector('#almCuerpo');
        const pintar = () => {
          const L = usoLocal(), P = porcentajes(), U = usoNube;
          const sync = U ? Object.values(U.modulos || {}).reduce((a, b) => a + b, 0) : 0;
          const arch = (archivadas || []).filter(a => !buscar || norm(a.ordNumber + ' ' + a.part + ' ' + a.machine).includes(norm(buscar)));
          cuerpo().innerHTML = `
            <div class="grid gap-3 sm:grid-cols-2">
              <div class="rounded-xl border border-slate-700 bg-slate-950/60 p-3 space-y-2"><div class="text-sm font-black text-white">☁️ Nube (Google Sheets)</div>
                ${U ? barra(P.cel, `${n0(U.celdas)} de ${n0(U.limiteCeldas)} celdas`) + barra(P.prp, `Sesiones y claves: ${kb(U.props)} de ${kb(U.limiteProps)}`) +
                  `<div class="text-[11px] text-slate-400">${n0(U.partes)} partes de horas · ${n0(U.ordenes)} órdenes con ${n0(U.turnos)} turnos · ${n0(U.archivadas)} archivadas</div>
                   <details class="text-[11px] text-slate-400"><summary class="cursor-pointer">Detalle por hoja</summary>${U.hojas.map(h => `<div class="flex justify-between"><span>${esc(h.hoja)}</span><span>${n0(h.filas)} filas · ${n0(h.celdas)} celdas</span></div>`).join('')}</details>` : '<div class="text-slate-400">Consultando la nube…</div>'}</div>
              <div class="rounded-xl border border-slate-700 bg-slate-950/60 p-3 space-y-2"><div class="text-sm font-black text-white">💻 Este equipo</div>
                ${barra(P.loc, `${kb(L.total)} de unos ${kb(LIMITE_LOCAL)} (límite del navegador)`)}
                <div class="text-[11px] text-slate-400">${L.det.map(([k, v]) => `<div class="flex justify-between"><span>${esc(NOMBRE_DATO[k] || k)}</span><span>${kb(v)}</span></div>`).join('')}</div>
                ${U ? `<div class="text-[11px] text-slate-400">En cada sincronización cada equipo baja <b class="text-white">${kb(sync)}</b> de datos.</div>` : ''}</div>
            </div>
            <div class="rounded-xl border border-cyan-500/30 bg-slate-950/60 p-3 space-y-2"><div class="text-sm font-black text-cyan-300">🗄️ Archivar órdenes viejas</div>
              <p class="text-[11px] text-slate-400">Las órdenes <b>completadas</b> cuyo último turno es anterior a la fecha elegida pasan a una hoja aparte de la nube (BD_Archivo_Ordenes). Dejan de viajar a cada celular y PC, pero <b>siguen contando</b> en el tablero, los velocímetros y el informe semanal. Se pueden volver a sacar del archivo cuando quieras.</p>
              <div class="flex flex-wrap items-center gap-2"><span>Archivar las completadas de hace más de</span><select id="almMeses" class="${INP}">${[3, 6, 12, 24].map(m => `<option value="${m}" ${m === meses ? 'selected' : ''}>${m} meses</option>`).join('')}</select>
                ${U ? (U.candidatas ? `<span class="text-white">→ <b>${n0(U.candidatas)}</b> órdenes (${n0(U.turnosCandidatas)} turnos, ${kb(U.bytesCandidatas)}) con último turno antes del ${fFecha(U.corte)}/${String(U.corte).slice(0, 4)}</span><button type="button" id="almArchivar" class="${BTN} border-cyan-400 bg-cyan-500 text-slate-950">Archivar ${n0(U.candidatas)} órdenes</button>` : `<span class="text-slate-400">No hay órdenes completadas tan viejas para archivar.</span>`) : ''}</div></div>
            ${U && U.auto ? `<div class="rounded-xl border border-emerald-500/30 bg-emerald-500/5 p-3 space-y-1.5"><label class="flex flex-wrap items-center gap-2 text-[12px] text-slate-200"><input type="checkbox" id="almAuto" ${U.auto.activo ? 'checked' : ''} class="h-4 w-4 accent-emerald-500"><b class="text-emerald-300">🤖 Archivar solo, todos los días</b> las completadas de hace más de <select id="almAutoMeses" class="${INP}">${[1, 2, 3, 6, 12, 24].map(m => `<option value="${m}" ${m === U.auto.meses ? 'selected' : ''}>${m} ${m === 1 ? 'mes' : 'meses'}</option>`).join('')}</select></label>
              <div class="text-[11px] text-slate-400">${U.auto.activo ? 'Así la app sigue rápida aunque pasen los años. ' : 'Apagado: solo se archiva cuando tocás el botón de arriba. '}${U.autoUltimo ? `Última revisión: ${fFecha(U.autoUltimo.dia)}/${String(U.autoUltimo.dia).slice(0, 4)} · ${U.autoUltimo.archivadas ? n0(U.autoUltimo.archivadas) + ' archivadas' : 'no había nada para archivar'}.` : ''}</div></div>` : ''}
            <div class="rounded-xl border border-slate-700 bg-slate-950/60 p-3 space-y-2"><div class="flex flex-wrap items-center justify-between gap-2"><span class="text-sm font-black text-white">📁 Órdenes archivadas ${archivadas ? '(' + archivadas.length + ')' : ''}</span><input id="almBuscar" value="${esc(buscar)}" placeholder="Buscar OP o pieza…" class="${INP} w-48"></div>
              ${archivadas == null ? '<div class="text-slate-400">Cargando…</div>' : (arch.length ? `<div class="max-h-64 overflow-y-auto"><table class="w-full text-xs"><thead class="sticky top-0 bg-slate-950"><tr class="text-left text-[10px] uppercase text-slate-500"><th class="py-1 pr-2">OP</th><th class="pr-2">Pieza</th><th class="pr-2">Máquina</th><th class="pr-2">Último turno</th><th class="pr-2 text-right">Buenas</th><th></th></tr></thead><tbody>
                ${arch.slice(0, 300).map(a => `<tr class="border-t border-slate-800"><td class="py-1 pr-2 font-bold text-white">${esc(a.ordNumber)}</td><td class="pr-2">${esc(a.part)}</td><td class="pr-2 text-slate-400">${esc(maqId(a.machine))}</td><td class="pr-2 text-slate-400">${a.ultima ? fFecha(a.ultima) + '/' + a.ultima.slice(0, 4) : '—'}</td><td class="pr-2 text-right">${n0(a.ok)} / ${n0(a.qty)}</td><td class="text-right"><button type="button" class="alm-rest ${BTN} border-slate-600 text-slate-200" data-id="${esc(a.id)}">↩ Sacar del archivo</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="text-slate-400">No hay órdenes archivadas.</div>')}</div>
            <div class="rounded-xl border border-emerald-500/30 bg-slate-950/60 p-3 space-y-2"><div class="text-sm font-black text-emerald-300">🛟 Copias de seguridad</div>
              <div id="almResp" class="text-[11px] text-slate-400">Consultando…</div>
              <div class="flex flex-wrap gap-2"><button type="button" id="almBajar" class="${BTN} border-emerald-500/50 bg-emerald-500/15 text-emerald-200">⬇ Descargar una copia completa ahora</button><button type="button" id="almCodigo" class="${BTN} border-slate-600 text-slate-200">Activar la copia diaria automática</button></div>
              <div id="almCodigoBox" class="hidden space-y-2 text-[11px] text-slate-300"><div class="rounded-lg border border-amber-500/30 bg-amber-500/10 p-2 text-amber-100"><b>Una sola vez</b> (sirve también para el mail del informe): abrí tu proyecto de Apps Script → archivo <b>Código.gs</b> → pegá esto <b>al final</b> → Guardar → arriba elegí <b>activarAutomaticos</b> → <b>Ejecutar</b> → aceptá los permisos. Desde ahí, todas las noches se guarda una copia de toda la planilla en tu Google Drive (carpeta "INOFER respaldos", últimas 30).</div><pre class="max-h-40 overflow-auto rounded-lg bg-slate-950 p-2 text-[10px] text-emerald-200">${esc(CODIGO_GS)}</pre><button type="button" id="almCopiarCodigo" class="${BTN} border-slate-600 text-slate-200">📋 Copiar el código</button></div></div>
            <p class="text-[11px] text-slate-500">Cuando algo pase del 70% te aparece un aviso en la 🔔. Esta ventana y los avisos de espacio los ve solo el administrador.</p>`;
          if (document.activeElement && document.activeElement.id === 'almBuscar') { }
        };
        const respaldo = async () => {
          try {
            const r = await api({ action: 'respaldoInfo' }); const el = w.querySelector('#almResp'); if (!el) return;
            el.innerHTML = r.ultimo ? `✓ Última copia automática: <b class="text-white">${fFecha(r.ultimo.slice(0, 10))}/${r.ultimo.slice(0, 4)}</b> · ${r.lista.length} guardadas en Drive.${r.lista.slice(0, 5).map(x => ` <a href="${esc(x.url)}" target="_blank" rel="noopener" class="text-cyan-300 underline">${esc(x.nombre.replace('INOFER respaldo ', ''))}</a>`).join(' ·')}`
              : (r.error ? `<span class="text-rose-300">La copia automática dio error: ${esc(r.error)}</span>` : 'La copia diaria automática todavía no está activada. Mientras tanto podés descargar una copia completa cuando quieras.');
          } catch (e) { }
        };
        const cargar = async () => {
          pintar(); respaldo();
          try { await pedirUsoNube(meses); } catch (e) { toast('No se pudo consultar la nube: ' + e.message); }
          try { archivadas = (await api({ action: 'archivoListar' })).archivadas || []; } catch (e) { archivadas = []; }
          pintar();
        };
        w.addEventListener('change', async e => {
          if (e.target.id === 'almMeses') { meses = Number(e.target.value) || 6; usoNube = null; cargar(); }
          if (e.target.id === 'almAuto' || e.target.id === 'almAutoMeses') {
            const activo = !!(w.querySelector('#almAuto') || {}).checked, m = Number((w.querySelector('#almAutoMeses') || {}).value) || 3;
            try { await api({ action: 'archivoAutoConfig', activo, meses: m }); toast(activo ? `✓ Se archivan solas las completadas de hace más de ${m} ${m === 1 ? 'mes' : 'meses'}` : 'Archivo automático apagado'); } catch (er) { toast('No se pudo guardar: ' + er.message); }
            if (activo) { try { const r = await api({ action: 'archivoAutoRevisar' }); if (r.archivadas) { archRegs = null; try { lastLocalChangeAt = 0; pendingCloudOps = 0; fetchCloudRecords(true); } catch (er) { } toast(`✓ ${r.archivadas} órdenes archivadas`); } } catch (er) { } }
            usoNube = null; archivadas = null; cargar();
          }
        });
        w.addEventListener('input', e => { if (e.target.id === 'almBuscar') { buscar = e.target.value; pintar(); const i = w.querySelector('#almBuscar'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); } });
        w.addEventListener('click', async e => {
          const b = e.target.closest('button'); if (!b) return;
          if (b.id === 'almCodigo') { w.querySelector('#almCodigoBox').classList.toggle('hidden'); return; }
          if (b.id === 'almCopiarCodigo') { try { await navigator.clipboard.writeText(CODIGO_GS); toast('Código copiado'); } catch (er) { toast('Seleccioná el texto y copialo a mano'); } return; }
          if (b.id === 'almBajar') {
            b.disabled = true; b.textContent = 'Armando la copia…';
            try {
              const d = await (await fetch(cloudApiUrl + (cloudApiUrl.includes('?') ? '&' : '?') + 'action=json&t=' + Date.now() + inoferTokenParam())).json();
              let arch = []; try { arch = (await api({ action: 'archivoListar' })).archivadas || []; } catch (er) { }
              const copia = { app: 'INOFER', tipo: 'copia completa', fecha: new Date().toISOString(), version: window.inoferVersionActual || '', partes: d.records || [], modulos: d.modules || {}, ordenesArchivadas: arch };
              const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(copia)], { type: 'application/json' })); a.download = 'INOFER_copia_' + hoyIso() + '.json'; a.click();
              toast('✓ Copia descargada: guardala en un lugar seguro');
            } catch (er) { toast('No se pudo armar la copia: ' + er.message); }
            b.disabled = false; b.textContent = '⬇ Descargar una copia completa ahora';
            return;
          }
          if (b.id === 'almArchivar') {
            if (!confirm(`¿Archivar ${usoNube.candidatas} órdenes completadas?\n\nSiguen contando en el tablero y en el informe, y las podés sacar del archivo cuando quieras.`)) return;
            b.disabled = true; b.textContent = 'Archivando…';
            try {
              const d = await api({ action: 'archivarOrdenes', meses });
              archRegs = null;
              try { lastLocalChangeAt = 0; pendingCloudOps = 0; fetchCloudRecords(true); } catch (er) { }
              toast(`✓ ${d.archivadas} órdenes archivadas`);
            } catch (er) { toast('No se pudo archivar: ' + er.message); }
            usoNube = null; archivadas = null; cargar();
          }
          if (b.classList.contains('alm-rest')) {
            b.disabled = true;
            try { await api({ action: 'archivoRestaurar', id: b.dataset.id }); archRegs = null; try { lastLocalChangeAt = 0; pendingCloudOps = 0; fetchCloudRecords(true); } catch (er) { } toast('✓ La orden volvió a la lista'); }
            catch (er) { toast(er.message); }
            usoNube = null; archivadas = null; cargar();
          }
        });
        cargar();
      }
      window.inoferAlmacenamiento = abrirAlmacen;
      // Archivo automático: al abrir la app se le pide a la nube que revise (hace algo como mucho una vez por día)
      setTimeout(async function revisarArchivo() {
        if (!sesion() || !enNube()) { setTimeout(revisarArchivo, 60000); return; }
        try { const r = await api({ action: 'archivoAutoRevisar' }); if (r && r.archivadas) { archRegs = null; try { lastLocalChangeAt = 0; pendingCloudOps = 0; fetchCloudRecords(true); } catch (e) { } } } catch (e) { }
      }, 25000);
      window.inoferPlantaPerm = { verInforme: () => verInforme() && enNube(), esAdmin };
      window.inoferModGuardar = k => guardarMod(k);
      window.inoferRenderMant = () => { try { renderMant(); programarAvisos(); } catch (e) { } };
      window.inoferMarcarNoTrabajo = (m, fecha, turnoNombre) => { const av = D('avisos'); av.ignorados = av.ignorados || {}; av.ignorados[m + '|' + fecha + '|' + turnoNombre] = { por: quien(), at: new Date().toISOString() }; guardarMod('avisos'); try { programarAvisos(); } catch (e) { } };
      window.inoferPlanificadoEnGantt = (m, fecha) => { try { return planificadoEnGantt(m, fecha); } catch (e) { return false; } };
      // turnos de órdenes archivadas: se piden una vez por sesión y suman en el tablero
      let archRegs = null, archPidiendo = false, archAt = 0;
      function pedirArch() {
        if (archPidiendo || !enNube() || (archRegs && Date.now() - archAt < 30 * 60000)) return;
        archPidiendo = true;
        api({ action: 'archivoRegistros' }).then(d => { archRegs = d.records || []; archAt = Date.now(); archPidiendo = false; if (archRegs.length) { try { refreshAll(); } catch (e) { } } })
          .catch(() => { archPidiendo = false; archRegs = archRegs || []; archAt = Date.now(); });
      }
      function instalarArchivoTablero() {
        if (typeof window.getFilteredRecords !== 'function' || window.getFilteredRecords.__planta) return;
        const gf = window.getFilteredRecords;
        const f = function () {
          const base = gf.apply(this, arguments);
          if (!sesion()) return base;
          const fuente = ($('filterFuente') || {}).value || 'ALL';
          if (fuente === 'MANUAL') return base;
          pedirArch();
          if (!archRegs || !archRegs.length) return base;
          const machine = ($('filterMachine') || {}).value || 'ALL', shift = ($('filterShift') || {}).value || 'ALL';
          const from = ($('filterDateFrom') || {}).value, to = ($('filterDateTo') || {}).value;
          const ids = new Set(base.map(r => r.id));
          const extra = archRegs.filter(r => !ids.has(r.id) && (machine === 'ALL' || r.machine === machine) && (shift === 'ALL' || r.shift === shift) && (!from || r.date >= from) && (!to || r.date <= to));
          return extra.length ? base.concat(extra).sort((a, b) => String(b.date || '').localeCompare(String(a.date || ''))) : base;
        };
        f.__planta = true; window.getFilteredRecords = f;
      }
      document.addEventListener('click', e => { if (e.target.closest && e.target.closest('#almBtn')) abrirAlmacen(); });
      // consulta de espacio para el aviso (solo admin, una vez por hora)
      setInterval(() => { if (esAdmin() && enNube() && Date.now() - usoNubeAt > 3600000) pedirUsoNube().catch(() => { usoNubeAt = Date.now(); }); }, 60000);
      setTimeout(() => { if (esAdmin() && enNube() && !usoNube) pedirUsoNube().catch(() => { usoNubeAt = Date.now(); }); }, 8000);

      // ---------------------------------------------------------------------------------
      // Arranque
      // ---------------------------------------------------------------------------------
      function iniciar() {
        try { montarMant(); montarStock(); montarAud(); instalarTabs(); montarBotonQr(); montarBotonInforme(); instalarArchivoTablero(); } catch (e) { console.error(e); }
        if (typeof window.inoferApplyPermissions === 'function' && !window.inoferApplyPermissions.__planta) {
          const ap = window.inoferApplyPermissions;
          const f = function () { const r = ap.apply(this, arguments); try { montarBotonQr(); montarBotonInforme(); aplicarVisibilidad(); } catch (e) { console.error(e); } return r; };
          f.__planta = true; window.inoferApplyPermissions = f;
        }
        try { aplicarVisibilidad(); } catch (e) { }
        if (typeof window.saveProductionOrders === 'function' && !window.saveProductionOrders.__planta) {
          const sp = window.saveProductionOrders;
          const f = function () { const r = sp.apply(this, arguments); programarAvisos(); try { renderStock(); renderMant(); } catch (e) { } return r; };
          f.__planta = true; window.saveProductionOrders = f;
        }
        if (typeof window.renderGanttView === 'function' && !window.renderGanttView.__planta) {
          const rg = window.renderGanttView;
          const f = function () { const r = rg.apply(this, arguments); programarAvisos(); return r; };
          f.__planta = true; window.renderGanttView = f;
        }
        ui();
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(iniciar, 0)); else setTimeout(iniciar, 0);
      window.addEventListener('load', () => setTimeout(() => { try { iniciar(); } catch (e) { } }, 50));
    })();
  </script>
