  <script>
    // ===== Mantenimiento: cargar una base de datos (Excel/CSV) y que arme sola el plan preventivo =====

    (function () {

      const solo = s => norm(s).replace(/[^a-z0-9]/g, '');
      function maquinaDe(txt) {
        const t = solo(txt); if (!t || /^(todas|todaslasmaquinas|general|planta|all)$/.test(t)) return 'TODAS';
        const L = MAQS();
        let m = L.find(x => solo(x.id) === t) || L.find(x => x.name && solo(x.name) === t);
        if (!m) m = L.find(x => t.includes(solo(x.id))) || L.find(x => x.name && t.includes(solo(x.name)));
        if (!m && /200/.test(t)) m = L.find(x => solo(x.id) === (/n\b|n$|negra|200n/.test(t) ? '200n' : (/v/.test(t) ? '200v' : '')));
        return m ? m.id : '';
      }
      const PALABRAS = [[/^diari|todos los dias|cada dia/, 1], [/^seman/, 7], [/^quincen/, 15], [/^mensual|^mes$/, 30], [/^bimestr/, 60], [/^trimestr/, 90], [/^cuatrimestr/, 120], [/^semestr/, 180], [/^anual|^ano$/, 365]];
      function frecuencia(txt, unidad) {

      }
      // ===== Planilla de HISTORIAL (reparaciones hechas): pasa al historial y sugiere preventivos con lo que se repite =====
      // Títulos: Reparaciones/Problemas/Trabajo/Falla, Maq/Máquina/Equipo/Servicio, Fecha, Descripción/Observaciones, Realizó, HH/Horas, Monto/Costo, Proveedor.
      function hashTxt(t) { let h = 5381; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) >>> 0; return h.toString(36); }

      }
      function leerHistorial(filas) {
        let h = -1, C = {};

      // agrupa trabajos de las inyectoras que hablan de lo mismo (palabras en común) → candidatos a preventivo

        w = document.createElement('div'); w.id = 'inoferHistPrev'; w.className = 'fixed inset-0 z-[72] flex items-start justify-center overflow-y-auto bg-black/70 p-3 sm:p-6';
        w.innerHTML = `<div class="w-full max-w-4xl overflow-hidden rounded-2xl border border-slate-700 bg-slate-950 text-slate-100 shadow-2xl">
          <div class="flex items-center justify-between gap-3 border-b border-slate-800 bg-slate-900 px-5 py-4"><div><div class="text-[11px] font-bold tracking-wider text-slate-400">MANTENIMIENTO · ${esc(nombre)}</div><div class="text-lg font-black text-white">🧾 Planilla de reparaciones → historial</div></div><button type="button" data-a="cerrar" class="rounded-lg border border-slate-700 px-2.5 py-1 text-xs text-slate-300">✕ Cerrar</button></div>
          <div class="space-y-4 p-5">
            <label class="flex items-start gap-3 rounded-xl border border-cyan-500/40 bg-cyan-500/10 p-3"><input type="checkbox" id="hpHist" checked class="mt-1 h-5 w-5"><span class="text-sm"><b class="text-cyan-100">Pasar ${res.trabajos.length} trabajos al historial</b> <span class="text-slate-300">(${fF(fechas[0])} al ${fF(fechas[fechas.length - 1])})</span>${repetidos ? `<br><span class="text-xs text-slate-400">${repetidos} ya estaban cargados: no se duplican.</span>` : ''}
              <span class="mt-2 flex flex-wrap gap-1">${eqs.map(([m, n]) => `<span class="rounded-full ${ids.indexOf(m) >= 0 ? 'bg-orange-500/20 text-orange-100' : 'bg-slate-800 text-slate-300'} px-2 py-0.5 text-[11px] font-bold">${esc(m)} · ${n}</span>`).join('')}</span>
              <span class="mt-1 block text-[11px] text-slate-400">Las inyectoras se unificaron con los nombres de la app (IP 200 V → 200V…). Los otros equipos quedan con su nombre y se pueden filtrar en el historial.</span></span></label>
            ${res.omitidas.length || sinHH ? `<div class="rounded-xl border border-amber-500/40 bg-amber-500/10 p-3 text-xs text-amber-100">${res.omitidas.length ? `<b>No se cargan ${res.omitidas.length} fila(s):</b><br>${res.omitidas.slice(0, 8).map(esc).join('<br>')}<br>` : ''}${sinHH ? `${sinHH} trabajos no tienen horas (HH): se cargan igual; conviene anotar las horas de máquina parada de acá en adelante.` : ''}</div>` : ''}
            <div><div class="mb-1 text-sm font-black text-sky-200">💡 Preventivos sugeridos — cosas que se repitieron</div>
              <div class="mb-2 text-xs text-slate-400">Tildá los que querés sumar al plan y ajustá cada cuántos días. Se arma uno por cada máquina donde pasó, contando desde la última vez.</div>
              ${sug.length ? `<div class="max-h-[44vh] overflow-y-auto rounded-xl border border-slate-800"><table class="w-full text-xs"><thead class="sticky top-0 bg-slate-900 text-left text-[10px] uppercase text-slate-400"><tr><th class="py-2 pl-2"></th><th class="pr-2">Tarea</th><th class="pr-2">Veces</th><th class="pr-2">Máquinas (última vez)</th><th class="pr-2">Cada (días)</th></tr></thead><tbody>
                ${sug.map(x => `<tr class="border-t border-slate-800 align-top"><td class="py-2 pl-2 pr-2"><input type="checkbox" class="hp-s h-4 w-4" data-id="${x.id}" ${x.veces >= 3 ? 'checked' : ''}></td>
                  <td class="py-1.5 pr-2"><input class="hp-t w-full rounded-lg border border-slate-700 bg-slate-900 px-2 py-1 text-xs text-white" data-id="${x.id}" value="${esc(x.tarea)}"><div class="mt-1 text-[10px] text-slate-500">${x.ejemplos.map(esc).join('<br>')}</div></td>
                  <td class="pr-2 font-bold text-white">${x.veces}</td>
                  <td class="pr-2 text-slate-300">${x.maquinas.map(m => `<b>${esc(m)}</b> ${fF(x.ultimo[m]).slice(0, 5)}`).join('<br>')}</td>
                  <td class="pr-2"><input type="number" min="1" class="hp-c w-20 rounded-lg border border-slate-700 bg-slate-900 px-2 py-1 text-xs text-white" data-id="${x.id}" value="${x.cadaDias}"><div class="text-[10px] text-slate-500">${x.porRepeticion ? 'según cada cuánto se repitió' : 'sugerido'}</div></td></tr>`).join('')}
              </tbody></table></div>` : '<div class="text-xs text-slate-400">No encontré trabajos repetidos en las inyectoras.</div>'}</div>
            <div class="flex flex-wrap items-center justify-end gap-2"><button type="button" data-a="cerrar" class="rounded-xl border border-slate-700 px-4 py-2.5 text-sm text-slate-300">Cancelar</button><button type="button" data-a="cargar" class="rounded-xl bg-emerald-500 px-5 py-2.5 text-sm font-black text-emerald-950">✓ Cargar</button></div>
          </div></div>`;
        document.body.appendChild(w);
        w.addEventListener('click', e => {
          const b = e.target.closest('[data-a]'); if (!b && e.target !== w) return;
          if (!b || b.dataset.a === 'cerrar') { w.remove(); return; }
          const r = cargarHistorial({ historial: $('hpHist').checked, sugeridos: Array.from(w.querySelectorAll('.hp-s:checked')).map(c => ({ id: c.dataset.id, tarea: (w.querySelector(`.hp-t[data-id="${c.dataset.id}"]`) || {}).value, cadaDias: Number((w.querySelector(`.hp-c[data-id="${c.dataset.id}"]`) || {}).value) || 0 })) });
          w.remove();
          if (r) toast(`✓ Historial: ${r.nuevos} trabajos nuevos${r.repetidos ? ` (${r.repetidos} ya estaban)` : ''} · Plan preventivo: ${r.planes} ${r.planes === 1 ? 'tarea' : 'tareas'}`);
        });
      }
      // opc: {historial: bool, sugeridos: [{id, tarea?, cadaDias?}]}
      function cargarHistorial(opc) {
        if (!previaH) return null;
        opc = opc || {};
        let r = { nuevos: 0, repetidos: 0 };
        if (opc.historial !== false) r = aplicarHistorial(previaH.res.trabajos) || r;
        const plan = [];
        (opc.sugeridos || []).forEach(s => {
          const x = previaH.sug.find(y => y.id === s.id); if (!x) return;
          const tarea = String(s.tarea || x.tarea).trim().slice(0, 120); const cada = Math.max(1, Number(s.cadaDias) || x.cadaDias);
          x.maquinas.forEach(m => plan.push({ maquina: m, tarea, cadaDias: cada, ultimo: x.ultimo[m], avisoDias: null, responsable: '' }));
        });
        let planes = 0;
        if (plan.length) { const a = aplicar(plan, 'sumar'); planes = a ? a.nuevos + a.act : 0; }
        else { try { inoferRenderMant(); } catch (e) { } }
        const desde = previaH.res.trabajos.map(t => t.fecha).sort()[0];
        if (desde && window.inoferMantDias) { const d = Math.round((new Date() - new Date(desde + 'T12:00:00')) / 864e5); inoferMantDias(d > 180 ? 365 : (d > 90 ? 180 : (d > 30 ? 90 : 30))); }
        return { nuevos: r.nuevos, repetidos: r.repetidos, planes };
      }
      // planillas con formato aplicado hasta la columna XFD: se leen solo las primeras 40 columnas
      function recortar(hoja) {
        try { const R = XLSX.utils.decode_range(hoja['!ref'] || 'A1'); if (R.e.c > 39) { R.e.c = 39; hoja['!ref'] = XLSX.utils.encode_range(R); } if (R.e.r > 20000) { R.e.r = 20000; hoja['!ref'] = XLSX.utils.encode_range(R); } } catch (e) { }
      }
      async function desdeArchivo(file) {
        try {
          let filas;
          if (/\.(csv|txt)$/i.test(file.name || '')) {
            const txt = await file.text(); const l0 = txt.split('\n')[0];
            const sep = (l0.match(/;/g) || []).length > (l0.match(/,/g) || []).length ? ';' : (l0.indexOf('\t') >= 0 ? '\t' : ',');
            filas = txt.split(/\r?\n/).map(l => l.split(sep));
          } else {
            if (typeof XLSX === 'undefined' || !XLSX.read) throw new Error('No se pudo abrir Excel en este equipo (hace falta internet la primera vez).');
            const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: 'array', cellDates: true });
            let mejor = null, err = null, hist = null;
            wb.SheetNames.forEach(n => { if (mejor) return; const hoja = wb.Sheets[n]; recortar(hoja); const filas2 = XLSX.utils.sheet_to_json(hoja, { header: 1, raw: true, defval: null }); try { const r = leerFilas(filas2); if (r.filas.length) mejor = r; } catch (e) { err = e; if (!hist) { const hh = leerHistorial(filas2); if (hh && hh.trabajos.length) hist = hh; } } });
            if (!mejor && hist) return mostrarHistorial(hist, file.name);
            if (!mejor) throw err || new Error('El archivo no tiene tareas.');
            return mostrar(mejor, file.name);
          }
          let r; try { r = leerFilas(filas); } catch (e) { const hh = leerHistorial(filas); if (hh && hh.trabajos.length) return mostrarHistorial(hh, file.name); throw e; }
          if (!r.filas.length) throw new Error('El archivo no tiene tareas.' + (r.errores.length ? ' ' + r.errores[0] : ''));
          mostrar(r, file.name);
        } catch (e) { toast('⚠️ ' + (e.message || e)); }
      }
      window.inoferBasePreventivos = { desdeArchivo, leerFilas, armar, aplicar, frecuencia, maquinaDe, mostrar: (r, n) => mostrar(r, n || 'archivo'), previa: () => previa,
        leerHistorial, sugerir, mostrarHistorial: (r, n) => mostrarHistorial(r, n || 'archivo'), cargarHistorial, previaHistorial: () => previaH };
    })();
  </script>
