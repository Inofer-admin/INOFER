  <script>
    // ===== Carga rápida de órdenes para el operario en máquina =====
    (function () {
      // En celular el encabezado fijo tapa un tercio de la pantalla: que se desplace con la página
      try { const stl = document.createElement('style'); stl.textContent = '@media (max-width: 640px){ body > header.sticky{ position: static; } }'; document.head.appendChild(stl); } catch (e) { }
      const $ = id => document.getElementById(id);
      const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
      const PREF_KEY = 'tablero_inyectoras_operario_v1';
      const MAQ = [
        { id: '200V', full: 'Italpresse 200 Tn (V)' }, { id: '200N', full: 'Italpresse 200 Tn (N)' }, { id: '180', full: 'Italpresse 180 Tn' },
        { id: 'H50', full: 'H-50' }, { id: 'Z30', full: 'Italpresse 30 Tn (Z-30)' }
      ];
      // Turnos configurables por el administrador (módulo de nube "turnos", se ve en todos los equipos)
      const TURNOS_KEY = 'tablero_inyectoras_turnos_v1';
      const TURNOS_DEF = { activo: 'e3', esquemas: [
        { id: 'e3', nombre: '3 turnos de 8 h', turnos: [{ nombre: 'Mañana', ini: '06:00', fin: '14:00' }, { nombre: 'Tarde', ini: '14:00', fin: '22:00' }, { nombre: 'Noche', ini: '22:00', fin: '06:00' }] },
        { id: 'e2', nombre: '2 turnos de 12 h', turnos: [{ nombre: 'Día', ini: '06:00', fin: '18:00' }, { nombre: 'Noche', ini: '18:00', fin: '06:00' }] }
      ] };
      let cfgTurnos = null;
      try { cfgTurnos = JSON.parse(localStorage.getItem(TURNOS_KEY) || 'null'); } catch (e) { }
      if (!cfgTurnos || !Array.isArray(cfgTurnos.esquemas) || !cfgTurnos.esquemas.length) cfgTurnos = JSON.parse(JSON.stringify(TURNOS_DEF));
      const aMin = h => { const [a, b] = String(h || '0:0').split(':').map(Number); return (a || 0) * 60 + (b || 0); };
      const icono = ini => { const h = aMin(ini) / 60; return h >= 4 && h < 11 ? '🌅' : (h >= 11 && h < 17 ? '☀️' : (h >= 17 && h < 21 ? '🌇' : '🌙')); };
      const esquemaActivo = () => cfgTurnos.esquemas.find(e => e.id === cfgTurnos.activo) || cfgTurnos.esquemas[0];
      const turnos = () => (esquemaActivo().turnos || []).map((t, i) => ({ id: 'T' + i, nombre: t.nombre || ('Turno ' + (i + 1)), ini: t.ini || '06:00', fin: t.fin || '14:00', ico: icono(t.ini) }));
      function guardarTurnos(subir) {
        try { localStorage.setItem(TURNOS_KEY, JSON.stringify(cfgTurnos)); } catch (e) { }
        if (subir) { try { pushCloudModuleState('turnos', cfgTurnos); } catch (e) { } }
      }
      window.inoferTurnosConfig = () => cfgTurnos;
      const hoy = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
      const turnoActual = () => {
        const n = new Date(); const m = n.getHours() * 60 + n.getMinutes();
        const t = turnos().find(x => { const a = aMin(x.ini), b = aMin(x.fin); return a <= b ? (m >= a && m < b) : (m >= a || m < b); });
        return (t || turnos()[0] || { id: 'T0' }).id;
      };
      let pref = {};
      try { pref = JSON.parse(localStorage.getItem(PREF_KEY) || '{}') || {}; } catch (e) { pref = {}; }
      const guardarPref = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(pref)); } catch (e) { } };
      const st = { paso: 'maquina', maq: pref.maq || '', ordId: '', turno: turnoActual(), parada: false, nueva: false };

      const maqDeOrden = o => { const f = norm(o.machine); const m = MAQ.find(x => norm(x.full) === f || norm(x.id) === f); return m ? m.id : ''; };
      const fullDe = id => (MAQ.find(m => m.id === id) || {}).full || id;
      const cat = () => (typeof partsCatalog !== 'undefined' ? partsCatalog : []);
      const puedeEditar = () => typeof inoferCan !== 'function' || inoferCan('ordenes', 'edit');
      const nombreOperario = () => pref.operario || (typeof inoferSession !== 'undefined' && inoferSession && inoferSession.nombre) || '';
      function avance(o) { try { const m = computeOrderMetrics(o); return { pct: Math.min(100, Math.round((m && m.progressPct) || 0)), ok: (m && m.totalOk) || 0 }; } catch (e) { return { pct: 0, ok: 0 }; } }
      const abierta = o => !(o.status === 'Completada' || avance(o).pct >= 100);
      function siguienteNumero() {
        const n = (typeof productionOrders !== 'undefined' ? productionOrders : []).map(o => parseInt(String(o.ordNumber).replace(/\D/g, ''), 10) || 0);
        return String((n.length ? Math.max(...n) : 405) + 1).padStart(8, '0');
      }
      // Piezas planificadas en el Gantt para esa máquina (semana activa)
      function piezasDelGantt(maq) {
        try {
          const out = [];
          Object.values(ganttWeeksData || {}).forEach(w => {
            const items = (((w.machines || {})[maq]) || {}).items || [];
            items.forEach(it => { if (it.isSharedCompanion) return; const tot = (it.dailyQty || []).reduce((a, b) => a + (Number(b) || 0), 0); if (tot > 0) out.push({ part: it.part, qty: tot, sem: w.code }); });
          });
          const act = typeof activeGanttWeekCode !== 'undefined' ? activeGanttWeekCode : '';
          const vistos = {};
          return out.sort((a, b) => (b.sem === act) - (a.sem === act)).filter(x => { if (vistos[norm(x.part)]) return false; vistos[norm(x.part)] = 1; return true; }).slice(0, 8);
        } catch (e) { return []; }
      }

      const BTN = 'rounded-2xl border-2 px-4 py-4 text-left font-bold transition active:scale-[0.98]';
      function render() {
        const box = $('inoferCR');
        if (!box) return;
        try {
          const tag = $('crEsquemaTag'); if (tag) tag.textContent = 'Turnos: ' + esquemaActivo().nombre;
          const cb = $('crTurnosCfgBtn'); if (cb) cb.classList.toggle('hidden', !(typeof inoferIsAdmin === 'function' && inoferIsAdmin()));
        } catch (e) { }
        if (!puedeEditar()) { box.innerHTML = '<div class="rounded-2xl border border-slate-700 p-6 text-center text-sm text-slate-300">Tu usuario solo puede ver las órdenes. Para cargar avances pedile permiso de edición al administrador.</div>'; return; }
        const pasos = ['maquina', 'orden', 'turno'];
        const idx = pasos.indexOf(st.paso);
        const migas = `<div class="mb-4 flex items-center gap-2 text-xs font-bold">
          ${['1 Máquina', '2 Orden', '3 Cargar turno'].map((t, i) => `<button type="button" class="cr-miga rounded-full px-3 py-1 ${i === idx ? 'bg-amber-500 text-slate-950' : (i < idx ? 'bg-slate-700 text-white' : 'bg-slate-800 text-slate-500')}" data-paso="${pasos[i]}" ${i > idx ? 'disabled' : ''}>${t}</button>`).join('<span class="text-slate-600">›</span>')}
        </div>`;
        let html = '';
        if (st.paso === 'maquina') {
          html = `<h3 class="mb-3 text-lg font-black text-white">¿En qué máquina estás?</h3>
            <div class="grid grid-cols-2 gap-3 sm:grid-cols-5">
              ${MAQ.map(m => `<button type="button" class="cr-maq ${BTN} ${st.maq === m.id ? 'border-amber-400 bg-amber-500/15' : 'border-slate-700 bg-slate-950 hover:border-amber-400'}" data-maq="${m.id}">
                <span class="block text-2xl text-amber-300">${m.id}</span><span class="block text-[11px] font-normal text-slate-400">${esc(m.full)}</span></button>`).join('')}
            </div>`;
        } else if (st.paso === 'orden') {
          const ords = productionOrders.filter(o => maqDeOrden(o) === st.maq && abierta(o));
          const puedeCrear = typeof inoferPuede !== 'function' || inoferPuede('ord_crear');
          if ((st.nueva || !ords.length) && !puedeCrear) {
            html = `<h3 class="mb-2 text-lg font-black text-white">No hay órdenes abiertas en la ${esc(st.maq)}</h3>
              <p class="text-sm text-slate-300">Tu usuario solo puede cargar producción en órdenes ya creadas. Pedile al supervisor que cree la orden, o elegí otra máquina.</p>`;
          } else if (st.nueva || !ords.length) {
            const plan = piezasDelGantt(st.maq);
            const piezasMaq = cat().filter(c => (c.machines || []).includes(st.maq) || norm(c.machine) === norm(fullDe(st.maq)));
            html = `<h3 class="mb-1 text-lg font-black text-white">Orden nueva en la ${esc(st.maq)}</h3>
              <p class="mb-3 text-xs text-slate-400">${ords.length ? '' : 'No hay órdenes abiertas en esta máquina. '}Elegí la pieza: el molde, las bocas, el material y los pesos se completan solos desde la base de datos.</p>
              ${plan.length ? `<div class="mb-3"><span class="mb-1.5 block text-[11px] font-bold uppercase text-emerald-300">Planificadas en el Gantt</span>
                <div class="flex flex-wrap gap-2">${plan.map(p => `<button type="button" class="cr-plan rounded-xl border-2 border-emerald-500/40 bg-emerald-500/10 px-3 py-2 text-sm font-bold text-emerald-200" data-part="${esc(p.part)}" data-qty="${p.qty}">${esc(p.part)} <span class="text-[11px] font-normal text-emerald-400">${p.qty.toLocaleString('es-AR')} u</span></button>`).join('')}</div></div>` : ''}
              <form id="crNuevaForm" class="space-y-3">
                <label class="block"><span class="mb-1 block text-xs font-bold text-slate-300">Pieza</span>
                  <input id="crPieza" list="crPiezasList" required autocomplete="off" placeholder="Escribí el código, ej: 26608" class="w-full rounded-xl border-2 border-slate-700 bg-slate-950 px-4 py-3 text-lg font-bold text-white focus:border-amber-400 focus:outline-none">
                  <datalist id="crPiezasList">${(piezasMaq.length ? piezasMaq : cat()).slice(0, 400).map(c => `<option value="${esc(c.part)}">${esc(c.desc || '')}</option>`).join('')}</datalist>
                </label>
                <div id="crPiezaInfo" class="hidden rounded-xl border border-slate-800 bg-slate-950/60 px-3 py-2 text-xs text-slate-300"></div>
                <div class="grid grid-cols-2 gap-3">
                  <label class="block"><span class="mb-1 block text-xs font-bold text-slate-300">Cantidad a inyectar</span>
                    <input id="crCantidad" type="number" inputmode="numeric" min="1" required class="w-full rounded-xl border-2 border-slate-700 bg-slate-950 px-4 py-3 text-lg font-bold text-emerald-300 focus:border-amber-400 focus:outline-none"></label>
                  <label class="block"><span class="mb-1 block text-xs font-bold text-slate-300">N° de orden</span>
                    <input id="crNumero" inputmode="numeric" value="${siguienteNumero()}" class="w-full rounded-xl border-2 border-slate-700 bg-slate-950 px-4 py-3 text-lg font-bold text-white focus:border-amber-400 focus:outline-none"></label>
                </div>
                <div class="flex gap-2">
                  ${ords.length ? '<button type="button" id="crCancelarNueva" class="rounded-xl border border-slate-700 px-4 py-3 text-sm font-bold text-slate-300">Volver</button>' : ''}
                  <button type="submit" class="flex-1 rounded-xl bg-amber-500 px-4 py-3 text-base font-black text-slate-950 hover:bg-amber-400">Crear orden y seguir →</button>
                </div>
              </form>`;
          } else {
            html = `<h3 class="mb-3 text-lg font-black text-white">¿Qué orden estás haciendo en la ${esc(st.maq)}?</h3>
              <div class="grid gap-3 sm:grid-cols-2">
                ${ords.map(o => { const a = avance(o); return `<button type="button" class="cr-ord ${BTN} border-slate-700 bg-slate-950 hover:border-amber-400" data-id="${esc(o.id)}">
                  <span class="flex items-center justify-between"><span class="text-xl text-amber-300">${esc(o.part || 'Sin pieza')}</span><span class="text-sm text-slate-300">${a.pct}%</span></span>
                  <span class="block text-[11px] font-normal text-slate-400">OP ${esc(o.ordNumber)} · ${a.ok.toLocaleString('es-AR')} de ${Number(o.qtyTarget || 0).toLocaleString('es-AR')} u</span>
                  <span class="mt-2 block h-2 overflow-hidden rounded-full bg-slate-800"><span class="block h-full bg-amber-400" style="width:${a.pct}%"></span></span></button>`; }).join('')}
                ${puedeCrear ? `<button type="button" id="crNuevaBtn" class="${BTN} border-dashed border-slate-600 bg-transparent text-center text-slate-300 hover:border-amber-400 hover:text-white"><span class="block text-2xl">+</span><span class="text-sm">Empezar una orden nueva</span></button>` : ''}
              </div>`;
          }
        } else {
          const o = productionOrders.find(x => x.id === st.ordId);
          if (!o) { st.paso = 'orden'; return render(); }
          const t = turnos().find(x => x.id === st.turno) || turnos()[0];
          const a = avance(o);
          const falta = Math.max(0, (Number(o.qtyTarget) || 0) - a.ok);
          html = `<div class="mb-3 flex flex-wrap items-center justify-between gap-2 rounded-xl border border-slate-800 bg-slate-950/60 px-3 py-2">
              <div><span class="text-base font-black text-amber-300">${esc(o.part)}</span> <span class="text-xs text-slate-400">· ${esc(st.maq)} · OP ${esc(o.ordNumber)}</span></div>
              <div class="text-xs text-slate-300">Van <b>${a.ok.toLocaleString('es-AR')}</b> · faltan <b>${falta.toLocaleString('es-AR')}</b></div>
            </div>
            <form id="crTurnoForm" class="space-y-4">
              <div><span class="mb-1.5 block text-xs font-bold text-slate-300">Turno</span>
                <div class="grid ${['grid-cols-1', 'grid-cols-1', 'grid-cols-2', 'grid-cols-3', 'grid-cols-2 sm:grid-cols-4'][Math.min(4, turnos().length)]} gap-2">${turnos().map(x => `<button type="button" class="cr-turno rounded-xl border-2 px-2 py-3 text-center font-bold ${x.id === st.turno ? 'border-amber-400 bg-amber-500/15 text-white' : 'border-slate-700 bg-slate-950 text-slate-300'}" data-t="${x.id}"><span class="block text-xl">${x.ico}</span><span class="block text-sm">${x.nombre}</span><span class="block text-[10px] font-normal text-slate-400">${x.ini} a ${x.fin}</span></button>`).join('')}</div>
                <details class="mt-1.5 text-xs text-slate-400"><summary class="cursor-pointer">Cambiar horario o fecha</summary>
                  <div class="mt-2 grid grid-cols-3 gap-2">
                    <input id="crFecha" type="date" value="${st.fecha || hoy()}" class="rounded-lg border border-slate-700 bg-slate-950 px-2 py-2 text-white">
                    <input id="crIni" type="time" value="${t.ini}" class="rounded-lg border border-slate-700 bg-slate-950 px-2 py-2 text-white">
                    <input id="crFin" type="time" value="${t.fin}" class="rounded-lg border border-slate-700 bg-slate-950 px-2 py-2 text-white">
                  </div></details>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <label class="col-span-2 block sm:col-span-1"><span class="mb-1 block text-sm font-black text-emerald-300">✅ Piezas buenas</span>
                  <input id="crOk" type="number" inputmode="numeric" min="0" required placeholder="0" class="w-full rounded-xl border-2 border-emerald-500/50 bg-slate-950 px-4 py-4 text-3xl font-black text-emerald-300 focus:border-emerald-400 focus:outline-none"></label>
                <label class="block"><span class="mb-1 block text-sm font-black text-rose-300">❌ Scrap</span>
                  <input id="crScrap" type="number" inputmode="numeric" min="0" placeholder="0" class="w-full rounded-xl border-2 border-rose-500/40 bg-slate-950 px-4 py-4 text-2xl font-black text-rose-300 focus:border-rose-400 focus:outline-none"></label>
                <label class="block"><span class="mb-1 block text-sm font-bold text-amber-300">Arranque en baja</span>
                  <input id="crBaja" type="number" inputmode="numeric" min="0" placeholder="0" class="w-full rounded-xl border-2 border-slate-700 bg-slate-950 px-4 py-4 text-2xl font-black text-amber-300 focus:border-amber-400 focus:outline-none"></label>
              </div>
              <div><span class="mb-1.5 block text-xs font-bold text-slate-300">¿Hubo paradas?</span>
                <div class="grid grid-cols-2 gap-2">
                  <button type="button" class="cr-parada rounded-xl border-2 py-3 text-sm font-bold ${!st.parada ? 'border-emerald-400 bg-emerald-500/15 text-white' : 'border-slate-700 bg-slate-950 text-slate-300'}" data-p="0">No</button>
                  <button type="button" class="cr-parada rounded-xl border-2 py-3 text-sm font-bold ${st.parada ? 'border-rose-400 bg-rose-500/15 text-white' : 'border-slate-700 bg-slate-950 text-slate-300'}" data-p="1">Sí</button>
                </div>
                <div id="crParadaBox" class="${st.parada ? '' : 'hidden'} mt-2 space-y-2">
                  <div id="crParadasList" class="space-y-2">${st.parada ? filaParada() : ''}</div>
                  <div class="flex items-center justify-between gap-2">
                    <button type="button" id="crAddParada" class="rounded-xl border-2 border-dashed border-rose-500/40 px-3 py-2 text-xs font-bold text-rose-200">+ Agregar otra parada</button>
                    <span id="crParadasTotal" class="text-xs text-slate-400"></span>
                  </div>
                </div>
              </div>
              <label class="block"><span class="mb-1 block text-xs font-bold text-slate-300">Operario</span>
                <input id="crOperario" value="${esc(nombreOperario())}" required class="w-full rounded-xl border-2 border-slate-700 bg-slate-950 px-4 py-3 text-base font-bold text-white focus:border-amber-400 focus:outline-none"></label>
              <details class="text-xs text-slate-400"><summary class="cursor-pointer">Agregar una observación (opcional)</summary>
                <input id="crObs" placeholder="Ej: cambié noyo" class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white"></details>
              <button type="submit" class="w-full rounded-2xl bg-emerald-500 px-4 py-4 text-lg font-black text-slate-950 hover:bg-emerald-400">${st.editLogId ? '💾 Guardar cambios' : '💾 Guardar turno'}</button>
              ${st.editLogId ? '<button type="button" id="crCancelEdit" class="w-full rounded-2xl border border-slate-700 px-4 py-3 text-sm font-bold text-slate-300">Cancelar edición</button>' : ''}
            </form>`;
          if (st.editLogId) {
            const lg = (o.logs || []).find(x => x.id === st.editLogId);
            if (lg) html = `<div class="mb-3 rounded-xl border border-amber-400/60 bg-amber-500/10 px-3 py-2 text-sm font-bold text-amber-200">✏️ Editando el turno del ${esc(lg.date)} (${esc(lg.turno || (lg.startTime + ' a ' + lg.endTime))} · ${esc(lg.operator)})</div>` + html;
          }
          const logs = (o.logs || []).slice().sort((a, b) => String(b.date + b.startTime).localeCompare(String(a.date + a.startTime))).slice(0, 12);
          const puedeEditarTurnos = typeof inoferPuede !== 'function' || inoferPuede('ord_editar_turnos');
          if (logs.length) html += `<div class="mt-5 space-y-2"><div class="text-xs font-bold uppercase tracking-wider text-slate-400">Turnos cargados en esta orden</div>
            ${logs.map(l => `<div class="flex items-center justify-between gap-2 rounded-xl border ${l.id === st.editLogId ? 'border-amber-400' : 'border-slate-800'} bg-slate-950/60 px-3 py-2">
              <div class="min-w-0 text-xs"><div class="font-bold text-white">${esc(l.date)} · ${esc(l.turno || (l.startTime + '–' + l.endTime))} · <span class="text-emerald-300">${Number(l.okPcs || 0).toLocaleString('es-AR')} buenas</span>${Number(l.scrapPcs) ? ` · <span class="text-rose-300">${l.scrapPcs} scrap</span>` : ''}</div>
                <div class="truncate text-[11px] text-slate-400">${esc(l.operator)}${l.obs ? ' · ' + esc(l.obs) : ''}${l.modificadoPor ? ` · editado por ${esc(l.modificadoPor)}` : ''}</div></div>
              ${puedeEditarTurnos ? `<div class="flex shrink-0 gap-1"><button type="button" class="cr-log-edit rounded-lg border border-slate-700 px-2.5 py-1.5 text-xs font-bold text-cyan-300" data-id="${esc(l.id)}">✏️ Editar</button>
                <button type="button" class="cr-log-del rounded-lg border border-rose-500/40 px-2.5 py-1.5 text-xs font-bold text-rose-300" data-id="${esc(l.id)}">🗑️</button></div>` : ''}
            </div>`).join('')}</div>`;
        }
        box.innerHTML = migas + html;
        if (st.paso === 'turno' && st.editLogId) { try { precargarTurno(); } catch (e) { console.error(e); } }
      }
      function precargarTurno() {
        const o = productionOrders.find(x => x.id === st.ordId);
        const l = o && (o.logs || []).find(x => x.id === st.editLogId);
        if (!l) return;
        $('crFecha').value = l.date || hoy();
        $('crIni').value = l.startTime || ''; $('crFin').value = l.endTime || '';
        $('crOk').value = Number(l.okPcs) || 0; $('crScrap').value = Number(l.scrapPcs) || ''; $('crBaja').value = Number(l.lowStartPcs) || '';
        $('crOperario').value = l.operator || '';
        if ($('crObs')) $('crObs').value = l.obsUsuario != null ? l.obsUsuario : '';
        const ps = Array.isArray(l.paradas) && l.paradas.length ? l.paradas : (l.stopCode ? [{ codigo: l.stopCode, min: Number(l.stopMinutes) || 0 }] : []);
        if (ps.length) {
          st.parada = true;
          $('crParadaBox').classList.remove('hidden');
          $('crParadasList').innerHTML = ps.map(p => filaParada(p)).join('');
          const v = $('orderSubViewRapida');
          v.querySelectorAll('.cr-parada').forEach(b => { const on = b.dataset.p === '1'; const c = on ? 'rose' : 'emerald'; b.className = `cr-parada rounded-xl border-2 py-3 text-sm font-bold ${on ? `border-${c}-400 bg-${c}-500/15 text-white` : 'border-slate-700 bg-slate-950 text-slate-300'}`; });
          totalParadas();
        }
      }
      window.inoferEditarTurno = function (ordId, logId) {
        const o = productionOrders.find(x => x.id === ordId);
        if (!o) return;
        if (typeof inoferPuede === 'function' && !inoferPuede('ord_editar_turnos')) { showToast('Tu usuario no puede editar turnos cargados'); return; }
        const l = (o.logs || []).find(x => x.id === logId);
        st.maq = maqDeOrden(o) || st.maq; st.ordId = ordId; st.paso = 'turno'; st.editLogId = logId; st.parada = false;

      }

      function guardarTurno() {

          else if (g('#crOtraOrden')) { st.paso = 'orden'; render(); }
        });
        v.addEventListener('input', e => { if (e.target.id === 'crPieza') infoPieza(); if (e.target.closest && e.target.closest('#crParadasList, #crIni, #crFin')) totalParadas(); });
        v.addEventListener('change', e => { if (e.target.closest && e.target.closest('#crParadasList') || e.target.id === 'crIni' || e.target.id === 'crFin') totalParadas(); });
        v.addEventListener('submit', e => {
          e.preventDefault();
          if (!puedeEditar()) { showToast('Tu usuario no puede cargar órdenes'); return; }
          if (e.target.id === 'crNuevaForm') {
            const part = $('crPieza').value.trim(), qty = Number($('crCantidad').value) || 0;
            if (!part || qty <= 0) { showToast('Completá la pieza y la cantidad'); return; }
            if (typeof inoferEsPiezaR === 'function' && inoferEsPiezaR(part)) { showToast('Las piezas -R no se inyectan'); return; }
            const o = crearOrden(part, qty, $('crNumero').value.trim());
            showToast(`Orden ${o.ordNumber} creada para la ${o.part}`);
            st.ordId = o.id; st.nueva = false; st.paso = 'turno'; st.turno = turnoActual(); render();
          } else if (e.target.id === 'crTurnoForm') guardarTurno();
        });

        const prev = switchOrderSubTab;
        switchOrderSubTab = function (sub) {
          const rv = $('orderSubViewRapida');
          if (sub === 'rapida') {
            prev('list');
            currentOrderSubTab = 'rapida';
            const lv = $('orderSubViewList'); if (lv) lv.classList.add('hidden');
            ['orderSubViewEfficiency', 'orderSubViewFront', 'orderSubViewBack', 'orderSubViewSheet', 'orderSubViewCatalog', 'orderSubViewGlobalReport'].forEach(i => $(i) && $(i).classList.add('hidden'));
            rv.classList.remove('hidden');
            document.querySelectorAll('.order-subtab-btn').forEach(btn => {
              const hid = btn.classList.contains('hidden');
              btn.className = btn.dataset.orderSubtab === 'rapida' ? 'order-subtab-btn rounded-lg px-3 py-1.5 text-xs font-bold bg-amber-500 text-slate-950 shadow' : 'order-subtab-btn rounded-lg px-3 py-1.5 text-xs font-semibold text-slate-300 hover:text-white';
              if (hid) btn.classList.add('hidden');
            });
            if (st.paso === 'turno' && !productionOrders.some(o => o.id === st.ordId)) st.paso = 'orden';
            if (st.paso === 'maquina' && st.maq) st.paso = 'orden';
            render();
          } else { rv.classList.add('hidden'); prev(sub); }
        };
        if (typeof INOFER_EDIT_CONTROLS !== 'undefined') INOFER_EDIT_CONTROLS.ordenes.push('#crNuevaForm input', '#crNuevaForm button', '#crTurnoForm input', '#crTurnoForm select', '#crTurnoForm button');
        // Los que no son administradores entran directo a la carga rápida
        const esAdmin = typeof inoferIsAdmin === 'function' && inoferIsAdmin();
        if (!esAdmin && puedeEditar()) switchOrderSubTab('rapida');
      }
      // abrir la carga rápida ya posicionada (QR de máquina/orden, avisos de turnos sin cargar)
      function abrir(o) {
        o = o || {};
        if (o.maq) { st.maq = o.maq; pref.maq = o.maq; guardarPref(); }
        st.editLogId = ''; st.nueva = false; st.parada = false; st.fecha = o.fecha || '';
        if (o.turnoNombre) { const t = turnos().find(x => norm(x.nombre) === norm(o.turnoNombre)); if (t) st.turno = t.id; } else st.turno = turnoActual();
        if (o.ordId && productionOrders.some(x => x.id === o.ordId)) { st.ordId = o.ordId; selectedOrderId = o.ordId; st.paso = 'turno'; }
        else st.paso = st.maq ? 'orden' : 'maquina';
        try { switchTab('orders'); } catch (e) { }
        switchOrderSubTab('rapida');
        try { $('orderSubViewRapida').scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { }
      }
      window.inoferCargaRapida = { estado: st, render, abrir, maqDeOrden, turnos, abierta };

      // Limpiar los valores de ejemplo del formulario viejo (350 / 10 / 8) para que no se carguen datos falsos
      function limpiarFormViejo() {
        [['logOkPcs', ''], ['logLowStart', '0'], ['logScrap', '0']].forEach(([id, v]) => { const el = $(id); if (el) el.value = v; });
        const op = $('logOperator'); if (op && !op.value) op.value = nombreOperario();
      }
      function iniciar() { try { montar(); } catch (e) { console.error(e); } try { limpiarFormViejo(); } catch (e) { } }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();
      // Al iniciar sesión, decidir la pestaña por defecto según el rol
      if (typeof inoferApplyPermissions === 'function') {
        const ap = inoferApplyPermissions;
        inoferApplyPermissions = function () {
          const r = ap.apply(this, arguments);
          try {
            if (inoferSession && !inoferIsAdmin() && puedeEditar() && currentOrderSubTab === 'list') switchOrderSubTab('rapida');
            const op = $('logOperator'); if (op && !op.value) op.value = nombreOperario();
          } catch (e) { }
          return r;
        };
      }
    })();
  </script>
