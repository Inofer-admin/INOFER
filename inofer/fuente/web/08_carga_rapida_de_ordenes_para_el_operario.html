  <script>
    // ===== Carga rápida de órdenes para el operario en máquina =====
    (function () {
      // En celular el encabezado fijo tapa un tercio de la pantalla: que se desplace con la página
      try { const stl = document.createElement('style'); stl.textContent = '@media (max-width: 640px){ body > header.sticky{ position: static; } }'; document.head.appendChild(stl); } catch (e) { }
      const $ = id => document.getElementById(id);
      const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const norm = window.inoferNormTxt || (s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim());
      const PREF_KEY = 'tablero_inyectoras_operario_v1';
      const MAQ = [
        { id: '200V', full: 'Italpresse 200 Tn (V)' }, { id: '200N', full: 'Italpresse 200 Tn (N)' }, { id: '180', full: 'Italpresse 180 Tn' },
        { id: 'H50', full: 'H-50' }, { id: 'Z30', full: 'Italpresse 30 Tn (Z-30)' }
      ];
      // Turnos configurables por el administrador (módulo de nube "turnos", se ve en todos los equipos)
      const TURNOS_KEY = 'tablero_inyectoras_turnos_v1';
      const TURNOS_DEF = { activo: 'e3', esquemas: [
        { id: 'e3', nombre: '3 turnos de 8 h', turnos: [{ nombre: 'Mañana', ini: '06:00', fin: '14:00' }, { nombre: 'Tarde', ini: '14:00', fin: '22:00' }, { nombre: 'Noche', ini: '22:00', fin: '06:00' }] },
        { id: 'e2', nombre: '2 turnos de 12 h', turnos: [{ nombre: 'Día', ini: '06:00', fin: '18:00' }, { nombre: 'Noche', ini: '18:00', fin: '06:00' }] }
      ] };
      let cfgTurnos = null;
      try { cfgTurnos = JSON.parse(localStorage.getItem(TURNOS_KEY) || 'null'); } catch (e) { }
      if (!cfgTurnos || !Array.isArray(cfgTurnos.esquemas) || !cfgTurnos.esquemas.length) cfgTurnos = JSON.parse(JSON.stringify(TURNOS_DEF));
      const aMin = h => { const [a, b] = String(h || '0:0').split(':').map(Number); return (a || 0) * 60 + (b || 0); };
      const icono = ini => { const h = aMin(ini) / 60; return h >= 4 && h < 11 ? '🌅' : (h >= 11 && h < 17 ? '☀️' : (h >= 17 && h < 21 ? '🌇' : '🌙')); };
      const esquemaActivo = () => cfgTurnos.esquemas.find(e => e.id === cfgTurnos.activo) || cfgTurnos.esquemas[0];
      const turnos = () => (esquemaActivo().turnos || []).map((t, i) => ({ id: 'T' + i, nombre: t.nombre || ('Turno ' + (i + 1)), ini: t.ini || '06:00', fin: t.fin || '14:00', ico: icono(t.ini) }));
      // Operarios por máquina (módulo de nube "operarios", lo carga el administrador)
      const OPER_KEY = 'tablero_inyectoras_operarios_v1';
      let cfgOper = null;
      try { cfgOper = JSON.parse(localStorage.getItem(OPER_KEY) || 'null'); } catch (e) { }
      if (!cfgOper || typeof cfgOper.maquinas !== 'object') cfgOper = { maquinas: {} };
      function guardarOper(subir) { try { localStorage.setItem(OPER_KEY, JSON.stringify(cfgOper)); } catch (e) { } if (subir) { try { pushCloudModuleState('operarios', cfgOper); } catch (e) { } } }
      const operariosDe = m => (cfgOper.maquinas[m] || []).filter(Boolean);
      function guardarTurnos(subir) {
        try { localStorage.setItem(TURNOS_KEY, JSON.stringify(cfgTurnos)); } catch (e) { }
        if (subir) { try { pushCloudModuleState('turnos', cfgTurnos); } catch (e) { } }
      }
      window.inoferTurnosConfig = () => cfgTurnos;
      const hoy = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
      const turnoActual = () => {
        const n = new Date(); const m = n.getHours() * 60 + n.getMinutes();
        const t = turnos().find(x => { const a = aMin(x.ini), b = aMin(x.fin); return a <= b ? (m >= a && m < b) : (m >= a || m < b); });
        return (t || turnos()[0] || { id: 'T0' }).id;
      };
      let pref = {};
      try { pref = JSON.parse(localStorage.getItem(PREF_KEY) || '{}') || {}; } catch (e) { pref = {}; }
      const guardarPref = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(pref)); } catch (e) { } };
      const st = { paso: 'maquina', maq: pref.maq || '', ordId: '', turno: turnoActual(), parada: false, nueva: false };

      const maqDeOrden = o => { const f = norm(o.machine); const m = MAQ.find(x => norm(x.full) === f || norm(x.id) === f); return m ? m.id : ''; };
      const fullDe = id => (MAQ.find(m => m.id === id) || {}).full || id;
      const cat = () => (typeof partsCatalog !== 'undefined' ? partsCatalog : []);
      const puedeEditar = () => typeof inoferCan !== 'function' || inoferCan('ordenes', 'edit');
      const nombreOperario = () => pref.operario || (typeof inoferSession !== 'undefined' && inoferSession && inoferSession.nombre) || '';
      function avance(o) { try { const m = computeOrderMetrics(o); return { pct: Math.min(100, Math.round((m && m.progressPct) || 0)), ok: (m && m.totalOk) || 0 }; } catch (e) { return { pct: 0, ok: 0 }; } }
      const abierta = o => !(o.status === 'Completada' || o.status === 'Detenida por rotura' || avance(o).pct >= 100);
      function siguienteNumero() {
        const n = (typeof productionOrders !== 'undefined' ? productionOrders : []).map(o => parseInt(String(o.ordNumber).replace(/\D/g, ''), 10) || 0);
        return String((n.length ? Math.max(...n) : 405) + 1).padStart(8, '0');
      }
      // Piezas planificadas en el Gantt para esa máquina (semana activa)
      function piezasDelGantt(maq) {
        try {
          const out = [];
          Object.values(ganttWeeksData || {}).forEach(w => {
            const items = (((w.machines || {})[maq]) || {}).items || [];
            items.forEach(it => { if (it.isSharedCompanion) return; const tot = (it.dailyQty || []).reduce((a, b) => a + (Number(b) || 0), 0); if (tot > 0) out.push({ part: it.part, qty: tot, sem: w.code }); });
          });
          const act = typeof activeGanttWeekCode !== 'undefined' ? activeGanttWeekCode : '';
          const vistos = {};
          return out.sort((a, b) => (b.sem === act) - (a.sem === act)).filter(x => { if (vistos[norm(x.part)]) return false; vistos[norm(x.part)] = 1; return true; }).slice(0, 8);
        } catch (e) { return []; }
      }

      const BTN = 'rounded-2xl border-2 px-4 py-4 text-left font-bold transition active:scale-[0.98]';
      function estiloParadas() {
        document.querySelectorAll('#orderSubViewRapida .cr-parada').forEach(b => {
          const p1 = b.dataset.p === '1', on = p1 === !!st.parada;
          b.className = `cr-parada rounded-xl border-2 ${p1 ? 'px-3 py-3 text-xs' : 'px-4 py-3 text-sm'} font-bold ${on ? (p1 ? 'border-rose-400 bg-rose-500/15 text-white' : 'border-emerald-400 bg-emerald-500/15 text-white') : 'border-slate-700 bg-slate-950 text-slate-300'}`;
        });
      }
      const durH = t => ((((aMin(t.fin) - aMin(t.ini)) + 1440) % 1440) || 1440) / 60;
      // ---- varias piezas en un turno: lo ya cargado en la máquina ese día, por horario ----
      const hhmm = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
      const tramo = (i, f) => { const a = aMin(i); let b = aMin(f); if (b <= a) b += 1440; return [a, b]; };
      function cargasMaq(maq, fecha, sinLog) {
        const out = [];
        productionOrders.forEach(o => { if (maqDeOrden(o) !== maq) return; (o.logs || []).forEach(l => { if (l.id === sinLog || l.date !== fecha || !l.startTime) return; const [a, b] = tramo(l.startTime, l.endTime); out.push({ o, l, a, b }); }); });
        return out.sort((x, y) => x.a - y.a);
      }
      // lo cargado dentro del horario de un turno (para la barra y para saber desde qué hora sigue la próxima pieza)
      function delTurno(maq, fecha, t) {
        const [ta, tb] = tramo(t.ini, t.fin);
        const L = cargasMaq(maq, fecha).filter(c => Math.min(c.b, tb) - Math.max(c.a, ta) > 0);
        const fin = L.reduce((m, c) => Math.max(m, Math.min(c.b, tb)), ta);
        return { L, ta, tb, fin, libre: tb - fin };
      }
      function barraTurno(D) {
        const tot = D.tb - D.ta || 1, cols = ['#10b981', '#f59e0b', '#22d3ee', '#a78bfa'];
        return `<div class="relative h-4 overflow-hidden rounded-full bg-slate-800">${D.L.map((c, i) => `<span class="absolute top-0 h-full" style="left:${Math.max(0, (c.a - D.ta) / tot * 100)}%;width:${Math.max(1, (Math.min(c.b, D.tb) - Math.max(c.a, D.ta)) / tot * 100)}%;background:${cols[i % 4]}" title="${esc(c.o.part)}"></span>`).join('')}</div>
          <div class="mt-1 flex justify-between text-[11px] text-slate-400"><span>${hhmm(D.ta)}</span><span>${D.L.map((c, i) => `<b style="color:${cols[i % 4]}">${esc(c.o.part)}</b> ${hhmm(c.a)}–${hhmm(c.b)}`).join(' · ')}</span><span>${hhmm(D.tb)}</span></div>`;
      }
      // ---- cambio de molde dentro del turno: los horarios se calculan solos ----
      const CODIGO_CMO = () => ((typeof INOFER_28_CODES !== 'undefined' ? INOFER_28_CODES : []).find(c => /^1\s*-/.test(c))) || '1-Cambio de molde y P.Punto';
      function setupMin(maq) {
        const su = window.inoferSetupDe ? inoferSetupDe(maq) : { cmo: 1, alis: 0.5 };
        const cmo = Math.round((Number(su.cmo) || 0) * 60), alis = Math.round((Number(su.alis) || 0) * 60);
        const baj = Math.round(cmo / 2 / 15) * 15 || 15;
        return { bajada: baj, subida: Math.max(15, Math.round((cmo - baj + alis) / 15) * 15) };
      }
      function opsParaCambio(o) {
        const plan = piezasDelGantt(st.maq).map(p => norm(p.part));
        return productionOrders.filter(x => x.id !== (o && o.id) && maqDeOrden(x) === st.maq && abierta(x))
          .sort((a, b) => (plan.includes(norm(b.part)) - plan.includes(norm(a.part))));
      }
      function nuevoCambio(o) { const sm = setupMin(st.maq); const L = opsParaCambio(o); const usadas = (st.cambios || []).map(c => c.ordId); const sig = L.find(x => !usadas.includes(x.id)) || L[0]; return { bajada: sm.bajada, subida: sm.subida, ordId: sig ? sig.id : '', ok: '', scrap: '' }; }
      function htmlCambio(c, i, o) {
        const L = opsParaCambio(o), plan = piezasDelGantt(st.maq).map(p => norm(p.part));
        const ctr = (k, v) => `<div class="flex items-center gap-1.5"><button type="button" class="cr-cm h-11 w-11 rounded-lg border border-slate-600 bg-slate-950 text-xl font-black text-white" data-i="${i}" data-k="${k}" data-d="-15" aria-label="Menos 15 minutos">−</button><span class="min-w-[64px] text-center text-base font-black text-amber-300">${fmtMin(v)}</span><button type="button" class="cr-cm h-11 w-11 rounded-lg border border-slate-600 bg-slate-950 text-xl font-black text-white" data-i="${i}" data-k="${k}" data-d="15" aria-label="Más 15 minutos">+</button></div>`;
        return `<div class="space-y-3">
          <div class="rounded-2xl border-2 border-dashed border-amber-500 bg-amber-500/10 p-3 space-y-2">
            <div class="flex items-baseline justify-between"><span class="text-sm font-black text-amber-300">🔧 Cambio de molde</span><button type="button" class="cr-cdel text-[11px] text-slate-400 underline" data-i="${i}">quitar</button></div>
            <div class="flex items-center justify-between gap-2"><span class="text-sm font-bold text-white">Bajada del molde</span>${ctr('bajada', c.bajada)}</div>
            <div class="flex items-center justify-between gap-2"><span class="text-sm font-bold text-white">Subida y puesta a punto</span>${ctr('subida', c.subida)}</div>
            <div class="text-[11px] text-amber-200/80">Sugerido del Set-up de la ${esc(st.maq)} · se carga como parada "${esc(corto(CODIGO_CMO()))}"</div>
          </div>
          <div class="rounded-2xl border border-sky-700 bg-slate-950/60 p-3 space-y-2">
            <span class="text-xs font-black text-sky-300">PIEZA ${i + 2}</span>
            ${L.length ? `<select class="cr-cop w-full rounded-xl border-2 border-slate-700 bg-slate-950 px-3 py-3 text-base font-bold text-white" data-i="${i}">${L.map(x => `<option value="${esc(x.id)}" ${x.id === c.ordId ? 'selected' : ''}>${esc(x.part)} · OP ${esc(x.ordNumber)}${plan.includes(norm(x.part)) ? ' · programada' : ''}</option>`).join('')}</select>` : `<div class="rounded-xl border border-rose-500/40 bg-rose-500/10 px-3 py-2 text-xs text-rose-200">No hay otra OP abierta en la ${esc(st.maq)}. Creala primero desde "Otra orden".</div>`}
            <div class="grid grid-cols-3 gap-2">
              <label class="col-span-2 block"><span class="mb-1 block text-xs font-black text-emerald-300">Buenas</span><input type="number" inputmode="numeric" min="0" class="cr-cok w-full rounded-xl border-2 border-sky-500/50 bg-slate-950 px-3 py-3 text-center text-2xl font-black text-sky-200" data-i="${i}" value="${esc(c.ok)}" placeholder="0"></label>
              <label class="block"><span class="mb-1 block text-xs font-black text-rose-300">Scrap</span><input type="number" inputmode="numeric" min="0" class="cr-csc w-full rounded-xl border-2 border-rose-500/40 bg-slate-950 px-2 py-3 text-center text-xl font-black text-rose-300" data-i="${i}" value="${esc(c.scrap)}" placeholder="0"></label>
            </div>
          </div></div>`;
      }
      const uhDe = o => { const c = cat().find(x => norm(x.part) === norm(o && o.part)); return Number(o && o.unitsPerHour) || Number(c && c.unitsPerHour) || 0; };
      // segmentos del turno: pieza 1, (cambio, pieza)… — el tiempo de cada pieza sale de lo que produjo y se ajusta al turno
      function repartoTurno(o) {
        const ini = $('crIni') ? $('crIni').value : '', fin = $('crFin') ? $('crFin').value : '';
        const [a0, b0] = tramo(ini, fin), T = b0 - a0;
        const par = st.parada ? leerParadas().reduce((s2, p) => s2 + p.min, 0) : 0;
        const piezas = [{ o, ok: Number(($('crOk') || {}).value) || 0, scrap: Number(($('crScrap') || {}).value) || 0, extra: par }];
        (st.cambios || []).forEach(c => piezas.push({ o: productionOrders.find(x => x.id === c.ordId), ok: Number(c.ok) || 0, scrap: Number(c.scrap) || 0, extra: (Number(c.bajada) || 0) + (Number(c.subida) || 0), cambio: c }));
        const fijo = piezas.reduce((s2, p) => s2 + p.extra, 0), libre = Math.max(0, T - fijo);
        const nec = piezas.map(p => { const u = uhDe(p.o); return u ? (p.ok + p.scrap) / u * 60 : 0; });
        const sum = nec.reduce((x, y) => x + y, 0);
        const run = nec.map(n => sum > 0 ? n / sum * libre : libre / piezas.length);
        let t0 = a0; const segs = [];
        piezas.forEach((p, i) => {
          if (p.cambio) { segs.push({ tipo: 'cambio', a: t0, b: t0 + p.extra, min: p.extra, c: p.cambio }); }
          let b = i === piezas.length - 1 ? b0 : Math.round((t0 + p.extra + run[i]) / 5) * 5;
          b = Math.min(b0, Math.max(t0 + p.extra, b));
          segs.push({ tipo: 'pieza', a: p.cambio ? t0 + p.extra : t0, b, desde: t0, o: p.o, ok: p.ok, scrap: p.scrap, cambio: p.cambio, paradasMin: p.cambio ? p.extra : par });
          t0 = b;
        });
        return { segs, a0, b0, T, fijo, excedido: fijo > T };
      }
      function pintarReparto() {
        const box = $('crReparto'); if (!box) return;
        if (!(st.cambios && st.cambios.length)) { box.innerHTML = ''; return; }
        const o = productionOrders.find(x => x.id === st.ordId); const R = repartoTurno(o);
        const cols = ['#10b981', '#3b82f6', '#a78bfa', '#22d3ee']; let k = 0;
        const segs = R.segs.map(sg => sg.tipo === 'cambio' ? Object.assign({ col: 'repeating-linear-gradient(45deg,#f59e0b 0 6px,#b45309 6px 12px)', txt: '🔧 Cambio de molde' }, sg) : Object.assign({ col: cols[(k++) % 4], txt: sg.o ? sg.o.part : '—' }, sg));
        box.innerHTML = `<div class="rounded-2xl border border-slate-800 bg-slate-950/60 p-3 space-y-2"><div class="text-xs font-black text-slate-200">Así queda el turno (se calcula solo)</div>
          <div class="flex h-5 overflow-hidden rounded-lg bg-slate-800">${segs.map(sg => `<span class="block h-full" style="width:${Math.max(0, (sg.b - sg.a) / (R.T || 1) * 100)}%;background:${sg.col}"></span>`).join('')}</div>
          <div class="grid gap-1 text-[11px] sm:grid-cols-${Math.min(4, segs.length)}">${segs.map(sg => `<div><b class="text-white">${esc(sg.txt)}</b> <span class="text-slate-300">${hhmm(sg.a)} – ${hhmm(sg.b)}</span></div>`).join('')}</div>
          ${R.excedido ? '<div class="text-xs font-bold text-rose-300">⚠ Los cambios de molde y paradas suman más que el turno.</div>' : '<div class="text-[11px] text-slate-400">El tiempo de cada pieza sale de las buenas + scrap ÷ piezas por hora, ajustado para completar el turno.</div>'}</div>`;
      }
      function sugerido(o, t) {
        const c = cat().find(x => norm(x.part) === norm(o.part));
        const uh = Number(o.unitsPerHour) || Number(c && c.unitsPerHour) || 0;
        return uh ? Math.round(uh * durH(t) / 10) * 10 : 0;
      }
      function ultimoTurnoMaq(maq) {
        let best = null;
        productionOrders.forEach(o => { if (maqDeOrden(o) !== maq) return; (o.logs || []).forEach(l => { const k = String(l.date || '') + ' ' + String(l.startTime || ''); if (!best || k > best.k) best = { k, l }; }); });
        return best ? best.l : null;
      }
      function paradasFrecuentes(maq) {
        const cnt = {};
        productionOrders.forEach(o => { if (maqDeOrden(o) !== maq) return; (o.logs || []).forEach(l => (Array.isArray(l.paradas) ? l.paradas : []).forEach(p => { if (p.codigo) cnt[p.codigo] = (cnt[p.codigo] || 0) + 1; })); });
        const L = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]);
        const todos = typeof INOFER_28_CODES !== 'undefined' ? INOFER_28_CODES : [];
        ['1-', '31-', '30-', '4-'].forEach(pre => { const c = todos.find(x => String(x).startsWith(pre)); if (c && !L.includes(c)) L.push(c); });
        return L.slice(0, 4);
      }
      const corto = c => String(c || '').replace(/^\d+\s*-\s*/, '').slice(0, 22);
      function render() {
        const box = $('inoferCR');
        if (!box) return;
        try {
          const tag = $('crEsquemaTag'); if (tag) tag.textContent = 'Turnos: ' + esquemaActivo().nombre;
          const cb = $('crTurnosCfgBtn'); if (cb) cb.classList.toggle('hidden', !(typeof inoferIsAdmin === 'function' && inoferIsAdmin()));
          const ob = $('crOperCfgBtn'); if (ob) ob.classList.toggle('hidden', !(typeof inoferIsAdmin === 'function' && inoferIsAdmin()));
        } catch (e) { }
        if (!puedeEditar()) { box.innerHTML = '<div class="rounded-2xl border border-slate-700 p-6 text-center text-sm text-slate-300">Tu usuario solo puede ver las órdenes. Para cargar avances pedile permiso de edición al administrador.</div>'; return; }
        const pasos = ['maquina', 'orden', 'turno'];
        const idx = pasos.indexOf(st.paso);
        const migas = `<div class="mb-4 flex items-center gap-2 text-xs font-bold">
          ${['1 Máquina', '2 Orden', '3 Cargar turno'].map((t, i) => `<button type="button" class="cr-miga rounded-full px-3 py-1 ${i === idx ? 'bg-amber-500 text-slate-950' : (i < idx ? 'bg-slate-700 text-white' : 'bg-slate-800 text-slate-500')}" data-paso="${pasos[i]}" ${i > idx ? 'disabled' : ''}>${t}</button>`).join('<span class="text-slate-600">›</span>')}
        </div>`;
        let html = '';
        if (st.paso === 'maquina') {
          html = `<h3 class="mb-3 text-lg font-black text-white">¿En qué máquina estás?</h3>
            <div class="grid grid-cols-2 gap-3 sm:grid-cols-5">
              ${MAQ.map(m => `<button type="button" class="cr-maq ${BTN} ${st.maq === m.id ? 'border-amber-400 bg-amber-500/15' : 'border-slate-700 bg-slate-950 hover:border-amber-400'}" data-maq="${m.id}">
                <span class="block text-2xl text-amber-300">${m.id}</span><span class="block text-[11px] font-normal text-slate-400">${esc(m.full)}</span></button>`).join('')}
            </div>`;
        } else if (st.paso === 'orden') {
          const ords = productionOrders.filter(o => maqDeOrden(o) === st.maq && abierta(o));
          const puedeCrear = typeof inoferPuede !== 'function' || inoferPuede('ord_crear');
          if ((st.nueva || !ords.length) && !puedeCrear) {
            html = `<h3 class="mb-2 text-lg font-black text-white">No hay órdenes abiertas en la ${esc(st.maq)}</h3>
              <p class="text-sm text-slate-300">Tu usuario solo puede cargar producción en órdenes ya creadas. Pedile al supervisor que cree la orden, o elegí otra máquina.</p>`;
          } else if (st.nueva || !ords.length) {
            const plan = piezasDelGantt(st.maq);
            const piezasMaq = cat().filter(c => (c.machines || []).includes(st.maq) || norm(c.machine) === norm(fullDe(st.maq)));
            html = `<h3 class="mb-1 text-lg font-black text-white">Orden nueva en la ${esc(st.maq)}</h3>
              <p class="mb-3 text-xs text-slate-400">${ords.length ? '' : 'No hay órdenes abiertas en esta máquina. '}Elegí la pieza: el molde, las bocas, el material y los pesos se completan solos desde la base de datos.</p>
              ${plan.length ? `<div class="mb-3"><span class="mb-1.5 block text-[11px] font-bold uppercase text-emerald-300">Planificadas en el Gantt</span>
