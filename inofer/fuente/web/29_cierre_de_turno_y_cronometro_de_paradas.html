  <style>

    .ct-head { display: grid; grid-template-columns: 88px minmax(170px, 1.4fr) 92px minmax(230px, 1.6fr) minmax(170px, 1.4fr) 130px 64px; gap: 8px; padding: 0 10px; font-size: .62rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: #64748b; margin-top: 10px; }

    .ct-in.auto { color: #a7f3d0; border-color: #065f46; }

    .ct-pc { display: inline-flex; align-items: center; gap: .25rem; font-size: .7rem; border-radius: 999px; padding: .2rem .55rem; background: #3f1d2b; color: #fecdd3; border: 1px solid #9f1239; }
    .ct-pc.crono { background: #083344; color: #a5f3fc; border-color: #0e7490; }
    .ct-pc button { color: inherit; opacity: .7; }
    .ct-add { font-size: .7rem; border-radius: 999px; padding: .2rem .6rem; border: 1px dashed #475569; color: #94a3b8; background: transparent; cursor: pointer; }
    .ct-warn { font-size: .68rem; font-weight: 800; color: #fbbf24; }
    .ct-tag { font-size: .65rem; font-weight: 800; border-radius: 6px; padding: .15rem .45rem; }
    @media (max-width: 900px) {
      .ct-head { display: none; }
      .ct-row { grid-template-columns: 1fr 1fr; }
      .ct-row > .ct-wide { grid-column: 1 / -1; }
    }
    /* Cronómetro de paradas (tablet de la máquina) */
    .cro-box { border-radius: 1.5rem; padding: 1rem; }
    .cro-tiempo { font-variant-numeric: tabular-nums; }
  </style>
  <script>
    // ===== Cierre de turno del supervisor (todas las máquinas en una pantalla) + cronómetro de paradas =====
    (function () {
      const $ = id => document.getElementById(id);
      const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const norm = s => String(s == null ? '' : s).trim().toLowerCase();
      const toast = m => { try { showToast(m); } catch (e) { } };
      const pad = n => String(n).padStart(2, '0');
      const isoDe = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      const hoy = () => isoDe(new Date());
      const masDias = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoDe(d); };
      const aMin = t => { const p = String(t || '0:0').split(':'); return (Number(p[0]) || 0) * 60 + (Number(p[1]) || 0); };
      const deMin = m => pad(Math.floor(((m % 1440) + 1440) % 1440 / 60)) + ':' + pad(((m % 60) + 60) % 60);
      const fmtMin = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h ? (h + ' h' + (r ? ' ' + r + '′' : '')) : (r + '′'); };
      const n0 = v => Math.round(Number(v) || 0).toLocaleString('es-AR');
      const CR = () => window.inoferCargaRapida;
      const ordenes = () => (typeof productionOrders !== 'undefined' && Array.isArray(productionOrders) ? productionOrders : []);
      const ORDEN = ['200V', '200N', '180', 'H50', 'Z30'];
      const MAQS = () => { let L; try { L = GANTT_MACHINES_CONFIG.map(c => c.id); } catch (e) { L = ORDEN.slice(); } return L.sort((a, b) => (ORDEN.indexOf(a) + 1 || 99) - (ORDEN.indexOf(b) + 1 || 99)); };
      const maqDe = o => (CR() && CR().maqDeOrden) ? CR().maqDeOrden(o) : '';
      const turnos = () => (CR() && CR().turnos ? CR().turnos() : []);
      const durMin = t => (((aMin(t.fin) - aMin(t.ini)) + 1440) % 1440) || 1440;
      const codigos = () => (typeof INOFER_28_CODES !== 'undefined' ? INOFER_28_CODES : []);
      const corto = c => String(c || '').replace(/^\d+\s*-\s*/, '');
      const yo = () => (typeof inoferUsuarioEtiqueta === 'function' ? inoferUsuarioEtiqueta() : '') || 'equipo';
      const puede = () => typeof inoferCan !== 'function' || inoferCan('ordenes', 'edit');
      const esDemo = o => window.inoferEsDemo && inoferEsDemo({ fromOrder: true, ordId: o.id });
      // inicio y fin reales (en ms) de un turno de una fecha (los nocturnos terminan al día siguiente)
      function ventana(fecha, t) {
        const ini = new Date(fecha + 'T' + t.ini + ':00').getTime();
        return { ini, fin: ini + durMin(t) * 60000 };
      }

      // ---------------------------------------------------------------------------------
      // 1) Cronómetro de paradas: se guarda en el módulo de nube "mantenimiento" (lista cronoParadas)
      // ---------------------------------------------------------------------------------
      const mant = () => (window.inoferModLocal && inoferModLocal('mantenimiento')) || null;
      function lista() { const m = mant(); if (!m) return []; if (!Array.isArray(m.cronoParadas)) m.cronoParadas = []; return m.cronoParadas; }
      function guardarCrono() {
        const L = lista(); const lim = Date.now() - 15 * 86400000;
        const m = mant(); if (m) m.cronoParadas = L.filter(x => !x.hasta || new Date(x.hasta).getTime() > lim);
        if (window.inoferModGuardar) inoferModGuardar('mantenimiento');
      }
      const activa = maq => lista().find(x => x.maq === maq && !x.hasta) || null;
      function iniciar(maq, codigo) {
        if (activa(maq)) return;
        lista().push({ id: 'cp-' + Date.now() + '-' + Math.floor(Math.random() * 1000), maq, codigo, desde: new Date().toISOString(), hasta: '', por: yo() });
        guardarCrono(); repintar();
        toast(`⏸ Parada de la ${maq}: ${corto(codigo)}. Tocá ▶ ARRANCÓ cuando vuelva a inyectar.`);
      }
      function terminar(maq) {
        const a = activa(maq); if (!a) return;
        a.hasta = new Date().toISOString(); a.cerradoPor = yo();
        const min = Math.max(1, Math.round((new Date(a.hasta) - new Date(a.desde)) / 60000));
        guardarCrono(); repintar();
        toast(`▶ La ${maq} arrancó · parada de ${fmtMin(min)} (${corto(a.codigo)}) anotada para el turno`);
      }
      function cambiarMotivo(maq, codigo) { const a = activa(maq); if (!a) return; a.codigo = codigo; guardarCrono(); repintar(); }
      // Paradas del cronómetro dentro de un turno (sumadas por motivo, solo lo que cae dentro del horario)
      function delTurno(maq, fecha, t, incluirUsadas) {
        if (!maq || !t) return [];
        const v = ventana(fecha, t), por = {};
        lista().forEach(x => {
          if (x.maq !== maq || (x.usada && !incluirUsadas)) return;
          const a = new Date(x.desde).getTime(), b = x.hasta ? new Date(x.hasta).getTime() : Math.min(Date.now(), v.fin);
          const min = Math.round((Math.min(b, v.fin) - Math.max(a, v.ini)) / 60000);
          if (min <= 0) return;
          const k = x.codigo; por[k] = por[k] || { codigo: k, min: 0, ids: [], crono: true }; por[k].min += min; por[k].ids.push(x.id);
        });
        return Object.values(por);
      }
      function usar(maq, fecha, t, logId) {
        const ps = delTurno(maq, fecha, t); if (!ps.length) return;
        const ids = new Set([].concat(...ps.map(p => p.ids)));
        lista().forEach(x => { if (ids.has(x.id) && x.hasta) x.usada = logId; });
        guardarCrono();
      }
      window.inoferCronoDelTurno = (maq, fecha, t) => delTurno(maq, fecha, t).map(p => ({ codigo: p.codigo, min: p.min }));
      window.inoferCronoUsar = usar;
      window.inoferCronoActiva = activa;
      // Lo que se ve en "Mi máquina"
      function turnoAhora() {
        const n = new Date(), m = n.getHours() * 60 + n.getMinutes();
        const t = turnos().find(x => { const a = aMin(x.ini), b = aMin(x.fin); return a <= b ? (m >= a && m < b) : (m >= a || m < b); });
        if (!t) return null;
        const fecha = (aMin(t.fin) <= aMin(t.ini) && m < aMin(t.fin)) ? masDias(hoy(), -1) : hoy();
        return { t, fecha };
      }
      window.inoferCronoBloque = maq => {
        const a = activa(maq), ta = turnoAhora();
        const hechas = ta ? delTurno(maq, ta.fecha, ta.t, true).filter(p => !a || p.codigo !== a.codigo || p.ids.length > 1) : [];
        const resumen = ta && hechas.length ? `<div class="mt-2 text-sm text-slate-300">Paradas de este turno: ${hechas.map(p => `<b class="text-white">${esc(corto(p.codigo))} ${fmtMin(p.min)}</b>`).join(' · ')}</div>` : '';
        if (a) return `<div class="cro-box border-2 border-rose-500 bg-rose-500/15 text-center">
            <div class="text-sm font-black uppercase tracking-widest text-rose-300">⏸ Máquina parada</div>
            <div class="mt-1 text-2xl font-black text-white">${esc(corto(a.codigo))}</div>
            <div class="cro-tiempo mt-1 text-5xl font-black text-rose-200" data-crono-desde="${esc(a.desde)}">00:00</div>
            <div class="text-xs text-slate-400">desde las ${new Date(a.desde).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })} · avisó ${esc(String(a.por || '').replace(/ \(@.*/, ''))}</div>
            <button type="button" class="cro-fin mt-3 w-full rounded-3xl bg-emerald-500 px-4 py-6 text-3xl font-black text-slate-950 active:scale-[0.98]" data-m="${esc(maq)}">▶ ARRANCÓ</button>
            <button type="button" class="cro-cambiar mt-2 text-xs text-slate-300 underline" data-m="${esc(maq)}">Cambiar el motivo</button>${resumen}</div>`;
        return `<div class="cro-box border border-slate-700 bg-slate-900/90"><button type="button" class="cro-ini w-full rounded-3xl border-2 border-amber-500/60 bg-amber-500/15 px-4 py-6 text-2xl font-black text-amber-200 active:scale-[0.98]" data-m="${esc(maq)}">⏸ LA MÁQUINA PARÓ</button>
          <div class="mt-2 text-center text-xs text-slate-400">Tocalo cuando la máquina se detiene y después ▶ ARRANCÓ: el tiempo queda anotado solo para el turno.</div>${resumen}</div>`;
      };
      window.inoferCronoBadge = maq => {
        const a = activa(maq); if (!a) return '';
        return `<div class="mt-1 text-[11px] font-bold text-rose-300">⏸ Parada: ${esc(corto(a.codigo))} · <span class="cro-tiempo" data-crono-desde="${esc(a.desde)}"></span></div>`;
      };
      function elegirMotivo(maq, alElegir) {
        const frec = (CR() && CR().paradasFrecuentes) ? CR().paradasFrecuentes(maq) : [];
        const w = document.createElement('div'); w.id = 'croElegir';
        w.className = 'fixed inset-0 z-[85] flex items-center justify-center bg-black/75 p-3';
        w.innerHTML = `<div class="w-full max-w-lg space-y-3 rounded-3xl border border-slate-700 bg-slate-900 p-5">
          <div class="flex items-center justify-between"><div class="text-lg font-black text-white">¿Por qué paró la ${esc(maq)}?</div><button type="button" class="cro-x rounded-lg border border-slate-700 px-2 py-1 text-xs text-slate-300">✕</button></div>
          <div class="grid grid-cols-2 gap-2">${frec.map(c => `<button type="button" class="cro-cod rounded-2xl border-2 border-rose-500/40 bg-rose-500/10 px-3 py-4 text-sm font-black text-rose-100" data-c="${esc(c)}">${esc(corto(c))}</button>`).join('')}</div>
          <select class="cro-otro w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-3 text-sm text-white"><option value="">Otro motivo…</option>${codigos().map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div>`;
        document.body.appendChild(w);
        const fin = c => { w.remove(); if (c) alElegir(c); };
        w.addEventListener('click', e => { const b = e.target.closest('.cro-cod'); if (b) fin(b.dataset.c); if (e.target === w || e.target.closest('.cro-x')) fin(''); });
        w.querySelector('.cro-otro').addEventListener('change', e => fin(e.target.value));
      }
      document.addEventListener('click', e => {
        const b = e.target.closest && e.target.closest('.cro-ini, .cro-fin, .cro-cambiar'); if (!b) return;
        const m = b.dataset.m;
        if (b.classList.contains('cro-ini')) elegirMotivo(m, c => iniciar(m, c));
        else if (b.classList.contains('cro-fin')) terminar(m);
        else elegirMotivo(m, c => cambiarMotivo(m, c));
      });
      function repintar() { try { if (window.inoferPintarHoy) inoferPintarHoy(); } catch (e) { } try { if ($('ctModal')) pintar(); } catch (e) { } }
      setInterval(() => {
        document.querySelectorAll('[data-crono-desde]').forEach(el => {
          const s = Math.max(0, Math.floor((Date.now() - new Date(el.dataset.cronoDesde).getTime()) / 1000));
          el.textContent = (s >= 3600 ? Math.floor(s / 3600) + ':' : '') + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60);
        });
      }, 1000);

      // ---------------------------------------------------------------------------------
      // 2) Cierre de turno: una fila por máquina, precargada con lo programado
      // ---------------------------------------------------------------------------------
      const est = { fecha: '', turno: '', filas: {} };
      function turnoRecienTerminado() {
        const ahora = Date.now(); let best = null;
        for (let back = 0; back <= 1; back++) {
          const f = masDias(hoy(), -back);
          turnos().forEach(t => { const v = ventana(f, t); if (v.fin <= ahora + 30 * 60000 && (!best || v.fin > best.fin)) best = { fecha: f, t, fin: v.fin }; });
        }
        return best || { fecha: hoy(), t: turnos()[0] };
      }
      const abiertasDe = m => ordenes().filter(o => !esDemo(o) && maqDe(o) === m && CR() && CR().abierta(o));
      function programadoDia(m, fecha, part) {
        let q = 0;
        try {
          Object.values(ganttWeeksData || {}).forEach(w => (((w.machines || {})[m] || {}).items || []).forEach(it => {
            if (it.isSharedCompanion || (part && norm(it.part) !== norm(part))) return;
            (it.dailyQty || []).forEach((x, d) => { if (window.inoferFechaDia && inoferFechaDia(w, d) === fecha) q += Number(x) || 0; });
          }));
        } catch (e) { }
        return q;
      }
      function ordenSugerida(m, fecha) {
        const L = abiertasDe(m); if (!L.length) return null;
        const prog = L.find(o => programadoDia(m, fecha, o.part) > 0);
        if (prog) return prog;
        let best = null;
        L.forEach(o => (o.logs || []).forEach(l => { const k = (l.date || '') + (l.startTime || ''); if (!best || k > best.k) best = { k, o }; }));
        return best ? best.o : L[0];
      }
      function yaCargado(m, fecha, t) {
        const out = [];
        ordenes().forEach(o => { if (maqDe(o) !== m) return; (o.logs || []).forEach(l => { if (l.date === fecha && (norm(l.turno) === norm(t.nombre) || (l.startTime === t.ini && l.endTime === t.fin))) out.push({ o, l }); }); });
        return out;
      }
      function progTurno(m, fecha, t, o) {
        if (!o) return 0;
        const dia = programadoDia(m, fecha, o.part); if (!dia) return 0;
        const totalMin = turnos().reduce((a, x) => a + durMin(x), 0) || durMin(t);
        let q = Math.round(dia * durMin(t) / totalMin / 10) * 10;
        const a = CR().avance(o), falta = Math.max(0, (Number(o.qtyTarget) || 0) - a.ok);
        if (falta && q > falta) q = falta;
        return q;
      }
      function ultimoOperario(m) { const u = CR() && CR().ultimoTurnoMaq ? CR().ultimoTurnoMaq(m) : null; return u ? (u.operator || '') : ''; }
      function armarFilas() {
        const t = turnos().find(x => x.id === est.turno) || turnos()[0];
        est.filas = {};
        MAQS().forEach(m => {
          const fuera = window.inoferMaquinaDisponible && !inoferMaquinaDisponible(m, est.fecha);
          const cargados = yaCargado(m, est.fecha, t);
          const o = ordenSugerida(m, est.fecha);
          const prog = progTurno(m, est.fecha, t, o);
          const planificado = window.inoferPlanificadoEnGantt ? inoferPlanificadoEnGantt(m, est.fecha) : prog > 0;
          const estado = cargados.length ? 'listo' : (fuera ? 'fuera' : ((o || planificado) ? 'normal' : 'vacia'));
          est.filas[m] = {
            m, estado, cargados, prog, planificado,
            lineas: [{ ordId: o ? o.id : '', ok: prog ? String(prog) : '', auto: !!prog, scrap: '' }],
            paradas: delTurno(m, est.fecha, t).map(p => ({ codigo: p.codigo, min: p.min, crono: true })),
            operario: ultimoOperario(m), motivoNo: ''
          };
        });
      }
      function opcionesOrden(m, sel) {
        const L = abiertasDe(m);
        return (L.length ? L.map(o => `<option value="${esc(o.id)}" ${o.id === sel ? 'selected' : ''}>OP ${esc(o.ordNumber || '')} · ${esc(o.part)}</option>`).join('') : '') + `<option value="" ${!sel ? 'selected' : ''}>${L.length ? '— sin orden —' : 'No hay órdenes abiertas'}</option>`;
      }
      function filaHtml(f) {
        const t = turnos().find(x => x.id === est.turno) || turnos()[0];
        if (f.estado === 'listo') return `<div class="ct-row listo" data-m="${esc(f.m)}"><div class="ct-maq">${esc(f.m)}</div><div class="ct-wide text-xs text-emerald-200" style="grid-column: span 5">✓ Ya cargado: ${f.cargados.map(x => `OP ${esc(x.o.ordNumber || '')} · ${esc(x.o.part)} · <b>${n0(x.l.okPcs)}</b> buenas${x.l.scrapPcs ? ` · ${n0(x.l.scrapPcs)} scrap` : ''}${x.l.stopMinutes ? ` · paradas ${fmtMin(x.l.stopMinutes)}` : ''} · ${esc(x.l.operator || '')} <button type="button" class="ct-editar ml-1 text-cyan-300 underline" data-o="${esc(x.o.id)}" data-l="${esc(x.l.id)}">editar</button>`).join('<br>')}</div><div class="text-lg text-emerald-300">✓</div></div>`;
        if (f.estado === 'fuera') return `<div class="ct-row off" data-m="${esc(f.m)}"><div class="ct-maq">${esc(f.m)}</div><div class="ct-wide text-xs text-rose-200" style="grid-column: span 5">⛔ Fuera de servicio ese día (no se carga)</div><div></div></div>`;
        if (f.estado === 'no') return `<div class="ct-row off" data-m="${esc(f.m)}"><div class="ct-maq">${esc(f.m)}</div><div class="ct-wide"><b class="text-rose-200">⛔ No trabajó</b><button type="button" class="ct-deshacer ml-2 text-[11px] text-slate-400 underline">deshacer</button></div><div class="text-xs text-slate-500">${f.prog ? n0(f.prog) : '—'}</div>
          <div class="ct-wide" style="grid-column: span 3"><select class="ct-sel ct-motivo-no"><option value="">¿Por qué? (elegí el motivo)</option>${codigos().map(c => `<option value="${esc(c)}" ${c === f.motivoNo ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div><div class="text-lg ${f.motivoNo ? 'text-emerald-300' : 'text-slate-600'}">✓</div></div>`;
        if (f.estado === 'vacia') return `<div class="ct-row vacia" data-m="${esc(f.m)}"><div class="ct-maq">${esc(f.m)}</div><div class="ct-wide text-xs text-slate-400" style="grid-column: span 4">Sin programa en el Gantt para este turno.</div><div class="ct-wide flex flex-wrap gap-1.5"><button type="button" class="ct-b ct-cargar">+ Cargar igual</button></div><div></div></div>`;
        const ps = f.paradas, totP = ps.reduce((a, p) => a + (Number(p.min) || 0), 0);
        const avisos = [];
        f.lineas.forEach(l => { const o = ordenes().find(x => x.id === l.ordId); if (!o) return; if (f.prog && l.ok !== '' && Number(l.ok) < f.prog * 0.85 && f.lineas.length === 1) avisos.push(`−${Math.round((1 - Number(l.ok) / f.prog) * 100)}%`); });
        if (totP > durMin(t)) avisos.push('paradas > turno');
        const opers = CR() && CR().operariosDe ? CR().operariosDe(f.m) : [];

      function pintar() {

      function parada(m, alElegir) {
        const frec = (CR() && CR().paradasFrecuentes) ? CR().paradasFrecuentes(m) : [];

        let cod = '', min = 0;

      function copiarAnterior() {
        const T = turnos(); const i = T.findIndex(x => x.id === est.turno);
        const prevT = i > 0 ? T[i - 1] : T[T.length - 1], prevF = i > 0 ? est.fecha : masDias(est.fecha, -1);
        let n = 0;
        MAQS().map(m => est.filas[m]).filter(Boolean).forEach(f => {

      function guardar() {
        const t = turnos().find(x => x.id === est.turno) || turnos()[0];
        const F = MAQS().map(m => est.filas[m]).filter(Boolean).filter(f => f.estado === 'normal' || f.estado === 'no');

          if (f.estado === 'no') { if (!f.motivoNo) errores.push(`${f.m}: elegí por qué no trabajó`); return; }

          f.lineas.forEach(l => {
            if (!l.ordId) errores.push(`${f.m}: elegí la orden`);
            if (l.ok === '' || Number(l.ok) < 0) errores.push(`${f.m}: faltan las piezas buenas`);

              try {
                const r = inoferControlTurno(o, { ok: Number(l.ok) || 0, scrap: Number(l.scrap) || 0, baja: 0, fecha: est.fecha, ini: t.ini, fin: t.fin, paradasMin: f.paradas.reduce((a, p) => a + p.min, 0), turno: t.nombre });
                if (r.bloqueo) errores.push(`${f.m}: ${r.bloqueo}`);

            }
          });
        });
        if (errores.length) { toast('⚠️ ' + errores[0] + (errores.length > 1 ? ` (y ${errores.length - 1} más)` : '')); return; }
        if (avisos.length && !confirm('Revisá antes de guardar:\n\n• ' + avisos.join('\n• ') + '\n\n¿Guardar igual?')) return;
        const quien = yo(), ahora = new Date().toISOString(); let n = 0, pcs = 0;
        F.forEach(f => {
          if (f.estado === 'no') {
            const o = ordenSugerida(f.m, est.fecha);
            if (o && f.planificado) {
              o.logs = o.logs || [];
              const lid = 'lg-' + Date.now() + '-' + (n++);
              o.logs.push({ id: lid, date: est.fecha, operator: f.operario || '—', startTime: t.ini, endTime: t.fin, okPcs: 0, lowStartPcs: 0, scrapPcs: 0, stopCode: f.motivoNo, stopMinutes: durMin(t), paradas: [{ codigo: f.motivoNo, min: durMin(t) }], obs: `No trabajó · Cód ${String(f.motivoNo).split('-')[0]}`, obsUsuario: '', turno: t.nombre, origen: 'cierre', cargadoPor: quien, cargadoAt: ahora });
            } else if (window.inoferMarcarNoTrabajo) inoferMarcarNoTrabajo(f.m, est.fecha, t.nombre);
            return;
          }
          // varias piezas en el turno: el horario se reparte según el tiempo que lleva cada una
          const uh = l => { const o = ordenes().find(x => x.id === l.ordId); const c = (typeof partsCatalog !== 'undefined' ? partsCatalog : []).find(x => o && norm(x.part) === norm(o.part)); return Number(o && o.unitsPerHour) || Number(c && c.unitsPerHour) || 0; };

          const tot = pesos.reduce((a, b) => a + b, 0) || 1;
          let desde = aMin(t.ini);

            const o = ordenes().find(x => x.id === l.ordId); if (!o) return;

      function abrir(opc) {
        if (!CR()) { toast('Esperá un momento, la app todavía está cargando'); return; }
        if (!puede()) { toast('Tu usuario no puede cargar turnos'); return; }

        armarFilas();
        let w = $('ctModal'); if (w) w.remove();
        w = document.createElement('div'); w.id = 'ctModal'; w.innerHTML = '<div class="ct-card"></div>';
        document.body.appendChild(w);
        w.addEventListener('click', e => {
