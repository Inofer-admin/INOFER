  <script>
    // ===== Asistente del Gantt (chat / voz) + Lista de órdenes =====
    (function () {
      const $ = id => document.getElementById(id);
      const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      // Índices tal como se ven en el Gantt (0 = Dom, 1 = Lun ... 6 = Sáb)
      const DIAS = { domingo: 0, dom: 0, lunes: 1, lun: 1, martes: 2, mar: 2, miercoles: 3, mie: 3, jueves: 4, jue: 4, viernes: 5, vie: 5, sabado: 6, sab: 6 };
      const DIA_NOMBRE = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
      const AUX = { CMA: ['cambio de material', 'material'], CMO: ['cambio de molde', 'molde'], ALIS: ['alistamiento', 'alistar'], DESG: ['desgacificado', 'desgasificado', 'desgasificar'],
        LING: ['lingoteo', 'lingote'], LIMP: ['limpieza', 'limpiar'], CPIS: ['cambio de piston', 'piston'] };
      const MAQS = () => (typeof GANTT_MACHINES_CONFIG !== 'undefined' ? GANTT_MACHINES_CONFIG.map(m => m.id) : ['200V', '200N', '180', 'H50', 'Z30']);
      let historial = []; // copias para deshacer
      let ultimoDetalle = '';
      let chatLog = [];

      // ---------- búsqueda de piezas / máquinas / días ----------
      function itemsDe(week) {
        const out = [];
        Object.keys(week.machines || {}).forEach(m => ((week.machines[m] || {}).items || []).forEach((it, idx) => out.push({ m, it, idx })));
        return out;
      }
      function resolverPieza(token, week) {
        const t = norm(token);
        const todas = new Set();
        itemsDe(week).forEach(x => todas.add(x.it.part));
        (typeof partsCatalog !== 'undefined' ? partsCatalog : []).forEach(c => c && c.part && todas.add(c.part));
        const lista = [...todas];
        const exacta = lista.find(p => norm(p) === t);
        if (exacta) return { part: exacta };
        const enSemana = [...new Set(itemsDe(week).map(x => x.it.part))].filter(p => norm(p).startsWith(t));
        if (enSemana.length === 1) return { part: enSemana[0] };
        if (enSemana.length > 1) return { ambigua: enSemana };
        const enCat = lista.filter(p => norm(p).startsWith(t));
        if (enCat.length === 1) return { part: enCat[0] };
        if (enCat.length > 1) return { ambigua: enCat.slice(0, 8) };
        return { part: token.toUpperCase(), nueva: true };
      }
      function extraer(texto, week) {
        let t = ' ' + norm(texto).replace(/[,;:!?¿¡()]/g, ' ') + ' ';
        const r = { maquinas: [], dias: [], piezas: [], numeros: [], aux: null, todosDias: false };
        // máquinas (con o sin "maquina"/"la")
        MAQS().forEach(id => {
          const re = new RegExp('(?:maquina\\s+|la\\s+|en\\s+|a\\s+)' + (/^\d+$/.test(id) ? '' : '?') + '\\b' + norm(id).replace('-', '-?') + '\\b', 'g');
          t = t.replace(re, (m0, off) => { r.maquinas.push({ id, pos: off }); return ' '.repeat(m0.length); });
        });
        // horas auxiliares
        Object.keys(AUX).forEach(code => {
          if (r.aux) return;
          const sin = [code.toLowerCase()].concat(AUX[code]);
          const conHoras = /\bhoras?\b|\bhs\b|\bh\b/.test(t);
          for (const s of sin) {
            const largo = s.includes(' ') || s === code.toLowerCase();
            if (new RegExp('\\b' + s + '\\b').test(t) && (conHoras || largo || /\b(unidad|unidades|un|una|cambios?)\b/.test(t))) { r.aux = code; r.auxHoras = conHoras; break; }
          }
        });
        if (/todos los dias|toda la semana|cada dia/.test(t)) r.todosDias = true;
        // piezas: códigos con guion o números de 4+ cifras seguidos de "de la/pieza" etc.
        t = t.replace(/\b(?:pieza\s+|la\s+|el\s+)?(\d{3,6}(?:-[a-z0-9]+)+|[a-z]{1,4}-?\d{2,6}(?:-[a-z0-9]+)*)\b/g, (m0, code, off) => { r.piezas.push({ token: code, pos: off }); return ' '.repeat(m0.length); });
        t = t.replace(/\b(?:pieza|la|el|de la|del)\s+(\d{4,6})\b(?!\s*(?:piezas|unidades|u\b|un\b|uds|hs|horas))/g, (m0, code, off) => { r.piezas.push({ token: code, pos: off + m0.indexOf(code) }); return ' '.repeat(m0.length); });
        Object.keys(DIAS).forEach(d => {
          const re = new RegExp('\\b' + d + '\\b', 'g');
          t = t.replace(re, (m0, off) => { r.dias.push({ idx: DIAS[d], pos: off }); return ' '.repeat(m0.length); });
        });
        const nums = [...t.matchAll(/(\d+(?:[.,]\d+)?)/g)].map(m => ({ n: Number(m[1].replace(',', '.')), pos: m.index }));
        r.numeros = nums;
        // si no hubo pieza explícita, usar un número de 4+ cifras que coincida con una pieza existente
        if (!r.piezas.length) {
          for (const n of nums) {
            const s = String(n.n);
            if (s.length >= 4 && resolverPieza(s, week).part && !resolverPieza(s, week).nueva) { r.piezas.push({ token: s, pos: n.pos }); r.numeros = nums.filter(x => x !== n); break; }
          }
        }
        r.maquinas.sort((a, b) => a.pos - b.pos); r.dias.sort((a, b) => a.pos - b.pos); r.piezas.sort((a, b) => a.pos - b.pos);
        r.t = t;
        return r;
      }

      // ---------- interpretar una frase ----------
      function interpretar(frase, week) {
        const f = norm(frase).trim();
        if (!f) return [];
        if (/^(deshace|deshacer|volve atras|volver atras|anula|anular|undo)/.test(f)) return [{ op: 'undo' }];
        if (/^(ayuda|que podes hacer|que puedo decir|comandos)/.test(f)) return [{ op: 'help' }];
        if (!/factur|plata/.test(f) && /^(que hiciste|que cambiaste|que modificaste|detall|dame (el )?detalle|mostrame (el |los )?(detalle|cambios)|explicame|explica|contame que)/.test(f)) return [{ op: 'detalle' }];
        if (/factur|cuanto (se )?(vende|vendemos|sale el programa|genera)|cuanta plata|\bingres|\bplata\b/.test(f)) {
          const pre = [];
          const sm = f.match(/\bsem(?:ana)?[\s-]*(\d{1,2})\b/);
          if (sm) pre.push({ op: 'week', code: 'SEM-' + sm[1] });
          const sinSem = sm ? frase.replace(new RegExp(sm[0].replace(/[-\s]/g, '.?'), 'i'), ' ') : frase;
          const quiere = /(aument|subi|llev|necesito|objetivo|meta|quiero|lleg|arma|alcanz|sum|increment|mejor)/.test(f);
          const pct = norm(sinSem).match(/(\d+(?:[.,]\d+)?)\s*(%|por ?ciento)/);
          const monto = !pct && typeof inoferParseMonto === 'function' ? inoferParseMonto(sinSem) : null;
          if (!quiere) return pre.concat([{ op: 'facturacion' }]);
          if (!pct && !monto) return pre.concat([{ op: 'error', msg: '¿A cuánta plata querés llegar? Ej: "necesito facturar 40 millones esta semana" o "aumentá la facturación en 5 millones" o "subí la facturación un 10%".' }]);
          const xx = extraer(sinSem, week);
          const dias = xx.dias.map(d => d.idx);
          let ds = null;
          if (/sabado/.test(f)) ds = [1, 2, 3, 4, 5, 6];
          if (/domingo/.test(f)) ds = (ds || [1, 2, 3, 4, 5]).concat([0]);
          if (!ds && dias.length && /\b(solo|solamente|nada mas)\b/.test(f)) ds = dias;
          const incremental = !!pct || /(aument|subi|sum|increment)\w*.*\ben\s+\$?\s*\d/.test(f) || /\d[\d.,]*\s*(millones|millon|mil|m|palos)?\s*(mas|extra|adicionales?)\b/.test(f);
          return pre.concat([{ op: 'meta', monto, pct: pct ? Number(pct[1].replace(',', '.')) : null, incremental, dias: ds, maquinas: xx.maquinas.map(m => m.id), sinLimite: /sin limite|aunque no haya (pedido|demanda)|sin importar (la )?demanda|sin tope/.test(f) }]);
        }
        const sem = f.match(/\bsem(?:ana)?[\s-]*(\d{1,2})\b/);
        if (sem && /(cambia|pasa|anda|abri|ir|mostra|ver|selecciona|semana)/.test(f) && !/\b\d{4,}/.test(f.replace(sem[0], ''))) return [{ op: 'week', code: 'SEM-' + sem[1] }];
        const x = extraer(frase, week);
        const pz = x.piezas[0] ? resolverPieza(x.piezas[0].token, week) : null;
        if (pz && pz.ambigua) return [{ op: 'error', msg: `"${x.piezas[0].token}" coincide con varias piezas: ${pz.ambigua.join(', ')}. Decime cuál.` }];
        const part = pz ? pz.part : null;
        const maq = x.maquinas.map(m => m.id);
        const dias = x.dias.map(d => d.idx);
        const num = x.numeros.length ? x.numeros[0].n : null;
        const verbo = f.split(/\s+/)[0];

        if (/^(que hay|mostra|mostrame|ver|resumen|como esta|como quedo|lista)/.test(f)) return [{ op: 'show', mach: maq[0] || null }];

        // Horas auxiliares: "poné 2 horas de limpieza en la 180 el lunes"
        if (x.aux && num != null && maq.length) {
          const ds = x.todosDias ? [1, 2, 3, 4, 5] : (dias.length ? dias : null);
          if (!ds) return [{ op: 'error', msg: 'Decime qué día van esas horas (o "todos los días").' }];
          const stdX = typeof inoferStdAux === 'function' ? Number(inoferStdAux(maq[0], x.aux)) || 0 : 1;
          if (!x.auxHoras && !stdX) return [{ op: 'error', msg: `La ${maq[0]} no tiene tiempo estándar para esa tarea.` }];
          const horasX = x.auxHoras ? num : num * stdX;
          return ds.map(d => ({ op: 'aux', mach: maq[0], code: x.aux, day: d, hours: /sac|borr|elimin|quit/.test(f) ? 0 : horasX, add: /^sum|agreg|añad|anad/.test(f) }));
        }
        if (!part) return [{ op: 'error', msg: 'No encontré qué pieza querés modificar. Nombrala con su código, ej: "34111-PB" o "26608".' }];

        // Borrar / sacar
        if (/^(saca|sacá|borra|elimina|quita|remove|saque|sacar|borrar|eliminar|quitar)/.test(verbo) || /\b(sacala|borrala|eliminala|quitala)\b/.test(f)) {
          if (dias.length) return dias.map(d => ({ op: 'set', part, mach: maq[0] || null, day: d, qty: 0 }));
          return [{ op: 'remove', part, mach: maq[0] || null }];
        }
        // Intercambio de días: "intercambiá la X del lunes con el martes"
        if (/intercambi|invert/.test(f) && dias.length >= 2) return [{ op: 'swap', part, mach: null, a: dias[0], b: dias[1] }];
        // Mover / pasar
        if (/^(pasa|move|mueve|lleva|corre|cambia|manda|traslada|pasar|mover|llevar|correr|mandar|trasladar|cambiar)/.test(verbo) || /\bpasala|movela|llevala|correla\b/.test(f)) {
          if (dias.length >= 2) return [{ op: 'move_day', part, mach: maq.length > 1 ? maq[0] : (maq[0] || null), from: dias[0], to: dias[1], qty: num, toMach: maq.length > 1 ? maq[1] : null }];
          if (maq.length >= 1 && !dias.length) {
            const desde = maq.length > 1 ? maq[0] : null;
            return [{ op: 'move_mach', part, from: desde, to: maq[maq.length - 1] }];
          }
          if (maq.length >= 1 && dias.length === 1) return [{ op: 'move_mach', part, from: maq.length > 1 ? maq[0] : null, to: maq[maq.length - 1], days: [dias[0]] }];
          if (dias.length === 1 && num != null) return [{ op: 'set', part, mach: maq[0] || null, day: dias[0], qty: num }];
          return [{ op: 'error', msg: 'Decime a qué día o a qué máquina la paso. Ej: "pasá la 26608 del lunes al martes" o "mové la 26608 a la 200N".' }];
        }
        // Sumar / restar
        if (/^(suma|sumale|agrega|agregale|añadi|anadi|sumar|agregar)/.test(verbo) && num != null) {
          const ds = x.todosDias ? [1, 2, 3, 4, 5] : dias;
          if (!ds.length) return [{ op: 'error', msg: '¿Qué día le sumo esas piezas?' }];
          return ds.map(d => ({ op: 'add', part, mach: maq[0] || null, day: d, qty: num }));
        }
        if (/^(resta|restale|descontale|descuenta|baja|bajale|restar)/.test(verbo) && num != null) {
          const ds = x.todosDias ? [1, 2, 3, 4, 5] : dias;
          if (!ds.length) return [{ op: 'error', msg: '¿Qué día le resto esas piezas?' }];
          return ds.map(d => ({ op: 'add', part, mach: maq[0] || null, day: d, qty: -num }));
        }
        // Poner / fijar cantidad: "poné 500 de la 26608 en la 200N el miércoles"
        if (num != null) {
          const ds = x.todosDias ? [1, 2, 3, 4, 5] : dias;
          if (!ds.length) return [{ op: 'error', msg: `¿Qué día van las ${num} piezas de la ${part}?` }];
          return ds.map(d => ({ op: 'set', part, mach: maq[0] || null, day: d, qty: num }));
        }
        return [{ op: 'error', msg: 'No entendí el pedido. Escribí "ayuda" para ver ejemplos.' }];
      }

      // ---------- aplicar operaciones ----------
      function buscar(week, part, mach) {
        const p = norm(part);
        return itemsDe(week).filter(x => !x.it.isSharedCompanion && norm(x.it.part) === p && (!mach || x.m === mach));
      }
      function compañeras(week, m, part) {
        return (((week.machines[m] || {}).items) || []).filter(it => it.isSharedCompanion && norm(it.sharedWithPart) === norm(part));
      }
      function asegurarMaquina(week, m) {
        if (!week.machines[m]) week.machines[m] = { aux: {}, items: [] };
        if (!week.machines[m].items) week.machines[m].items = [];
        if (!week.machines[m].aux) week.machines[m].aux = {};
        return week.machines[m];
      }
      function nuevoItem(part, m) {
        const cat = (typeof partsCatalog !== 'undefined' ? partsCatalog : []).find(c => norm(c.part) === norm(part));
        const def = (MAQS().indexOf(m) >= 2) ? 'zamac' : 'alsi';
        const mat = cat ? String(cat.material || def).toLowerCase().includes('zam') ? 'zamac' : 'alsi' : def;
        return { id: 'gi-chat-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6), part, desc: cat ? (cat.desc || ('Pieza ' + part)) : ('Pieza ' + part),
          totalQty: 0, mat, stdRate: cat ? (Number(cat.unitsPerHour) || 60) : 60, weightKg: cat ? Number(cat.weightWithSprueKg) || 0 : (mat === 'alsi' ? 0.45 : 0.065),
          recuperoKg: cat ? (Number(cat.weightWithSprueKg) || 0) * 0.3 : 0.02, dailyQty: [0, 0, 0, 0, 0, 0, 0], orderId: '', sharedWithPart: '', isSharedCompanion: false };
      }
      function maquinaPorDefecto(part) {
        const cat = (typeof partsCatalog !== 'undefined' ? partsCatalog : []).find(c => norm(c.part) === norm(part));
        const ms = cat && Array.isArray(cat.machines) ? cat.machines : [];
        return ms.find(m => MAQS().includes(m) && !(typeof inoferMaquinaFueraTotal === 'function' && inoferMaquinaFueraTotal(m))) || ms.find(m => MAQS().includes(m)) || null;
      }
      function validarUbicacion(week, part, m, dias, origen) {
        if (typeof inoferEsPiezaR === 'function' && inoferEsPiezaR(part)) return `La ${part} termina en -R: no se inyecta, no la pongo en el Gantt.`;
        if (typeof inoferMaquinaDisponibleDia === 'function') {
          const fuera = (dias || []).filter(d => !inoferMaquinaDisponibleDia(m, week, d));
          if (fuera.length) { const e = inoferMaquinaEstado(m); return `La ${m} está fuera de servicio${e.motivo ? ' (' + e.motivo + ')' : ''} el ${fuera.map(d => DIA_NOMBRE[d]).join(', ')}.`; }
        }
        if (typeof inoferChoqueManual === 'function') {
          // al mover desde otra máquina, el molde sale de la de origen: esa no cuenta como choque
          const wv = origen ? Object.assign({}, week, { machines: Object.fromEntries(Object.entries(week.machines || {}).filter(([k]) => k !== origen)) }) : week;
          const c = inoferChoqueManual(wv, part, m, dias);
          if (c) return `La ${part} comparte portamolde ${c.pm} con la ${c.otra}, que ya está en la ${c.mach} el ${DIA_NOMBRE[c.dia]}. No pueden estar en máquina al mismo tiempo.`;
        }
        if (typeof inoferMaquinaAdmitePiston === 'function' && typeof inoferPistonDe === 'function') {
          const mm = inoferPistonDe(part);
          if (mm && !inoferMaquinaAdmitePiston(m, mm)) return `La ${m} no tiene pistón de ${mm} mm para la ${part}.`;
        }
        return null;
      }
      function horasDia(week, m, d) {
        const md = week.machines[m] || {};
        let h = 0;
        (md.items || []).forEach(it => { if (!it.isSharedCompanion) h += (Number((it.dailyQty || [])[d]) || 0) / (Number(it.stdRate) || 60); });
        Object.keys(md.aux || {}).forEach(k => { h += Number((md.aux[k] || [])[d]) || 0; });
        return h;
      }
      function sincronizarCompañeras(week, m, it) {
        compañeras(week, m, it.part).forEach(c => { c.dailyQty = [...it.dailyQty]; });
      }
      function limpiarVacios(week) {
        Object.keys(week.machines || {}).forEach(m => {
          const md = week.machines[m];
          if (!md || !md.items) return;
          const vacias = md.items.filter(it => !it.isSharedCompanion && !(it.dailyQty || []).some(q => Number(q) > 0)).map(it => norm(it.part));
          md.items = md.items.filter(it => {
            if (it.isSharedCompanion) return !vacias.includes(norm(it.sharedWithPart));
            return !vacias.includes(norm(it.part));
          });
        });
      }

      function aplicar(op, week, avisos) {
        const unico = (lst, part) => {
          if (!lst.length) throw `No encontré la ${part} en ${op.mach ? 'la ' + op.mach : 'esta semana'} (${week.code}).`;
          if (lst.length > 1) throw `La ${part} está en varias máquinas (${lst.map(x => x.m).join(', ')}). Decime en cuál.`;
          return lst[0];
        };
        switch (op.op) {
          case 'set': case 'add': {
            let lst = buscar(week, op.part, op.mach);
            let x;
            if (!lst.length) {
              if (op.qty <= 0) throw `La ${op.part} no está ${op.mach ? 'en la ' + op.mach : 'en esta semana'}.`;
              const m = op.mach || maquinaPorDefecto(op.part);
              if (!m) throw `La ${op.part} no está en el Gantt. Decime en qué máquina la pongo (ej: "en la 200N").`;
              const err = validarUbicacion(week, op.part, m, [op.day]);
              if (err) throw err;
              const it = nuevoItem(op.part, m);
              asegurarMaquina(week, m).items.push(it);
              x = { m, it, nuevo: true };
              const hsu = typeof inoferAgregarSetup === 'function' ? inoferAgregarSetup(week, m, op.day) : 0;
              avisos.push(`Agregué la ${op.part} a la ${m}${hsu ? ` (con ${hsu} h de cambio de molde y puesta a punto el ${DIA_NOMBRE[op.day]})` : ''}.`);
            } else x = unico(lst, op.part);
            const antes = Number(x.it.dailyQty[op.day]) || 0;
            const nuevo = Math.max(0, Math.round(op.op === 'add' ? antes + op.qty : op.qty));
            if (nuevo > 0 && antes === 0) { const err = validarUbicacion(week, x.it.part, x.m, [op.day]); if (err) throw err; }
            x.it.dailyQty[op.day] = nuevo;
            if (x.nuevo) x.it.totalQty = (x.it.dailyQty || []).reduce((a, b) => a + (Number(b) || 0), 0);
            sincronizarCompañeras(week, x.m, x.it);
            const h = horasDia(week, x.m, op.day);
            if (h > 24) avisos.push(`⚠️ La ${x.m} el ${DIA_NOMBRE[op.day]} queda con ${h.toFixed(1)} h cargadas (más de 24 h).`);
            const lmC = typeof inoferLoteMinDe === 'function' ? inoferLoteMinDe(x.it.part, x.m) : 0;
            const totC = (x.it.dailyQty || []).reduce((a, b) => a + (Number(b) || 0), 0);
            if (lmC && totC > 0 && totC < lmC) avisos.push(`⚠️ La ${x.it.part} queda con ${totC.toLocaleString('es-AR')} u en la semana, por debajo del lote mínimo de ${lmC.toLocaleString('es-AR')} u.`);
            return `${x.it.part} · ${x.m} · ${DIA_NOMBRE[op.day]}: ${antes} → ${nuevo} piezas`;
          }
          case 'move_day': {
            const x = unico(buscar(week, op.part, op.mach), op.part);
            const disp = Number(x.it.dailyQty[op.from]) || 0;
            if (!disp) throw `La ${x.it.part} no tiene piezas el ${DIA_NOMBRE[op.from]} en la ${x.m}.`;
            const cant = op.qty && op.qty < disp ? op.qty : disp;
            const destM = op.toMach || x.m;
            let destIt = x.it;
            if (destM !== x.m) {
              const err = validarUbicacion(week, x.it.part, destM, [op.to]); if (err) throw err;
              destIt = (buscar(week, x.it.part, destM)[0] || {}).it;
              if (!destIt) { destIt = JSON.parse(JSON.stringify(x.it)); destIt.id = 'gi-chat-' + Date.now(); destIt.dailyQty = [0, 0, 0, 0, 0, 0, 0]; asegurarMaquina(week, destM).items.push(destIt); }
            } else if (!(Number(x.it.dailyQty[op.to]) > 0)) {
              const err = validarUbicacion(week, x.it.part, x.m, [op.to]); if (err) throw err;
            }
            x.it.dailyQty[op.from] = disp - cant;
            destIt.dailyQty[op.to] = (Number(destIt.dailyQty[op.to]) || 0) + cant;
            sincronizarCompañeras(week, x.m, x.it);
            if (destIt !== x.it) {
              compañeras(week, x.m, x.it.part).forEach(c => { if (!compañeras(week, destM, x.it.part).length) { const cc = JSON.parse(JSON.stringify(c)); cc.id = 'gi-chat-sis-' + Date.now(); asegurarMaquina(week, destM).items.push(cc); } });
              sincronizarCompañeras(week, destM, destIt);
            }

      function borrarOrden(id) {
        if (typeof inoferCan === 'function' && !inoferCan('ordenes', 'edit')) { showToast('Tu usuario no puede borrar órdenes'); return; }
        const o = productionOrders.find(x => x.id === id);
        if (!o) return;
        if (productionOrders.length <= 1) { showToast('Debe quedar al menos una orden en el sistema'); return; }
        if (!confirm(`¿Borrar la orden OP ${o.ordNumber || ''} (${o.part || ''})?\n\nEl administrador la puede recuperar desde la Papelera.`)) return;
        productionOrders = productionOrders.filter(x => x.id !== id);
        if (!productionOrders.some(x => x.id === selectedOrderId)) selectedOrderId = productionOrders.length ? productionOrders[0].id : null;
        saveProductionOrders();
        renderProductionOrdersView();
        renderLista();
        showToast('Orden borrada (queda en la papelera)');
      }
      function montarLista() {
        const vo = $('viewOrders');
        const eff = $('orderSubViewEfficiency');
        if (!vo || !eff || $('orderSubViewList')) return;
        const barra = document.querySelector('.order-subtab-btn[data-order-subtab="efficiency"]');
        if (barra) {
          const b = document.createElement('button');
          b.type = 'button'; b.dataset.orderSubtab = 'list';
          b.className = 'order-subtab-btn rounded-lg px-3 py-1.5 text-xs font-semibold text-slate-300 hover:text-white';
          b.textContent = '📂 Lista de órdenes';
          barra.parentElement.insertBefore(b, barra);
          b.addEventListener('click', () => switchOrderSubTab('list'));
        }
        const v = document.createElement('div');
        v.id = 'orderSubViewList'; v.className = 'hidden space-y-4';
        v.innerHTML = `
          <div class="rounded-2xl border border-amber-500/30 bg-slate-900/90 p-4 shadow-xl space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div><h3 class="text-sm font-black text-amber-300">📂 Órdenes de producción</h3><p id="inoferOrdContador" class="text-[11px] text-slate-400"></p></div>
              <button type="button" id="inoferOrdNuevaBtn" class="rounded-lg bg-amber-500 px-3 py-1.5 text-xs font-bold text-slate-950 hover:bg-amber-400">+ Nueva orden</button>
            </div>
            <div class="flex flex-wrap gap-2">
              <input id="inoferOrdBuscar" placeholder="Buscar por N° de orden, pieza, molde…" class="min-w-[200px] flex-1 rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-xs text-white focus:border-amber-400 focus:outline-none">
              <select id="inoferOrdFiltroEstado" class="rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-xs text-slate-200">
                <option value="todas">Todas</option><option value="abiertas">En proceso</option><option value="completadas">Completadas</option>
              </select>
              <select id="inoferOrdFiltroMaq" class="rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-xs text-slate-200"></select>
            </div>
            <div id="inoferOrdenesLista" class="grid gap-3 sm:grid-cols-2 xl:grid-cols-3"></div>
          </div>`;
        eff.parentElement.insertBefore(v, eff);
        $('inoferOrdBuscar').addEventListener('input', e => { filtro.q = e.target.value; renderLista(); });
        $('inoferOrdFiltroEstado').addEventListener('change', e => { filtro.estado = e.target.value; renderLista(); });
        $('inoferOrdFiltroMaq').addEventListener('change', e => { filtro.maq = e.target.value; renderLista(); });
        $('inoferOrdNuevaBtn').addEventListener('click', () => { const nb = $('newOrderBtn'); if (nb) { nb.click(); switchOrderSubTab('front'); } });
        v.addEventListener('click', e => {
          const a = e.target.closest('.inofer-ord-abrir'), ed = e.target.closest('.inofer-ord-editar'), del = e.target.closest('.inofer-ord-borrar');
          if (a) abrirOrden(a.dataset.id, 'efficiency');
          else if (ed) abrirOrden(ed.dataset.id, 'front');
          else if (del) borrarOrden(del.dataset.id);
        });
        if (typeof INOFER_EDIT_CONTROLS !== 'undefined') {
          INOFER_EDIT_CONTROLS.ordenes.push('#inoferOrdNuevaBtn', '.inofer-ord-editar', '.inofer-ord-borrar');
        }
        // switchOrderSubTab conoce la nueva pestaña
        const orig = switchOrderSubTab;
        switchOrderSubTab = function (sub) {
          const lv = $('orderSubViewList');
          if (sub === 'list') {
            orig('efficiency');
            currentOrderSubTab = 'list';
            ['orderSubViewEfficiency', 'orderSubViewFront', 'orderSubViewBack', 'orderSubViewSheet', 'orderSubViewCatalog', 'orderSubViewGlobalReport'].forEach(i => $(i) && $(i).classList.add('hidden'));
            lv.classList.remove('hidden');
            document.querySelectorAll('.order-subtab-btn').forEach(btn => {
              const hid = btn.classList.contains('hidden');
              btn.className = btn.dataset.orderSubtab === 'list' ? 'order-subtab-btn rounded-lg px-3 py-1.5 text-xs font-bold bg-amber-500 text-slate-950 shadow' : 'order-subtab-btn rounded-lg px-3 py-1.5 text-xs font-semibold text-slate-300 hover:text-white';
              if (hid) btn.classList.add('hidden');
            });
            renderLista();
          } else {
            lv.classList.add('hidden');
            orig(sub);
          }
        };
        const origRender = renderProductionOrdersView;
        renderProductionOrdersView = function () { const r = origRender.apply(this, arguments); try { renderLista(); } catch (e) { } return r; };
        switchOrderSubTab('list');
      }
      window.inoferRenderListaOrdenes = renderLista;

      function iniciar() { try { montar(); } catch (e) { console.error(e); } try { montarLista(); } catch (e) { console.error(e); } }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();
    })();
  </script>
