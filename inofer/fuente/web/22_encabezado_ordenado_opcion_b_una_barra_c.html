        // filtros del tablero: solo en Tablero e Historial
        const fs = $('filterMachine') && $('filterMachine').closest('section');
        if (fs) fs.classList.toggle('hidden', !!sesion() && !['tabDashboardBtn', 'tabRecordsBtn'].includes(act));
      }
      // si no entra todo en la barra (pantallas medianas), se achica: primero el nombre del usuario, después los textos de los menús
      function compactar() {
        const bar = $('nbBar'), nav = $('nbNav'); if (!bar || !nav) return;
        if (window.innerWidth < 640) { bar.dataset.c = '0'; return; }
        for (const c of ['0', '1', '2']) { bar.dataset.c = c; if (nav.scrollWidth <= nav.clientWidth + 1) break; }
        nav.querySelectorAll('.nb-grupo').forEach(b => { b.title = bar.dataset.c === '2' ? b.textContent.replace(/[▾·].*$/, '').trim() : ''; });
      }
      window.addEventListener('resize', () => setTimeout(compactar, 50));
      // junta a la derecha los íconos que otras partes de la app crean en el encabezado
      function juntar() {
        const right = $('nbRight'); if (!right) return;
        const ver = $('inoferVersionTag'), nbv = $('nbVer');
        if (ver && nbv && ver.parentElement !== nbv) { nbv.appendChild(ver); ver.className = 'text-[9px] font-semibold text-slate-500'; }
        const pill = $('inoferOfflinePill'); if (pill && nbv && pill.parentElement !== nbv) nbv.appendChild(pill);
        const orden = [$('syncNowBtn'), $('inoferAvisosBtn'), $('inoferMsgBtn') && $('inoferMsgBtn').parentElement, $('presBtn'), $('toggleFullscreenBtn'), $('inoferUserChip') && $('inoferUserChip').parentElement].filter(Boolean);
        const actual = [...right.children];
        if (orden.length !== actual.length || orden.some((e, i) => actual[i] !== e)) orden.forEach(e => right.appendChild(e));
        const sync = $('syncNowBtn'), stx = $('syncStatusText');
        if (sync && stx && sync.title !== stx.textContent) sync.title = 'Estado: ' + stx.textContent + ' (tocá para sincronizar)';
      }
      function tick() { try { if (montar()) { juntar(); pintar(); } } catch (e) { console.error(e); } }
      function iniciar() {
        tick();
        setInterval(tick, 800);
        if (typeof window.switchTab === 'function' && !window.switchTab.__nb) { const sw = window.switchTab; const f = function () { const r = sw.apply(this, arguments); setTimeout(() => pintar(true), 0); return r; }; Object.assign(f, sw); f.__nb = true; window.switchTab = f; }
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(iniciar, 30)); else setTimeout(iniciar, 30);
    })();
  </script>
