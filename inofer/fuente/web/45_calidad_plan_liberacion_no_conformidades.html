  <script>
    // ===== 🧪 Calidad (12/11/2026, boceto "Módulo de Calidad INOFER" aprobado) =====
    // Pestaña con 4 partes: Tablero (indicadores del período, hoy en planta, causas, piezas que más fallan, NC abiertas),

    (function () {

      const fDiaH = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${hhmm(d)}`; };

      const catDe = p => { try { return (window.inoferCatBuscar && inoferCatBuscar(p)) || null; } catch (e) { return null; } };
      const okReal = o => (typeof inoferOkReal === 'function' ? inoferOkReal(o) : (o.logs || []).reduce((a, l) => a + (Number(l.okPcs) || 0), 0));

      // ---------- permisos
      const sesion = () => (typeof inoferSession !== 'undefined' ? inoferSession : null);
      const esAdmin = () => !!(sesion() && sesion().rol === 'admin');
      const can = (a, n) => typeof inoferCan !== 'function' || inoferCan(a, n);
      const pk = k => typeof inoferPuede !== 'function' || inoferPuede(k);
      const P = {

      // ---------- datos (módulo de nube calidadDatos)
      const KEY = 'tablero_inyectoras_calidad_datos_v1', MODK = 'calidadDatos';
      const LISTAS = ['planes', 'liberaciones', 'ncs', 'instrumentos'];

      const normQ = v => { const o = Object.assign(DEF(), v && typeof v === 'object' ? v : {}); LISTAS.forEach(k => { if (!Array.isArray(o[k])) o[k] = []; }); return o; };
      let Q = DEF(); try { Q = normQ(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) { Q = DEF(); }
      let cambioAt = 0;
      const DIAS_LIB = 120; // las liberaciones se guardan 4 meses (trazabilidad de reclamos sin llenar la memoria)

      }
      function recibir(mods) {

      }
      function envolverNube() {
        if (typeof window.applyCloudModules !== 'function' || window.applyCloudModules.__cal) return;
        const am = window.applyCloudModules;
        const f = function (mods) { const r = am.apply(this, arguments); try { recibir(mods); } catch (e) { } return r; };
        Object.keys(am).forEach(k => { f[k] = am[k]; }); f.__cal = true;
        window.applyCloudModules = f;
      }
      window.inoferCalidadLocal = () => Q;

      // ---------- planes de control
      const planGuardado = pieza => Q.planes.find(p => nm(p.pieza) === nm(pieza)) || null;
      // Hoja de control de inyección (13/11/2026, planilla en papel de la planta): toda pieza de la base tiene plan solo,
      // armado con sus datos: peso neto ±tolerancia del de referencia ("Tabla"), temperatura por material, colada,
      // pulmones y taco se anotan, muestras OK. Un plan guardado a mano para la pieza tiene prioridad.
      const HOJA_DEF = { cadaH: 1, tolNeto: 5, tempAl: [650, 710], tempZn: [410, 440], muestras: 5 };
      const hojaCfg = () => { const h = Object.assign({}, HOJA_DEF, (Q.hoja && typeof Q.hoja === 'object') ? Q.hoja : {}); ['tempAl', 'tempZn'].forEach(k => { if (!Array.isArray(h[k]) || h[k].length < 2) h[k] = HOJA_DEF[k]; }); return h; };
      const esZamac = c => /ZAMA|^ZN|ZINC/i.test(String((c && c.material) || ''));
      const camaraCaliente = m => /^(Z30|H50)$/i.test(String(m || '').trim());
      function planHoja(pieza) {
        const c = catDe(pieza); if (!c) return null;
        const H = hojaCfg(), zn = esZamac(c), cada = Number(H.cadaH) || 1, tol = Number(H.tolNeto) || 5, nmu = Math.max(1, Number(H.muestras) || 5);
        const ref = Number(c.weightOkGrs) || 0, r1 = v => Math.round(v * 10) / 10, T = zn ? H.tempZn : H.tempAl;
        const k = (id, o) => Object.assign(controlNuevo(), { id, primera: true, cadaH: cada, quien: 'Operario' }, o);
        const C = [
          k('h-colada', { que: 'Peso colada', tipo: 'dato', unidad: 'g', inst: 'Balanza' }),
          ref ? k('h-neto', { que: 'Peso neto', tipo: 'medida', min: r1(ref * (1 - tol / 100)), max: r1(ref * (1 + tol / 100)), ref, unidad: 'g', inst: 'Balanza', reaccion: 'Retener y avisar al supervisor' })
            : k('h-neto', { que: 'Peso neto', tipo: 'dato', unidad: 'g', inst: 'Balanza', espec: 'sin peso de referencia en la base de piezas' }),
          k('h-pulm', { que: 'Peso pulmones', tipo: 'dato', unidad: 'g', inst: 'Balanza' }),
          k('h-temp', { que: 'Temperatura del metal', tipo: 'medida', min: Number(T[0]), max: Number(T[1]), unidad: '°C', inst: 'Pirómetro', reaccion: 'Corregir la temperatura del horno y volver a medir' })
        ];
        if (!zn) C.push(k('h-taco', { que: 'Taco de colada', tipo: 'dato', unidad: 'mm', inst: 'Calibre' }));
        C.push(k('h-muestras', { que: 'Muestras OK', tipo: 'medida', min: nmu, max: nmu, unidad: 'de ' + nmu, inst: 'Corte / visual', reaccion: 'Separar las piezas y avisar al supervisor' }));
        return { id: 'auto-' + nm(pieza), pieza: c.part || pieza, desc: c.desc || '', version: 0, auto: true, hoja: true, controles: C, hist: [] };
      }
      const planDe = pieza => planGuardado(pieza) || planHoja(pieza);
      // Parámetros de máquina (columna derecha de la hoja): se anotan en cada control, vienen cargados con los del último
      const PAR_FRIA = [['v1', '1° Velocidad', '%'], ['v2', '2° Velocidad', '%'], ['vm', 'Velocidad de mult.', '%'], ['cpm', 'Contrapresión mult.', 'bar'], ['pm', 'Presión de mult.', 'bar'], ['c2', 'Carrera 2° fase', 'mm'], ['cm', 'Carrera mult.', 'mm'], ['sol', 'Solidificación', 'seg'], ['pis', 'Diámetro de pistón', 'mm'], ['ciclo', 'Ciclo', 'seg']];
      const PAR_CAL = [['ap', 'Alta presión', ''], ['iny', 'Inyección', ''], ['enf', 'Enfriamiento', ''], ['lpf', 'Lub. plato fijo', ''], ['lpm', 'Lub. plato móvil', ''], ['tcp', 'Tiempo cierre de puerta', ''], ['v2f', '2° Vel. fase', ''], ['pmm', 'Presión de mult. (manómetro)', ''], ['pn2', 'Presión de nitrógeno (manómetro)', ''], ['ciclo', 'Ciclo', 'seg']];
      const parsDe = m => camaraCaliente(m) ? PAR_CAL : PAR_FRIA;
      function ultimosPar(m, pieza, antesDe) {
        const L = Q.liberaciones.filter(x => x && x.maq === m && nm(x.pieza) === nm(pieza) && x.par && Object.keys(x.par).length && (!antesDe || String(x.at) < antesDe)).sort((a, b) => String(b.at).localeCompare(String(a.at)));
        return L[0] || null;
      }
      const QUIEN = ['Operario', 'Supervisor', 'Calidad'];
      const CADA = [[0, 'Solo primera pieza'], [1, 'Cada 1 h'], [2, 'Cada 2 h'], [4, 'Cada 4 h'], [-1, 'Una vez por turno']];
      const cadaTxt = c => (c.primera !== false ? 'Primera pieza' : '') + (Number(c.cadaH) > 0 ? (c.primera !== false ? ' + ' : '') + `cada ${c.cadaH} h` : (Number(c.cadaH) === -1 ? (c.primera !== false ? ' + ' : '') + 'por turno' : '')) || '—';
      const especTxt = c => c.tipo === 'dato' ? ('se anota' + (c.unidad ? ' (' + c.unidad + ')' : '') + (c.espec ? ' · ' + c.espec : '')) : c.tipo === 'ok' ? (c.espec || 'OK / NO') : (c.min !== '' && c.min != null && c.max !== '' && c.max != null ? (Number(c.min) === Number(c.max) ? `tiene que dar ${fmtV(c.min)}` : `${fmtV(c.min)} a ${fmtV(c.max)}`) : (c.min !== '' && c.min != null ? `mín. ${fmtV(c.min)}` : (c.max !== '' && c.max != null ? `máx. ${fmtV(c.max)}` : 'sin límites'))) + (c.unidad && c.tipo !== 'ok' ? ' ' + c.unidad : '') + (c.ref ? ` · ref. ${fmtV(c.ref)}` : '');
      const controlNuevo = () => ({ id: nid('cc'), que: '', tipo: 'medida', min: '', max: '', unidad: '', espec: '', inst: '', primera: true, cadaH: 0, quien: 'Operario', reaccion: '' });
      const PLANTILLA = () => [
        Object.assign(controlNuevo(), { que: 'Peso de la pieza', unidad: 'g', inst: 'Balanza', cadaH: 2, reaccion: 'Retener y avisar al supervisor' }),
        Object.assign(controlNuevo(), { que: 'Aspecto visual', tipo: 'ok', espec: 'Sin rechupe, sin rebaba, llenado completo', inst: 'Muestra patrón', cadaH: 1, reaccion: 'Separar las piezas y avisar' }),
        Object.assign(controlNuevo(), { que: 'Fechador y versión del molde', tipo: 'ok', espec: 'Fechador del mes en curso', inst: 'Visual', quien: 'Supervisor', reaccion: 'No producir hasta corregir' })
      ];
      function evaluar(c, v) {
        if (c.tipo === 'ok') return v === 'ok' ? true : (v === 'no' ? false : null);
        const x = num(v); if (!isFinite(x)) return null;
        if (c.tipo === 'dato') return true;
        const mi = num(c.min), ma = num(c.max);
        return (!isFinite(mi) || x >= mi) && (!isFinite(ma) || x <= ma);
      }

      // ---------- estado de cada máquina (qué control le toca)
      function ordenAct(m) {
        const mont = window.inoferOpMontada ? inoferOpMontada(m) : null; if (mont) return mont;
        const ult = o => (o.logs || []).reduce((a, l) => { const k = String(l.date || '') + String(l.startTime || ''); return k > a ? k : a; }, '');
        const ab = ordenes().filter(o => maqDe(o) === m && abierta(o));
        return ab.sort((a, b) => ult(b).localeCompare(ult(a)))[0] || null;
      }
      function turnoActual(ahora) {
        const d = ahora || new Date(), n = d.getHours() * 60 + d.getMinutes();
        const aMin = s => { const [h, mm] = String(s || '0:0').split(':').map(Number); return (h || 0) * 60 + (mm || 0); };
        let T = []; try { T = inoferCargaRapida.turnos() || []; } catch (e) { }
        for (const t of T) {
          const a = aMin(t.ini), b = aMin(t.fin);
          const dentro = a <= b ? (n >= a && n < b) : (n >= a || n < b);
          if (!dentro) continue;
          const ini = new Date(d); ini.setHours(Math.floor(a / 60), a % 60, 0, 0);
          if (ini > d) ini.setDate(ini.getDate() - 1);
          return { nombre: t.nombre, desde: ini.getTime() };
        }
        return null;
      }
      function inicioDe(o, m) {
        if (o.montada && o.montada.maq === m && o.montada.desde) { const t = Date.parse(o.montada.desde); if (isFinite(t)) return t; }
        const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime();
      }
      function estadoMaq(m) {
        const o = ordenAct(m); if (!o) return { est: 'sinop', m };
        const pl = planDe(o.part); if (!pl || !(pl.controles || []).length) return { est: 'sinplan', m, o };
        const ini = inicioDe(o, m);
        const L = Q.liberaciones.filter(x => x && x.maq === m && nm(x.pieza) === nm(o.part) && Date.parse(x.at) >= ini).sort((a, b) => String(b.at).localeCompare(String(a.at)));
        const ult = L[0];
        if (ult && ult.res === 'retenida') return { est: 'retenido', m, o, pl, ult };
        const prim = L.find(x => (x.tipo === 'primera' || x.tipo === 'concesion') && x.res === 'liberada');
        if (!prim) return { est: 'falta', m, o, pl, desde: ini };
        let prox = null; const toca = [];
        const tur = turnoActual();
        (pl.controles || []).forEach(c => {
          let last = 0;
          L.forEach(x => { if (x.res !== 'liberada') return; if (x.tipo === 'concesion' || (x.v || []).some(v => v[0] === c.id)) last = Math.max(last, Date.parse(x.at)); });
          let due = null;
          if (Number(c.cadaH) > 0) due = last + Number(c.cadaH) * 3600000;
          else if (Number(c.cadaH) === -1 && tur && last < tur.desde) due = tur.desde + 3600000; // por turno: dentro de la primera hora
          if (due == null) return;
          if (prox == null || due < prox) prox = due;
          if (due <= Date.now() + 20 * 60000) toca.push(c.id);
        });
        if (prox != null && Date.now() > prox) return { est: 'atrasado', m, o, pl, prim, prox, toca, min: Math.round((Date.now() - prox) / 60000) };
        return { est: 'ok', m, o, pl, prim, prox, toca };
      }
      const ESTADO = {
        ok: { c: 'emerald', t: e => `OK${e.prox ? ' · próximo control ' + hhmm(new Date(e.prox)) : ''}` },
        atrasado: { c: 'amber', t: e => `CONTROL ATRASADO ${e.min >= 60 ? Math.floor(e.min / 60) + ' h ' + (e.min % 60) + ' min' : e.min + ' min'}` },
        retenido: { c: 'rose', t: e => `RETENIDO · espera al supervisor` },
        falta: { c: 'slate', t: () => 'Falta liberar la primera pieza' },
        sinplan: { c: 'slate', t: () => 'Sin plan de control' },
        sinop: { c: 'slate', t: () => 'Sin orden abierta' }
      };

      // ---------- datos de producción del período (para el tablero)
      function rango(per) {
        const h = new Date(); const y = h.getFullYear(), mo = h.getMonth();
        if (per === 'mesant') { const a = new Date(y, mo - 1, 1), b = new Date(y, mo, 0); return { desde: isoDe(a), hasta: isoDe(b), txt: a.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' }) }; }
        if (per === '30' || per === '90') return { desde: masDias(hoy(), -Number(per) + 1), hasta: hoy(), txt: `últimos ${per} días` };
        return { desde: isoDe(new Date(y, mo, 1)), hasta: hoy(), txt: h.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' }) };
      }
      function produccion(desde, hasta) {
        const R = { iny: 0, ok: 0, scrap: 0, rech: 0, costo: 0, sinPrecio: 0, porPieza: {}, causas: {}, rechazos: [] };
        const pz = (o) => { const k = nm(o.part) + '|' + maqDe(o); return R.porPieza[k] || (R.porPieza[k] = { pieza: o.part, maq: maqDe(o), iny: 0, malas: 0, causas: {} }); };
        ordenes().forEach(o => {
          if (esDemo(o)) return;
          const c = catDe(o.part), precio = Number(c && c.precio) || 0;
          (o.logs || []).forEach(l => {
            const f = String(l.date || ''); if (f < desde || f > hasta) return;
            const ok = Number(l.okPcs) || 0, sc = (Number(l.scrapPcs) || 0) + (Number(l.lowStartPcs) || 0);
            R.iny += ok + sc; R.ok += ok; R.scrap += sc;
            const p = pz(o); p.iny += ok + sc; p.malas += sc;
            if (precio) R.costo += sc * precio; else if (sc) R.sinPrecio += sc;
          });
          (typeof inoferRechazos === 'function' ? inoferRechazos(o) : (o.rechazos || []).filter(r => !r.borrado)).forEach(r => {
            const f = String(r.fecha || ''); if (f < desde || f > hasta) return;
            const q = Number(r.cant) || 0; R.rech += q;
            const p = pz(o); p.malas += q; p.causas[r.causa || 'Sin causa'] = (p.causas[r.causa || 'Sin causa'] || 0) + q;
            const k = r.causa || 'Sin causa'; const C = R.causas[k] || (R.causas[k] = { n: 0, piezas: {}, maqs: {}, origen: {} });
            C.n += q; C.piezas[o.part] = (C.piezas[o.part] || 0) + q; C.maqs[maqDe(o)] = (C.maqs[maqDe(o)] || 0) + q; C.origen.control = (C.origen.control || 0) + q;
            if (precio) R.costo += q * precio; else R.sinPrecio += q;
            R.rechazos.push({ o, r });
          });
        });
        // planillas SCRAP subidas en Indicadores (si este usuario las tiene)
        try {
          const sd = JSON.parse(localStorage.getItem('tablero_inyectoras_scrapdet_v1') || 'null');
          const meses = (sd && sd.meses) || {};
          Object.keys(meses).forEach(mes => {
            if (mes + '-31' < desde || mes + '-01' > hasta) return;
            (meses[mes].causas || []).forEach(x => {
              const q = Number(x.n) || 0; if (!q || !x.c) return;
              const k = String(x.c).trim(); const nk = Object.keys(R.causas).find(z => z.toLowerCase() === k.toLowerCase()) || k;
              const C = R.causas[nk] || (R.causas[nk] = { n: 0, piezas: {}, maqs: {}, origen: {} });
              C.n += q; if (x.p) C.piezas[x.p] = (C.piezas[x.p] || 0) + q; C.origen.planilla = (C.origen.planilla || 0) + q;
            });
          });
        } catch (e) { }
        R.real = Math.max(0, R.ok - R.rech);
        return R;
      }

      // ---------- vista (pestaña)
      let st = { sub: 'tablero', per: 'mes', causa: '', planPieza: '', planBorr: null, buscarPlan: '', libMaq: '', libQ: '', ncFiltro: 'abiertas' };
      function montarVista() {
        const ref = $('viewGantt'); if (!ref || $('viewCalidad')) return;
        const v = document.createElement('div'); v.id = 'viewCalidad'; v.className = 'hidden space-y-4';
        ref.parentNode.insertBefore(v, ref.nextSibling);
        const b = document.createElement('button'); b.type = 'button'; b.id = 'tabCalidadBtn'; b.className = 'hidden'; b.textContent = '🧪 Calidad';
        const tr = $('tabKpiBtn') || $('tabGanttBtn'); if (tr) tr.parentNode.insertBefore(b, tr.nextSibling);
        b.addEventListener('click', () => switchTab('calidad'));
      }
      function instalarTab() {
        if (typeof window.switchTab !== 'function' || window.switchTab.__cal) return;
        const sw = window.switchTab;
        const f = function (tab) {
          const v = $('viewCalidad');
          if (tab === 'calidad') {
            if (!v || !P.ver()) return;

          <div class="firmas"><div>Calidad</div><div>Producción</div><div>Gerencia</div></div></body></html>`;
        const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0'; document.body.appendChild(f);
        f.contentDocument.open(); f.contentDocument.write(html); f.contentDocument.close();
        setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { } setTimeout(() => f.remove(), 60000); }, 300);
        return html;
      }
      document.addEventListener('click', e => {
        const w = $('calNcModal'); if (!w || !NC) return;
        if (e.target === w) return cerrarNc();
        const b = e.target.closest && e.target.closest('[data-ncb],[data-nc-tipo],[data-nc-ctok],[data-nc-ctdel],[data-nc-acok],[data-nc-acdel]'); if (!b || !w.contains(b)) return;
        const a = b.dataset.ncb;
        if (a === 'cerrar') return cerrarNc();
        leerNc();
        if (b.dataset.ncTipo) { NC.tipo = b.dataset.ncTipo; return pintarNc(); }
        if (b.dataset.ncCtok) { const c = NC.contencion.find(x => x.id === b.dataset.ncCtok); if (c) c.ok = b.checked; return pintarNc(); }
        if (b.dataset.ncCtdel) { NC.contencion = NC.contencion.filter(x => x.id !== b.dataset.ncCtdel); return pintarNc(); }
        if (b.dataset.ncAcok) { const x = NC.acciones.find(z => z.id === b.dataset.ncAcok); if (x) { x.estado = x.estado === 'hecha' ? 'pendiente' : 'hecha'; x.hechaAt = x.estado === 'hecha' ? new Date().toISOString() : ''; } return pintarNc(); }
        if (b.dataset.ncAcdel) { NC.acciones = NC.acciones.filter(x => x.id !== b.dataset.ncAcdel); return pintarNc(); }
        if (a === 'ctAdd') { NC.contencion.push({ id: nid('ct'), t: '', ok: false }); pintarNc(); const i = document.querySelector(`[data-nc-ct="${NC.contencion[NC.contencion.length - 1].id}"]`); if (i) i.focus(); return; }
        if (a === 'acAdd') { NC.acciones.push({ id: nid('ac'), t: '', resp: '', para: masDias(hoy(), 7), estado: 'pendiente' }); pintarNc(); const i = document.querySelector(`[data-nc-ac="${NC.acciones[NC.acciones.length - 1].id}"]`); if (i) i.focus(); return; }
        if (a === 'lote') { const lt = $('calNcLote'); if (lt) lt.innerHTML = htmlLote(NC); const c = $('calNcCtx'); if (c) c.innerHTML = contextoTurno(NC); return; }
        if (a === 'rechazo') { const L = NC.lote ? buscarLote(NC.lote, NC.pieza) : null; if (guardarNc(true)) { inoferRechazo(L && L.turnos[0] ? { ordId: L.turnos[0].o.id } : {}); } return; }
        if (a === 'plan') { const pz = NC.pieza; if (guardarNc(true)) { cerrarNc(); abrirPlan(pz); } return; }
        if (a === 'guardar') return guardarNc();
        if (a === 'imprimir') { imprimir8D(NC); return; }
        if (a === 'cerrarNc') { const nota = prompt('Verificación: ¿qué se comprobó? (ej. 3 lotes sin rechupe después del cambio)'); if (nota === null) return; const eficaz = confirm('¿Las acciones fueron eficaces? (Aceptar = sí)'); NC.cierre = { fecha: hoy(), por: quien(), eficaz, nota: String(nota).slice(0, 200) }; guardarNc(true); toast(`✓ ${NC.num} cerrada`); return; }
        if (a === 'reabrir') { NC.cierre = null; return guardarNc(); }
        if (a === 'borrar') { if (!confirm(`¿Borrar ${NC.num}? No se puede deshacer.`)) return; Q.ncs = Q.ncs.filter(x => x.id !== NC.id); guardar(); cerrarNc(); toast('No conformidad borrada'); }
      });

      // ---------- clicks de la pestaña
      document.addEventListener('click', e => {
        const v = $('viewCalidad'); if (!v || !e.target.closest || !v.contains(e.target)) return;
        const b = e.target.closest('[data-cal],[data-cal-sub],[data-cal-per],[data-cal-causa],[data-cal-lib],[data-cal-resolver],[data-cal-planpz],[data-cal-nc],[data-cal-ncf],[data-cal-cdel],[data-cal-cmov],[data-cal-instdel],[data-cal-instcal],[data-cal-foto],[data-cal-hoja]'); if (!b) return;
        const a = b.dataset.cal;
        if (a === 'liberar') return abrirLiberacion({});
        if (a === 'rechazo') return window.inoferRechazo && inoferRechazo();
        if (a === 'ncNueva') return nuevaNc();
        if (a === 'planVolver') { st.planPieza = ''; st.planBorr = null; return render(); }
        if (a === 'cAdd') { leerBorrador(); st.planBorr.controles.push(controlNuevo()); render(); const L = document.querySelectorAll('#calPlanFilas [data-k="que"]'); if (L.length) L[L.length - 1].focus(); return; }
        if (a === 'planGuardar') return guardarPlan();
        if (a === 'hojaGuardar') return guardarHoja();
        if (a === 'planBorrar') { if (!confirm(`¿Borrar el plan de control de ${st.planPieza}?`)) return; Q.planes = Q.planes.filter(p => nm(p.pieza) !== nm(st.planPieza)); st.planPieza = ''; st.planBorr = null; guardar(); return; }
        if (b.dataset.calSub) { st.sub = b.dataset.calSub; st.planPieza = ''; st.planBorr = null; return render(); }
        if (b.dataset.calPer) { st.per = b.dataset.calPer; return render(); }
        if (b.dataset.calCausa != null) { st.causa = st.causa === b.dataset.calCausa ? '' : b.dataset.calCausa; return render(); }
        if (b.dataset.calLib) return abrirLiberacion({ maq: b.dataset.calLib });
        if (b.dataset.calResolver) return resolverRetencion(b.dataset.calResolver);
        if (b.dataset.calPlanpz) { st.sub = 'planes'; st.planPieza = b.dataset.calPlanpz; st.planBorr = null; return render(); }
        if (b.dataset.calNc) { const n = Q.ncs.find(x => x.id === b.dataset.calNc); if (n) abrirNc(n); return; }
        if (b.dataset.calNcf) { st.ncFiltro = b.dataset.calNcf; return render(); }
        if (b.dataset.calCdel) { leerBorrador(); st.planBorr.controles = st.planBorr.controles.filter(c => c.id !== b.dataset.calCdel); return render(); }
        if (b.dataset.calCmov) { leerBorrador(); const C = st.planBorr.controles, i = C.findIndex(c => c.id === b.dataset.calCmov), j = i + Number(b.dataset.d); if (i >= 0 && j >= 0 && j < C.length) { const t = C[i]; C[i] = C[j]; C[j] = t; } return render(); }
        if (b.dataset.calInstdel) { if (!confirm('¿Quitar este instrumento?')) return; Q.instrumentos = Q.instrumentos.filter(i => i.id !== b.dataset.calInstdel); return guardar(); }
        if (b.dataset.calInstcal) { const i = Q.instrumentos.find(x => x.id === b.dataset.calInstcal); if (!i) return; const r = prompt(`${i.codigo}: ¿hasta cuándo vale la nueva calibración? (dd/mm/aaaa)`, ''); if (!r) return; const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(r.trim()); if (!m) { toast('Escribí la fecha como dd/mm/aaaa'); return; } i.vence = `${m[3]}-${pad(m[2])}-${pad(m[1])}`; i.calibrado = hoy(); return guardar(); }
        if (b.dataset.calFoto) { verFoto(b.dataset.calFoto); }
        if (b.dataset.calHoja) { const [m, pz, f] = b.dataset.calHoja.split('|'); hojaDia(m, pz, f); }
      });
      document.addEventListener('input', e => {
        const t = e.target; if (!t || !t.closest || !t.closest('#viewCalidad')) return;
        if (t.id === 'calPlanBuscar' || t.id === 'calLibQ') {
          if (t.id === 'calPlanBuscar') st.buscarPlan = t.value; else st.libQ = t.value;
          const id = t.id, pos = t.selectionStart; render(); const n = $(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) { } }
        }
      });
      document.addEventListener('submit', e => {
        if (!e.target || e.target.id !== 'calInstForm') return; e.preventDefault();
        const cod = $('calInstCod').value.trim().toUpperCase(); if (!cod) return;
        if (Q.instrumentos.some(i => i.codigo === cod)) { toast('Ya existe un instrumento con ese código'); return; }
        Q.instrumentos.push({ id: nid('in'), codigo: cod.slice(0, 20), nombre: $('calInstNom').value.trim().slice(0, 40), vence: $('calInstVence').value || '' });
        guardar();
      });
      async function verFoto(id) {
        const w = document.createElement('div'); w.className = 'fixed inset-0 z-[9990] flex items-center justify-center bg-black/90 p-4'; w.innerHTML = '<div class="text-slate-300">Cargando foto…</div>';
        w.addEventListener('click', () => w.remove()); document.body.appendChild(w);
        try { const d = await inoferCloudPost({ token: inoferAuthToken(), action: 'fotoLeer', id }); w.innerHTML = d && d.foto ? `<img src="${d.foto}" class="max-h-full max-w-full rounded-xl" />` : '<div class="text-slate-300">No se encontró la foto.</div>'; } catch (e) { w.innerHTML = '<div class="text-slate-300">No se pudo traer la foto (¿sin internet?).</div>'; }
      }

      // ---------- Mi máquina (tablet): botón grande de control de calidad
      function bloqueMiMaq(m) {
        const e = estadoMaq(m); if (e.est === 'sinop' || e.est === 'sinplan') return '';
        const c = ESTADO[e.est].c;
        const cls = { emerald: 'border-emerald-500/60 bg-emerald-500/10 text-emerald-100', amber: 'border-amber-400 bg-amber-500/15 text-amber-100', rose: 'border-rose-500 bg-rose-500/20 text-rose-100', slate: 'border-cyan-400/70 bg-cyan-500/10 text-cyan-100' }[c];
        const t = e.est === 'falta' ? '🧪 LIBERAR PRIMERA PIEZA' : (e.est === 'retenido' ? '⛔ RETENIDA · ESPERÁ AL SUPERVISOR' : (e.est === 'atrasado' ? '🧪 HACER EL CONTROL (ATRASADO)' : '🧪 CONTROL DE CALIDAD'));
        return `<button type="button" id="calMmBtn" data-m="${esc(m)}" class="w-full rounded-3xl border-2 ${cls} px-4 py-5 text-xl font-black active:scale-[0.98]">${t}<span class="mt-1 block text-sm font-bold opacity-80">${ESTADO[e.est].t(e)}</span></button>`;
      }
      function pintarMiMaq() {
        const v = $('viewMiMaq'); if (!v || v.classList.contains('hidden')) return;
        let m = ''; try { m = localStorage.getItem('tablero_inyectoras_mimaquina_v1') || ''; } catch (e) { }
        const ref = $('mmCargar'); if (!m || !ref || !P.controlar()) { const x = $('calMmBox'); if (x) x.remove(); return; }
        const html = bloqueMiMaq(m);
        let box = $('calMmBox');
        if (!box) { box = document.createElement('div'); box.id = 'calMmBox'; ref.parentElement.parentElement.insertBefore(box, ref.parentElement); }
        if (box.__html !== html) { box.innerHTML = html; box.__html = html; }
      }
      document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('#calMmBtn'); if (!b) return; const m = b.dataset.m; abrirLiberacion({ maq: m }); });

      // ---------- avisos 🔔
      window.inoferAvisosExtra = (window.inoferAvisosExtra || []).concat([() => {
        if (!P.ver()) return [];
        const L = [];
        MAQS().forEach(m => { const e = estadoMaq(m);
          if (e.est === 'retenido') L.push({ id: 'cal-ret-' + e.ult.id, ico: '⛔', color: 'rose', txt: `Pieza <b>retenida</b> en la <b>${esc(m)}</b>: ${esc(e.o.part)}`, sub: `${esc(motivoRetencion(e.ult))} · ${esc(corto(e.ult.por))} ${esc(e.ult.hora || '')}`, acciones: [['cal', 'Ver']] });
          else if (e.est === 'atrasado' && e.min >= 15) L.push({ id: 'cal-atr-' + m + '-' + e.prox, ico: '🧪', color: 'amber', txt: `Control de calidad atrasado en la <b>${esc(m)}</b> (${esc(e.o.part)})`, sub: `Tocaba a las ${hhmm(new Date(e.prox))}`, acciones: [['cal', 'Ver']] });
          else if (e.est === 'falta' && e.o.montada && e.o.montada.maq === m && Date.now() - Date.parse(e.o.montada.desde) > 30 * 60000) L.push({ id: 'cal-pp-' + m + '-' + e.o.id, ico: '🧪', color: 'amber', txt: `Falta liberar la primera pieza en la <b>${esc(m)}</b> (${esc(e.o.part)})`, sub: `OP puesta desde las ${hhmm(new Date(e.o.montada.desde))}`, acciones: [['cal', 'Ver']] });
        });
        Q.ncs.filter(n => !n.cierre).forEach(n => { const v = accionesVencidas(n); if (v.length) L.push({ id: 'cal-nc-' + n.id + '-' + v.length, ico: '⚠️', color: 'amber', txt: `<b>${esc(n.num)}</b>: ${v.length} acción${v.length > 1 ? 'es' : ''} vencida${v.length > 1 ? 's' : ''}`, sub: esc(v[0].t + (v[0].resp ? ' · ' + v[0].resp : '')), acciones: [['cal', 'Ver']] }); });
        instrumentosAviso().forEach(i => { const d = difDias(i.vence, hoy()); L.push({ id: 'cal-in-' + i.id + '-' + i.vence, ico: '📏', color: d < 0 ? 'rose' : 'sky', txt: `Calibración de <b>${esc(i.codigo)}</b> ${d < 0 ? 'vencida' : 'por vencer'}`, sub: d < 0 ? `Venció hace ${-d} días` : `Vence en ${d} días`, acciones: [['cal', 'Ver']] }); });
        return L;
      }]);
      document.addEventListener('click', e => {
        const b = e.target.closest && e.target.closest('#inoferAvisosPanel [data-a="cal"]'); if (!b) return;
        e.stopImmediatePropagation(); const p = $('inoferAvisosPanel'); if (p) p.classList.add('hidden');
        const id = b.dataset.id || ''; st.sub = /cal-nc-/.test(id) ? 'ncs' : (/cal-in-/.test(id) ? 'planes' : 'tablero'); st.planPieza = '';
        switchTab('calidad');
      }, true);

      // ---------- arranque
      function iniciar() {
        try { montarVista(); instalarTab(); envolverNube(); } catch (e) { console.error(e); }
        const mm = $('viewMiMaq');
        if (mm && !mm.__cal) { mm.__cal = true; new MutationObserver(() => { if (!$('calMmBox') && $('mmCargar')) { try { pintarMiMaq(); } catch (e) { } } }).observe(mm, { childList: true, subtree: false }); }
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(iniciar, 30)); else setTimeout(iniciar, 30);
      window.addEventListener('load', () => setTimeout(iniciar, 250));
      setInterval(() => { if (document.hidden) return; try { pintarMiMaq(); if (visible() && st.sub === 'tablero' && !(document.activeElement && document.activeElement.closest && document.activeElement.closest('#viewCalidad'))) { const h = $('calHoy'); if (h) render(); } } catch (e) { } }, 60000);

      window.inoferCalidad = { abrirLiberacion, estadoMaq, planDe, guardarLib, nuevaNc, abrirNc, guardarNc, etapa, buscarLote, imprimir8D, produccion, resolverRetencion, puedeVer: () => P.ver(), datos: () => Q, guardar, evaluar, abrirPlan, guardarPlan, estado: () => st, lb: () => LB, planHoja, hojaCfg, hojaDia, parsDe };
    })();
