  <script>
    // =====================================================================
    // PORTAMOLDE COMPARTIDO: piezas que son versiones del mismo molde base
    // (ej. 34111-PB y 34548-PB) no pueden estar en máquina al mismo tiempo.
    // =====================================================================
    function inoferPmNorm(v) { return String(v || '').trim().toUpperCase(); }
    function inoferCatDe(part) {
      const p = String(part || '').trim().toLowerCase();
      return (partsCatalog || []).find(x => String(x.part || '').toLowerCase() === p) || null;
    }
    function inoferPortamoldeDe(part) { const c = inoferCatDe(part); return c ? inoferPmNorm(c.portamolde) : ''; }
    function inoferPortamoldeHermanas(item) {
      const pm = inoferPmNorm(item && item.portamolde);
      if (!pm) return [];
      return (partsCatalog || []).filter(x => x !== item && x.id !== item.id && inoferPmNorm(x.portamolde) === pm);
    }
    function inoferActualizarListaPortamoldes() {
      const dl = document.getElementById('inoferPortamoldeList');
      if (!dl) return;
      const grupos = {};
      (partsCatalog || []).forEach(x => { const pm = inoferPmNorm(x.portamolde); if (pm) (grupos[pm] = grupos[pm] || []).push(x.part); });
      dl.innerHTML = Object.keys(grupos).sort().map(pm => `<option value="${inoferEsc(pm)}">${inoferEsc(grupos[pm].join(', '))}</option>`).join('');
    }

    /** Conflictos del Gantt: el mismo portamolde programado el mismo día en máquinas distintas. */
    function inoferConflictosGantt(week) {
      const out = [];
      if (!week || !week.machines) return out;
      const porDia = {}; // pm -> día -> [{mach, part}]
      GANTT_MACHINES_CONFIG.forEach(mc => {
        ((week.machines[mc.id] || {}).items || []).forEach(it => {
          const pm = inoferPortamoldeDe(it.part);
          if (!pm) return;
          (it.dailyQty || []).forEach((q, d) => {
            if (!(Number(q) > 0)) return;
            const k = pm + '|' + d;
            (porDia[k] = porDia[k] || []).push({ mach: mc.short || mc.id, part: it.part });
          });
        });
      });
      const dias = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
      let fechas = null;
      try { fechas = getWeekDaysDates(week.startDate || '2026-09-14'); } catch (e) { }
      Object.keys(porDia).forEach(k => {
        const lista = porDia[k];
        const maqs = [...new Set(lista.map(x => x.mach))];
        if (maqs.length < 2) return;
        const [pm, d] = k.split('|');
        const f = fechas && fechas[Number(d)] ? (fechas[Number(d)].label || fechas[Number(d)].iso || '') : '';
        out.push({ pm, dia: (dias[Number(d)] || ('día ' + d)) + (f && !String(f).startsWith(dias[Number(d)]) ? ' ' + f : ''), lista });
      });
      return out;
    }

    /** Conflictos en órdenes "En Proceso": mismo portamolde en máquinas distintas a la vez. */
    function inoferConflictosOrdenes() {
      const grupos = {};
      (productionOrders || []).filter(o => /proceso/i.test(o.status || '')).forEach(o => {
        const pm = inoferPortamoldeDe(o.part);
        if (pm) (grupos[pm] = grupos[pm] || []).push(o);
      });
      return Object.keys(grupos).filter(pm => new Set(grupos[pm].map(o => o.machine)).size > 1 || grupos[pm].length > 1)
        .map(pm => ({ pm, ordenes: grupos[pm] }));
    }

    function inoferAvisoBox(id, contenedorId, html) {
      const cont = document.getElementById(contenedorId);
      if (!cont) return;
      let box = document.getElementById(id);
      if (!html) { if (box) box.remove(); return; }
      if (!box) {
        box = document.createElement('div'); box.id = id;
        box.className = 'rounded-2xl border border-orange-500/50 bg-orange-500/10 p-3.5 text-xs text-orange-100 shadow';
        cont.insertBefore(box, cont.firstChild);
      }
      box.innerHTML = html;
    }

    function inoferRevisarPortamoldes() {
      try {
        const semana = getActiveGanttWeek();
        const piezasR = inoferPiezasRenGantt(semana);
        const cambios = inoferCambiosVersion(semana);
        inoferAvisoBox('inoferPmAvisoR', 'viewGantt', piezasR.length ? `
          <div class="mb-1 flex flex-wrap items-center justify-between gap-2"><span class="text-sm font-extrabold text-orange-300">🚫 Piezas -R en el Gantt (no se inyectan)</span>
          <button type="button" onclick="inoferQuitarPiezasR()" class="del-gantt-item-btn rounded-lg bg-orange-500 px-3 py-1 text-[11px] font-extrabold text-slate-950 hover:bg-orange-400">Quitarlas del Gantt</button></div>
          <p class="text-orange-200/80">${piezasR.map(x => `${inoferEsc(x.part)} (${inoferEsc(x.mach)})`).join(', ')}</p>` : '');
        inoferAvisoBox('inoferPmAvisoVersion', 'viewGantt', cambios.length ? `
          <div class="mb-1 text-sm font-extrabold text-sky-300">🔧 Cambios de versión en portamoldes esta semana</div>
          <ul class="list-disc space-y-0.5 pl-5 text-sky-100">${cambios.map(c => `<li>${inoferEsc(c.part)} en la <b>${inoferEsc(c.mach)}</b>: el portamolde <b>${inoferEsc(c.pm)}</b> tiene armada la ${inoferEsc(c.arm)} → hay que cambiar la versión</li>`).join('')}</ul>` : '');
        const cv = document.getElementById('inoferPmAvisoVersion'); if (cv) cv.className = 'rounded-2xl border border-sky-500/40 bg-sky-500/10 p-3.5 text-xs shadow';
        const cg = inoferConflictosGantt(semana);
        inoferAvisoBox('inoferPmAvisoGantt', 'viewGantt', cg.length ? `
          <div class="mb-1 text-sm font-extrabold text-orange-300">⚠️ Portamolde en uso en dos máquinas a la vez</div>
          <p class="mb-1.5 text-orange-200/80">Estas piezas salen del mismo molde base y no pueden estar en máquina al mismo tiempo. Mové una de ellas a otro día o a la misma máquina (como cambio de versión).</p>
          <ul class="list-disc space-y-0.5 pl-5">${cg.map(c => `<li><b>${inoferEsc(c.dia)}</b> · Portamolde <b>${inoferEsc(c.pm)}</b>: ${c.lista.map(x => `${inoferEsc(x.part)} en <b>${inoferEsc(x.mach)}</b>`).join(' y ')}</li>`).join('')}</ul>` : '');
      } catch (e) { }
      try {
        const co = inoferConflictosOrdenes();
        inoferAvisoBox('inoferPmAvisoOrdenes', 'viewOrders', co.length ? `
          <div class="mb-1 text-sm font-extrabold text-orange-300">⚠️ Órdenes en proceso con el mismo portamolde</div>
          <p class="mb-1.5 text-orange-200/80">Estas órdenes usan piezas del mismo molde base: no se pueden producir al mismo tiempo.</p>
          <ul class="list-disc space-y-0.5 pl-5">${co.map(c => `<li>Portamolde <b>${inoferEsc(c.pm)}</b>: ${c.ordenes.map(o => `OP ${inoferEsc(o.ordNumber)} (${inoferEsc(o.part)} · ${inoferEsc(o.machine)})`).join(' y ')}</li>`).join('')}</ul>` : '');
      } catch (e) { }
    }

    function inoferInfoPortamoldeForm() {
      const inp = document.getElementById('cat_portamolde'), info = document.getElementById('cat_portamolde_info');
      if (!inp || !info) return;
      const pm = inoferPmNorm(inp.value);
      const parte = (document.getElementById('cat_part')?.value || '').trim().toLowerCase();
      if (!pm) { info.innerHTML = 'Dejalo vacío si el molde es único. Escribí el mismo código en todas las piezas que salen del mismo portamolde (ej: 34111-PB y 34548-PB).'; return; }
      const otras = (partsCatalog || []).filter(x => inoferPmNorm(x.portamolde) === pm && String(x.part || '').toLowerCase() !== parte).map(x => x.part);
      info.innerHTML = otras.length
        ? `Comparte portamolde con: <b class="text-orange-200">${inoferEsc(otras.join(', '))}</b> → no se podrán programar en máquina al mismo tiempo.`
        : 'Es la primera pieza con este portamolde. Poné el mismo código en las otras versiones.';
    }

    function inoferNumCod(x) { const m = String(x || '').match(/^\s*0*(\d+)/); return m ? m[1] : ''; }
    let _inoferIdxMB = null;
    function inoferIndiceMoldesBase() {
      if (_inoferIdxMB) return _inoferIdxMB;
      const exacto = {}, porNumero = {};
      INOFER_MOLDES_BASE.forEach(([base, ver]) => {
        if (/no se usa/i.test(ver)) return;
        const n = inoferNormCod(ver);
        if (!exacto[n]) exacto[n] = base;
        // versión "pura" (número, o número con una aclaración): vale para todas las piezas con ese número
        if (/^\d+(\s*\(.*\)|\s+[A-Za-zÁÉÍÓÚáéíóú ]+)?$/.test(ver)) { const k = inoferNumCod(ver); if (k && !porNumero[k]) porNumero[k] = base; }
      });
      return (_inoferIdxMB = { exacto, porNumero });
    }
    function inoferPortamoldeSegunListado(part) {
      const idx = inoferIndiceMoldesBase();
      const n = inoferNormCod(part);
      if (idx.exacto[n]) return idx.exacto[n];
      const conSufijo = Object.keys(idx.exacto).find(k => /[\/-]/.test(k) && (n === k || n.startsWith(k + '-') || n.startsWith(k + '/')));
      if (conSufijo) return idx.exacto[conSufijo];
      return idx.porNumero[inoferNumCod(part)] || '';
    }
    /** Completa el portamolde de las piezas que no lo tienen, según el listado. */
    function inoferAplicarMoldesBase() {
      const r = { asignadas: 0, yaTenian: 0, sinDato: 0 };
      (partsCatalog || []).forEach(x => {
        const pm = inoferPortamoldeSegunListado(x.part);
        if (!pm) { r.sinDato++; return; }
        if (inoferPmNorm(x.portamolde)) { r.yaTenian++; return; }
        x.portamolde = inoferPmNorm(pm); r.asignadas++;
      });
      return r;
    }
    function inoferCargarListadoMoldesBase(silencioso) {
      const r = inoferAplicarMoldesBase();
      if (r.asignadas) { savePartsCatalog(); try { renderPartsCatalogView(); } catch (e) { } }
      try { localStorage.setItem('tablero_inyectoras_moldesbase_v1', '1'); } catch (e) { }
      if (!silencioso || r.asignadas) showToast(`Moldes base cargados: ${r.asignadas} piezas nuevas con portamolde · ${r.yaTenian} ya lo tenían · ${r.sinDato} sin dato en el listado`);
      return r;
    }
    // Se aplica solo una vez, después de recibir la base de piezas de la nube (para no pisar cambios de otros)
    const _inoferApplyModsMB = window.applyCloudModules;
    if (typeof _inoferApplyModsMB === 'function') {
      window.applyCloudModules = function () {
        const out = _inoferApplyModsMB.apply(this, arguments);
        try {
          let hecho = false; try { hecho = localStorage.getItem('tablero_inyectoras_moldesbase_v1') === '1'; } catch (e) { }
          if (!hecho && inoferSession && inoferCan('catalogo', 'edit') && (partsCatalog || []).length) {
            setTimeout(() => inoferCargarListadoMoldesBase(true), 800);
          }
        } catch (e) { }
        return out;
      };
    }
    // Pieza nueva: se completa sola el portamolde si está en el listado
    document.addEventListener('input', ev => {
      if (!ev.target || ev.target.id !== 'cat_part') return;
      const pmInp = document.getElementById('cat_portamolde');
      if (!pmInp || (pmInp.value && !pmInp.dataset.auto)) return;
      const pm = inoferPortamoldeSegunListado(ev.target.value);
      pmInp.value = pm ? inoferPmNorm(pm) : ''; pmInp.dataset.auto = pm ? '1' : '';
      inoferInfoPortamoldeForm();
    });

    // ---------- piezas -R: no se inyectan
    function inoferEsPiezaR(part) { return /-R(?![A-Za-z])/i.test(String(part || '').trim()); }

    // ---------- versión armada en cada portamolde
    function inoferGruposPortamolde() {
      const g = {};
      (partsCatalog || []).forEach(x => { const pm = inoferPmNorm(x.portamolde); if (pm) (g[pm] = g[pm] || []).push(x); });
      return g;
    }
    function inoferArmadaDe(pm) {
      const lista = inoferGruposPortamolde()[inoferPmNorm(pm)] || [];
      const a = lista.find(x => x.armada);
      return a ? a.part : '';
    }
    function inoferSetArmada(pm, part) {
      const lista = inoferGruposPortamolde()[inoferPmNorm(pm)] || [];
      lista.forEach(x => { x.armada = String(x.part) === String(part); });
      savePartsCatalog();
      try { renderPartsCatalogView(); } catch (e) { }
      try { renderGanttView(); } catch (e) { }
      showToast(part ? `Portamolde ${inoferPmNorm(pm)}: ahora está armada la ${part}` : `Portamolde ${inoferPmNorm(pm)}: sin versión armada`);
    }
    function inoferRenderPanelPortamoldes() {
      const cat = document.getElementById('orderSubViewCatalog');
      if (!cat) return;
      let box = document.getElementById('inoferPanelPortamoldes');
      if (!box) {
        box = document.createElement('div'); box.id = 'inoferPanelPortamoldes';
        box.className = 'rounded-2xl border border-orange-500/30 bg-slate-900/80 p-4 shadow-xl';
        const form = document.getElementById('catalogForm');
        const ancla = form ? (form.closest('#orderSubViewCatalog > *') || form) : null;
        if (ancla && ancla.parentNode === cat) cat.insertBefore(box, ancla.nextSibling); else cat.insertBefore(box, cat.firstChild);
      }
      const gTodos = inoferGruposPortamolde();
      const g = {}; let unicos = 0;
      Object.keys(gTodos).forEach(k => { if (gTodos[k].length > 1) g[k] = gTodos[k]; else unicos++; });
      const claves = Object.keys(g).sort((a, b) => a.localeCompare(b, 'es', { numeric: true }));
      box.innerHTML = `
        <div class="mb-2 flex flex-wrap items-center justify-between gap-2">
          <div><div class="text-sm font-extrabold text-orange-300">🧩 Portamoldes compartidos — versión armada</div>
          <div class="text-[11px] text-slate-400">Elegí qué pieza está armada hoy en cada portamolde. El Gantt avisa cuando programás otra versión (hace falta cambio de versión).</div></div>
          <div class="flex flex-wrap items-center gap-2">
            <span class="rounded-lg bg-orange-500/15 px-2.5 py-1 text-[11px] font-bold text-orange-200">${claves.length} con varias versiones${unicos ? ` · ${unicos} de versión única` : ''}</span>
            <button type="button" id="inoferCargarMBBtn" onclick="inoferCargarListadoMoldesBase()" class="rounded-lg border border-orange-500/40 bg-orange-500/10 px-2.5 py-1 text-[11px] font-bold text-orange-200 hover:bg-orange-500/20" title="Completa el portamolde de las piezas que todavía no lo tienen">📥 Aplicar listado de moldes base</button>
            <input type="text" id="inoferPmFiltro" placeholder="Buscar portamolde o pieza…" value="${inoferEsc(window.__inoferPmFiltro || '')}" class="w-44 rounded-lg border border-slate-700 bg-slate-950 px-2 py-1 text-[11px] text-white" />
          </div>
        </div>
        ${claves.length ? `<div class="max-h-96 overflow-auto"><table class="w-full text-left text-xs">
          <thead><tr class="text-[10px] uppercase tracking-wider text-slate-400"><th class="py-1.5 pr-3">Portamolde</th><th class="py-1.5 pr-3">Versiones (piezas)</th><th class="py-1.5">Armada hoy</th></tr></thead>
          <tbody>${claves.filter(pm => { const f = (window.__inoferPmFiltro || '').toLowerCase(); return !f || pm.toLowerCase().includes(f) || g[pm].some(x => String(x.part).toLowerCase().includes(f)); }).map(pm => {
            const arm = (g[pm].find(x => x.armada) || {}).part || '';
            return `<tr class="border-t border-slate-800">
              <td class="py-2 pr-3 font-extrabold text-orange-200">${inoferEsc(pm)}</td>
              <td class="py-2 pr-3 text-slate-300">${g[pm].map(x => `<span class="mr-1 inline-block rounded bg-slate-800 px-1.5 py-0.5 ${x.part === arm ? 'text-orange-200 font-bold' : ''}">${inoferEsc(x.part)}</span>`).join('')}</td>
              <td class="py-2"><select data-pm-armada="${inoferEsc(pm)}" class="inofer-pm-armada-select rounded-lg border border-orange-500/40 bg-slate-950 px-2 py-1 text-xs font-bold text-orange-200">
                <option value="">— Sin definir —</option>
                ${g[pm].map(x => `<option value="${inoferEsc(x.part)}" ${x.part === arm ? 'selected' : ''}>${inoferEsc(x.part)}</option>`).join('')}
              </select></td></tr>`;
          }).join('')}</tbody></table></div>`
        : '<p class="text-[11px] text-slate-500">Todavía no hay piezas con portamolde. Cargalo en el campo "🧩 Portamolde" de cada pieza.</p>'}`;
      const fi = document.getElementById('inoferPmFiltro');
      if (fi) fi.addEventListener('input', () => { window.__inoferPmFiltro = fi.value; const pos = fi.selectionStart; inoferRenderPanelPortamoldes(); const n = document.getElementById('inoferPmFiltro'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } } });
      try { inoferLockControls(); } catch (e) { }
    }
    document.addEventListener('change', ev => {
      const el = ev.target;
      if (el && el.classList && el.classList.contains('inofer-pm-armada-select')) inoferSetArmada(el.dataset.pmArmada, el.value);
    });

    // ---------- Gantt: piezas -R y cambios de versión
    function inoferPiezasRenGantt(week) {
      const out = [];
      if (!week || !week.machines) return out;
      Object.keys(week.machines).forEach(m => ((week.machines[m] || {}).items || []).forEach(it => { if (inoferEsPiezaR(it.part)) out.push({ mach: m, part: it.part }); }));
      return out;
    }
    function inoferCambiosVersion(week) {
      const out = [];
      if (!week || !week.machines) return out;
      Object.keys(week.machines).forEach(m => ((week.machines[m] || {}).items || []).forEach(it => {
        const pm = inoferPortamoldeDe(it.part); if (!pm) return;
        const arm = inoferArmadaDe(pm);
        if (arm && arm.toLowerCase() !== String(it.part).toLowerCase() && (it.dailyQty || []).some(q => Number(q) > 0)) out.push({ mach: m, part: it.part, pm, arm });
      }));
      return out;
    }
    function inoferQuitarPiezasR() {
      const w = getActiveGanttWeek(); if (!w) return;
      let n = 0;
      Object.keys(w.machines || {}).forEach(m => { const it = (w.machines[m] || {}).items || []; const quedan = it.filter(x => !inoferEsPiezaR(x.part)); n += it.length - quedan.length; w.machines[m].items = quedan; });
      saveGanttWeeks(); renderGanttView();
      showToast(`Se quitaron ${n} pieza${n === 1 ? '' : 's'} -R del Gantt (quedan en la papelera)`);
    }

    // ---------- bloqueos al cargar el Gantt a mano
    function inoferChoqueManual(week, part, mach, dias) {
      const pm = inoferPortamoldeDe(part);
      if (!pm || !week || !week.machines) return null;
      for (const m of Object.keys(week.machines)) {
        if (m === mach) continue;
        for (const it of ((week.machines[m] || {}).items || [])) {
          if (inoferPortamoldeDe(it.part) !== pm) continue;
          const d = dias.find(i => Number((it.dailyQty || [])[i]) > 0);
          if (d !== undefined) return { pm, otra: it.part, mach: m, dia: d };
        }
      }
      return null;
    }
    const INOFER_DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
    document.addEventListener('submit', ev => {
      if (!ev.target || ev.target.id !== 'ganttAssignForm') return;
      const part = (document.getElementById('ganttModalPart')?.value || '').trim();
      const mach = document.getElementById('ganttModalMachine')?.value;
      if (inoferEsPiezaR(part)) {
        ev.preventDefault(); ev.stopImmediatePropagation();
        showToast(`🚫 ${part} es una pieza -R: no se inyecta, no se puede cargar en el Gantt`);
        return;
      }
      const dias = [0, 1, 2, 3, 4, 5, 6].filter(i => Number(document.getElementById('ganttDayQty_' + i)?.value) > 0);
      const c = inoferChoqueManual(getActiveGanttWeek(), part, mach, dias);
      if (c) {
        ev.preventDefault(); ev.stopImmediatePropagation();
        showToast(`🚫 No se puede: ${part} y ${c.otra} comparten el portamolde ${c.pm} y la ${c.otra} ya está el ${INOFER_DIAS[c.dia]} en la ${c.mach}. Elegí otro día o la misma máquina.`);
      }
    }, true);
    document.addEventListener('input', ev => {
      const inp = ev.target;
      if (!inp || !inp.classList || !inp.classList.contains('gantt-item-qty-input')) return;
      const val = parseInt(inp.value) || 0;
      if (val <= 0) return;
      const week = getActiveGanttWeek(); if (!week) return;
      const mach = inp.getAttribute('data-mach'), idx = Number(inp.getAttribute('data-item-idx')), dia = Number(inp.getAttribute('data-day'));
      const item = (((week.machines || {})[mach] || {}).items || [])[idx];
      if (!item) return;
      const c = inoferChoqueManual(week, item.part, mach, [dia]);
      if (c) {
        ev.stopImmediatePropagation();
        inp.value = (item.dailyQty || [])[dia] || 0;
        showToast(`🚫 El ${INOFER_DIAS[dia]} el portamolde ${c.pm} ya está en la ${c.mach} con la ${c.otra}. No pueden estar en máquina a la vez.`);
      }
    }, true);

    // Enganches con las pantallas existentes
    ['renderGanttView', 'renderPartsCatalogView', 'renderProductionOrdersView'].forEach(fn => {
      const orig = window[fn];
      if (typeof orig !== 'function') return;
      window[fn] = function () {
        const r = orig.apply(this, arguments);
        try { inoferActualizarListaPortamoldes(); inoferRevisarPortamoldes(); if (fn === 'renderPartsCatalogView') inoferRenderPanelPortamoldes(); } catch (e) { }
        return r;
      };
    });
    const _inoferSaveCatOrig = window.savePartsCatalog;
    if (typeof _inoferSaveCatOrig === 'function') {
      window.savePartsCatalog = function () { const r = _inoferSaveCatOrig.apply(this, arguments); try { inoferActualizarListaPortamoldes(); inoferRevisarPortamoldes(); } catch (e) { } return r; };
    }
    const _inoferSaveGanttOrig = window.saveGanttWeeks;
    if (typeof _inoferSaveGanttOrig === 'function') {
      window.saveGanttWeeks = function () {
        const r = _inoferSaveGanttOrig.apply(this, arguments);
        try {
          inoferRevisarPortamoldes();
          const c = inoferConflictosGantt(getActiveGanttWeek());
          if (c.length) showToast(`⚠️ Ojo: ${c[0].lista.map(x => x.part).join(' y ')} comparten portamolde (${c[0].pm}) y quedaron el mismo día en máquinas distintas`);
        } catch (e) { }
        return r;
      };
    }

    document.addEventListener('change', ev => {
      const el = ev.target;
      if (!el || !el.classList || !el.classList.contains('inline-portamolde-input')) return;
      const item = (partsCatalog || []).find(x => String(x.id) === String(el.dataset.inlinePortamolde));
      if (!item) return;
      item.portamolde = inoferPmNorm(el.value);
      savePartsCatalog();
      try { renderPartsCatalogView(); } catch (e) { }
      const h = inoferPortamoldeHermanas(item);
      showToast(item.portamolde ? `Portamolde ${item.portamolde} guardado${h.length ? ' · comparte con ' + h.map(x => x.part).join(', ') : ''}` : 'Pieza marcada como molde único');
    });
    document.addEventListener('input', ev => {
      if (ev.target && (ev.target.id === 'cat_portamolde' || ev.target.id === 'cat_part')) inoferInfoPortamoldeForm();
    });
    window.addEventListener('DOMContentLoaded', () => { setTimeout(() => { inoferActualizarListaPortamoldes(); inoferRevisarPortamoldes(); }, 300); });
  </script>
